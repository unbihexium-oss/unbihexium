# Abstract
# --------
# One summary per model family of the Unbihexium model zoo: task,
# architecture, input bands, outputs, licence and status. Every family
# has four size variants (tiny, base, large and mega). Starter models
# have untrained weights and must be trained before use; reference
# models compute an exact spectral index formula.
#
# Generated from src/unbihexium/zoo/catalog.yaml by
# `python -m unbihexium.zoo.sync`. Do not edit by hand.
# =============================================================================

