# Abstract
# --------
# This file is the single source of truth for package metadata, dependencies
# and tool configuration. It follows:
#
# - PEP 517 / PEP 518  build system declaration
# - PEP 621            project metadata in pyproject.toml
# - PEP 639            SPDX licence expression and licence files
# - PEP 508            dependency specifiers with environment markers
#
# Dependency policy (reviewed September 2026): Unbihexium supports CPython
# 3.10 to 3.14 (see VERSIONING.md). Lower bounds are chosen with three rules,
# and the highest resulting version wins:
#
# 1. Compiled packages: the first release that publishes CPython 3.14 wheels,
#    so that no compiler is needed on any supported Python version.
# 2. Pure Python packages: the release that was current when Python 3.14 was
#    released on 2025-10-07.
# 3. Security: the first release without known vulnerabilities in the PyPI
#    advisory database at the time of review.
#
# Several scientific packages dropped Python 3.10 in their newest releases.
# For those, an environment marker keeps a lower bound that still supports
# Python 3.10, so installers pick the newest compatible release per
# interpreter. Upper bounds are intentionally not set; Dependabot and the CI
# matrix detect incompatible releases.
#
# requirements.txt and requirements-dev.txt contain fully resolved lock files
# generated from this file with `make lock` for reproducible environments;
# run it after every change to the dependencies below.
# =============================================================================

# PEP 517 build backend and its own requirements.
[build-system]
# hatchling 1.27 is the first release with PEP 639 licence expression support.
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"  # Module that pip and uv call to build the package.

# Core metadata of the distribution (PEP 621).
[project]
name = "unbihexium"  # Distribution name on PyPI.
version = "2.0.1"  # Release version; keep in sync with CHANGELOG.md and CITATION.cff.
description = "Earth observation, geospatial, remote sensing and SAR library for Python"  # Summary shown on PyPI.
readme = "README.md"  # Long description shown on PyPI.
requires-python = ">=3.10"  # Oldest supported interpreter.
license = "MPL-2.0"  # SPDX licence expression (PEP 639).
license-files = ["LICENSE.txt", "NOTICE", "NOTICE.md"]  # Files copied into the distribution metadata.
authors = [  # Copyright holder of the project.
    {name = "Unbihexium OSS Foundation", email = "yunus.z.imanov@helsinki.fi"},  # Foundation and contact address.
]
maintainers = [  # Person responsible for releases.
    {name = "Olaf Yunus Laitinen Imanov", email = "yunus.z.imanov@helsinki.fi"},  # Lead maintainer.
]
keywords = [  # Search terms on PyPI.
    "earth-observation",  # Satellite and airborne observation of the Earth.
    "geospatial",  # Geographic data in general.
    "remote-sensing",  # Optical and multispectral imagery.
    "sar",  # Synthetic aperture radar.
    "satellite-imagery",  # Imagery from satellites.
    "gis",  # Geographic information systems.
    "machine-learning",  # Classical machine learning.
    "deep-learning",  # Neural network models of the model zoo.
    "object-detection",  # Detection task of the model zoo.
    "segmentation",  # Segmentation task of the model zoo.
    "change-detection",  # Change detection between acquisitions.
    "flood-mapping",  # Flood extent mapping application.
    "agriculture",  # Agricultural monitoring application.
    "urban-planning",  # Urban analysis application.
    "environmental-monitoring",  # Environmental monitoring application.
]
# Licence classifiers are superseded by the SPDX expression in `license`
# (PEP 639) and are therefore not listed.
classifiers = [
    "Development Status :: 5 - Production/Stable",  # Stable public API.
    "Environment :: Console",  # Command line interface.
    "Environment :: GPU :: NVIDIA CUDA",  # Optional CUDA acceleration.
    "Framework :: FastAPI",  # REST service in unbihexium.serving.
    "Intended Audience :: Developers",  # Library users who write code.
    "Intended Audience :: Science/Research",  # Researchers in Earth observation.
    "Natural Language :: English",  # Language of the documentation.
    "Operating System :: OS Independent",  # Linux, macOS and Windows.
    "Programming Language :: Python :: 3",  # Python 3.
    "Programming Language :: Python :: 3 :: Only",  # No Python 2 support.
    "Programming Language :: Python :: 3.10",  # Tested in CI.
    "Programming Language :: Python :: 3.11",  # Tested in CI.
    "Programming Language :: Python :: 3.12",  # Tested in CI.
    "Programming Language :: Python :: 3.13",  # Tested in CI.
    "Programming Language :: Python :: 3.14",  # Tested in CI.
    "Programming Language :: Python :: Implementation :: CPython",  # Only CPython is tested.
    "Topic :: Scientific/Engineering :: GIS",  # Geographic information systems.
    "Topic :: Scientific/Engineering :: Image Processing",  # Raster and image processing.
    "Topic :: Scientific/Engineering :: Artificial Intelligence",  # Machine learning models.
    "Typing :: Typed",  # Ships a py.typed marker (PEP 561).
]

# -----------------------------------------------------------------------------
# Runtime dependencies
# -----------------------------------------------------------------------------
dependencies = [
    # Arrays and scientific computing. numpy 2.3, scipy 1.16, pyproj 3.7.2 and
    # scikit-image 0.26 require Python 3.11 or newer.
    "numpy>=2.2.6; python_version < '3.11'",
    "numpy>=2.3.3; python_version >= '3.11'",  # N-dimensional arrays.
    "scipy>=1.15.3; python_version < '3.11'",  # Last scipy series for Python 3.10.
    "scipy>=1.16.2; python_version >= '3.11'",  # Filters, interpolation and statistics.
    # Geospatial input and output, geometry and projections.
    "rasterio>=1.4.4",
    "shapely>=2.1.2",  # Vector geometry operations through GEOS.
    "geopandas>=1.1.2",  # Vector data frames.
    "pyproj>=3.7.1; python_version < '3.11'",  # Last pyproj release for Python 3.10.
    "pyproj>=3.7.2; python_version >= '3.11'",  # Coordinate reference systems through PROJ.
    # Command line interface and terminal output.
    "click>=8.3.3",
    "rich>=14.1.0",  # Tables and progress output in the terminal.
    # Configuration, validation and serialisation.
    "pydantic>=2.12.0",
    "pyyaml>=6.0.3",  # YAML configuration and the model catalogue.
    # HTTP client of the STAC search (unbihexium.io.stac) and of models
    # registered with a URL.
    "requests>=2.33.0",
    # Image processing: PNG quicklooks and legends (pillow) and morphology,
    # segmentation and filters (scikit-image).
    "pillow>=12.3.0",
    "scikit-image>=0.25.2; python_version < '3.11'",  # Last scikit-image series for Python 3.10.
    "scikit-image>=0.26.0; python_version >= '3.11'",  # Morphology, segmentation and filters.
]

# -----------------------------------------------------------------------------
# Optional dependencies (extras)
# -----------------------------------------------------------------------------
[project.optional-dependencies]
# ONNX Runtime inference for the model zoo (CPU execution provider).
# onnxruntime 1.24 declares Python 3.10 support but publishes no CPython 3.10
# wheels, so Python 3.10 is held on the 1.23 series.
onnx = [
    "onnxruntime>=1.23.2,<1.24; python_version < '3.11'",  # Last series with CPython 3.10 wheels.
    "onnxruntime>=1.24.1; python_version >= '3.11'",  # ONNX inference engine.
    # Reads the model configuration stored in exported ONNX files.
    "onnx>=1.21.0",
]
# PyTorch backend for training and inference. For a GPU, install the CUDA
# build of PyTorch from https://pytorch.org/get-started/locally/ first.
torch = [
    "torch>=2.13.0",  # Tensors, autograd and neural network layers.
    # Writes the model configuration into exported ONNX files.
    "onnx>=1.21.0",
]
# REST serving with FastAPI (unbihexium.serving). starlette is pinned
# explicitly because releases before 1.3.1 have known vulnerabilities.
serving = [
    "fastapi>=0.133.0",  # Web framework of the REST API.
    "starlette>=1.3.1",  # ASGI toolkit under FastAPI; first release without known vulnerabilities.
    "uvicorn[standard]>=0.37.0",  # ASGI server with uvloop and httptools.
]
# Chunked array storage. zarr 3 and numcodecs 0.16 require Python 3.11.
# zarr 3.1.4 is the first zarr 3 release that installs a working crc32c codec
# (google-crc32c) together with numcodecs 0.16.
zarr = [
    "zarr>=2.18.3; python_version < '3.11'",  # Last zarr 2 series for Python 3.10.
    "zarr>=3.1.4; python_version >= '3.11'",  # Chunked, compressed array storage.
    "numcodecs>=0.13.1; python_version < '3.11'",  # Codecs matching zarr 2.
    "numcodecs>=0.16.4; python_version >= '3.11'",  # Codecs matching zarr 3.
]
# GeoParquet and Arrow input and output.
parquet = [
    "pyarrow>=23.0.1",  # Arrow tables and Parquet files.
]
# Test suite (tests/).
test = [
    "pytest>=9.0.3",  # Test runner.
    "pytest-cov>=7.0.0",  # Coverage measurement in pytest.
    "pytest-xdist>=3.8.0",  # Parallel test execution (`-n auto`).
    "httpx>=0.28.1",  # Client of the FastAPI test client.
]
# Development tools used locally and in CI.
dev = [
    "unbihexium[test]",  # Everything needed to run the tests.
    "ruff>=0.14.0",  # Linter and formatter.
    "pyright>=1.1.406",  # Static type checker.
    "scipy-stubs>=1.18.1.1; python_version >= '3.12'",  # SciPy types for pyright; need Python 3.12.
    "pre-commit>=4.3.0",  # Git hook manager.
    "bandit[toml]>=1.8.6",  # Security linter that reads this file.
    "pip-audit>=2.9.0",  # Vulnerability audit of the lock files.
    "build>=1.3.0",  # PEP 517 build frontend.
    "twine>=6.2.0",  # Distribution checks and upload.
    "tox>=4.30.3",  # Test environment manager (tox.ini).
    # reuse and yamllint are GPL-3.0-or-later (reuse in part). The licence
    # policy in .github/dependency-review-config.yml denies GPL licences for
    # every dependency scope, so both run in isolated environments created
    # by pre-commit and tox instead of being installed here.
]
# Every extra.
all = [
    "unbihexium[onnx,torch,serving,zarr,parquet,dev]",  # Every optional feature and the tools.
]

# Console commands installed with the package.
[project.scripts]
unbihexium = "unbihexium.cli.main:main"  # Entry point of the command line interface.

# Links shown in the sidebar of the PyPI page.
[project.urls]
Documentation = "https://github.com/unbihexium-oss/unbihexium/tree/main/docs"  # User and developer documentation.
Repository = "https://github.com/unbihexium-oss/unbihexium"  # Source code.
Issues = "https://github.com/unbihexium-oss/unbihexium/issues"  # Bug reports and feature requests.
Changelog = "https://github.com/unbihexium-oss/unbihexium/blob/main/CHANGELOG.md"  # Release notes.
Security = "https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md"  # How to report vulnerabilities.

# =============================================================================
# Build configuration (hatchling)
# =============================================================================

# Contents of the source distribution.
[tool.hatch.build.targets.sdist]
# The source distribution contains the package, the model zoo metadata and
# assets, and every document needed to satisfy the MPL-2.0 and REUSE.
include = [
    "/src",  # Package sources.
    "/model_zoo",  # Model cards, checksums and manifests.
    "/tests",  # Test suite, so that downstream packagers can run it.
    "/LICENSE.txt",  # MPL-2.0 licence text.
    "/NOTICE",  # Plain text notice.
    "/NOTICE.md",  # Notice in Markdown.
    "/THIRD_PARTY_NOTICES.md",  # Licences of bundled third-party material.
    "/REUSE.toml",  # REUSE licensing information.
    "/README.md",  # Long description.
    "/CHANGELOG.md",  # Release notes.
    "/CITATION.cff",  # Citation metadata.
]

# Contents of the wheel.
[tool.hatch.build.targets.wheel]
packages = ["src/unbihexium"]  # Install the package from the src layout.

# =============================================================================
# Ruff: linting and formatting (https://docs.astral.sh/ruff/)
# =============================================================================

# Settings shared by the ruff linter and formatter.
[tool.ruff]
# Generate code compatible with the oldest supported Python version.
target-version = "py310"
line-length = 100  # Maximum line length, also set in .editorconfig.
src = ["src"]  # Treat src/ as first-party code when sorting imports.

# Rule selection of the linter.
[tool.ruff.lint]
select = [  # Rule families that are enforced.
    "E",  # pycodestyle errors.
    "W",  # pycodestyle warnings.
    "F",  # pyflakes: undefined names and similar errors.
    "I",  # isort: import order.
    "B",  # flake8-bugbear: likely bugs.
    "C4",  # flake8-comprehensions: simpler comprehensions.
    "UP",  # pyupgrade: modern syntax for the target version.
    "ARG",  # flake8-unused-arguments.
    "SIM",  # flake8-simplify.
    "TC",  # flake8-type-checking: imports for annotations.
    "PTH",  # flake8-use-pathlib: prefer pathlib.
    "RUF",  # Ruff-specific rules.
    "ANN",  # flake8-annotations: missing type hints.
    "S",  # flake8-bandit: security issues.
]
ignore = [  # Individual rules that are switched off for the whole code base.
    "ANN001",  # Missing type annotation for argument.
    "ANN002",  # Missing type annotation for *args.
    "ANN003",  # Missing type annotation for **kwargs.
    "ANN201",  # Missing return type for public function.
    "ANN202",  # Missing return type for private function.
    "ANN204",  # Missing return type for special method.
    "ANN205",  # Missing return type for static method.
    "ANN401",  # Dynamically typed expressions (Any) are allowed.
    "B007",  # Loop control variable not used.
    "B904",  # raise in except clause without from.
    "B905",  # zip() without explicit strict parameter.
    "E741",  # Ambiguous variable name.
    "F401",  # Imported but unused.
    "F403",  # Star imports used.
    "F405",  # May be undefined from star import.
    "F841",  # Local variable assigned but never used.
    "S101",  # Use of assert detected.
    "S104",  # Possible binding to all interfaces.
    "S113",  # Requests call without timeout.
    "ARG001",  # Unused function argument.
    "ARG002",  # Unused method argument.
    "ARG005",  # Unused lambda argument.
    "PTH123",  # open() should be Path.open().
    "RUF012",  # Mutable class attributes.
    "RUF022",  # __all__ is not sorted.
    "RUF059",  # Unpacked variable never used.
    "SIM102",  # Use single if statement.
    "SIM105",  # Use contextlib.suppress.
    "SIM108",  # Use ternary operator.
    "TC001",  # Move application import into type-checking block.
    "TC002",  # Move third-party import into type-checking block.
    "TC003",  # Move standard library import into type-checking block.
    "UP035",  # Import from collections.abc.
    "W293",  # Blank line contains whitespace.
]

# Rules switched off for some paths only.
[tool.ruff.lint.per-file-ignores]
# Tests use assert, fixtures without docstrings and magic values by design.
"tests/**" = ["S", "ANN", "ARG"]

# Import sorting.
[tool.ruff.lint.isort]
known-first-party = ["unbihexium"]  # Sort unbihexium imports after third-party imports.

# Formatter settings.
[tool.ruff.format]
quote-style = "double"  # Prefer double quotes for strings.
indent-style = "space"  # Indent with spaces.
line-ending = "lf"  # Write LF line endings, as .gitattributes stores them.

# =============================================================================
# Pyright: static type checking (https://microsoft.github.io/pyright/)
# =============================================================================

# Static type checker settings.
[tool.pyright]
include = ["src"]  # Check the package sources only.
exclude = ["**/__pycache__"]  # Skip bytecode caches.
# Check against the oldest supported Python version.
pythonVersion = "3.10"
typeCheckingMode = "standard"  # Standard checks; strict mode also rejects the untyped geospatial libraries.
reportMissingImports = true  # Fail when an import cannot be resolved.
reportMissingTypeStubs = false  # Allow third-party packages without type stubs.

# =============================================================================
# Pytest (https://docs.pytest.org/)
# =============================================================================

# Test runner settings.
[tool.pytest.ini_options]
minversion = "9.0"  # Refuse to run with an older pytest.
testpaths = ["tests"]  # Collect tests from tests/ by default.
pythonpath = ["src"]  # Import the package from src/ without installing it.
addopts = [  # Options added to every pytest run.
    "-ra",  # Summarise every test that did not pass.
    "-q",  # Quiet output.
    "--strict-markers",  # Reject markers that are not registered; none are used.
    "--strict-config",  # Reject unknown configuration keys.
]

# =============================================================================
# Coverage.py (https://coverage.readthedocs.io/)
# =============================================================================

# Coverage measurement.
[tool.coverage.run]
source = ["src/unbihexium"]  # Measure the package only.
branch = true  # Measure branch coverage as well as line coverage.
parallel = true  # Write one data file per process for pytest-xdist.

# Coverage report.
[tool.coverage.report]
show_missing = true  # List the line numbers that were not executed.
# Fail a run under coverage (pytest --cov, the Coverage workflow) below this
# percentage of lines and branches; measured at 87 % on 2026-09-24.
fail_under = 85
skip_covered = false  # Also list files with full coverage.
exclude_lines = [  # Lines matching these patterns do not count as missed.
    "pragma: no cover",  # Explicit exclusion.
    "def __repr__",  # Debug representations.
    "raise AssertionError",  # Unreachable invariant checks.
    "raise NotImplementedError",  # Abstract placeholders.
    "if TYPE_CHECKING:",  # Imports for the type checker only.
    "if __name__ == .__main__.:",  # Script entry points.
    "@abstractmethod",  # Abstract methods.
]

# =============================================================================
# Bandit: security linting (https://bandit.readthedocs.io/)
# =============================================================================

# Security linter settings.
[tool.bandit]
exclude_dirs = ["tests", "benchmarks"]  # Test and benchmark code is not shipped.
# B101: assert statements are used for internal invariants, not for security.
skips = ["B101"]

