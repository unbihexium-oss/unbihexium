# Abstract
# --------
# tox runs the test suite and the quality checks in isolated virtual
# environments, one per Python version or task. It complements the Makefile
# and reproduces the CI workflows in .github/workflows/.
#
# Usage
#   tox                      run the default environments listed in env_list
#   tox -e py313             run the tests on Python 3.13 only
#   tox -e lint,type         run selected environments
#   tox -e py314 -- -k zarr  pass extra arguments to pytest after "--"
#   tox -p auto              run environments in parallel
#   tox list                 list every environment with its description
#
# Requirements
#   tox 4.30 or newer and the Python interpreters for the environments you
#   run. Missing interpreters are skipped instead of failing
#   (skip_missing_interpreters).
#
# Pytest, coverage, ruff, pyright and bandit read their settings from
# pyproject.toml; this file only defines the environments. A `#` after a
# value would become part of the value, so every comment stands on its own
# line above the key it explains.
# =============================================================================

# Settings of tox itself.
[tox]
# Minimum tox version; an older tox provisions this one first.
requires =
    tox>=4.30.3
# Environments run by a plain `tox`: every supported Python plus the checks.
env_list =
    py310
    py311
    py312
    py313
    py314
    lint
    type
    licence
# Skip Python versions that are not installed instead of failing.
skip_missing_interpreters = true
# Build the package in an isolated environment as PEP 517 requires.
isolated_build = true

# -----------------------------------------------------------------------------
# Test environments (py310 to py314)
# Install the package with the test and optional I/O extras so that the zarr,
# ONNX Runtime and serving code paths are exercised.
# -----------------------------------------------------------------------------
[testenv]
# Text shown by `tox list`.
description = run the test suite with coverage on {base_python}
# Test the built wheel rather than the source tree, as users install it.
package = wheel
# Build the wheel once in the shared .pkg environment for all versions.
wheel_build_env = .pkg
# Optional dependency groups from pyproject.toml installed with the package.
extras =
    test
    onnx
    serving
    zarr
# Skip .pyc files and give each environment its own coverage data file.
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
# Host variables passed into the environment: CI flags and Unbihexium settings.
pass_env =
    CI
    GITHUB_*
    UNBIHEXIUM_*
# Run the tests; arguments after "--" replace the default coverage options.
commands =
    pytest tests {posargs:--cov=src/unbihexium --cov-report=term-missing}

# -----------------------------------------------------------------------------
# Lowest supported dependency versions
# Installs the lower bounds from pyproject.toml with uv to prove that they
# still work. Requires uv on PATH.
# -----------------------------------------------------------------------------
[testenv:lowest]
# Text shown by `tox list`.
description = run the tests against the lowest allowed direct dependency versions
# The lowest versions are only guaranteed on the oldest supported Python.
base_python = py310
# uv installs the package below, so tox must not install it.
skip_install = true
# Allow tox to call the uv executable from the host.
allowlist_externals = uv
# Install the package with the lowest direct dependency versions.
commands_pre =
    uv pip install --python {env_python} --resolution lowest-direct -e ".[test,onnx,serving,zarr]"
# Run the tests with any extra pytest arguments.
commands =
    pytest tests {posargs}

# -----------------------------------------------------------------------------
# Code quality
# -----------------------------------------------------------------------------
# Lint and format checks.
[testenv:lint]
# Text shown by `tox list`.
description = lint and check formatting with ruff
# ruff only reads the sources, so the package is not installed.
skip_install = true
# Linter and formatter.
deps =
    ruff>=0.14.0
# Lint, then check the formatting without changing files.
commands =
    ruff check src tests
    ruff format --check src tests

# Rewrite the sources in place with ruff.
[testenv:format]
# Text shown by `tox list`.
description = format the code with ruff and apply safe fixes
# ruff only rewrites the sources, so the package is not installed.
skip_install = true
# Linter and formatter.
deps =
    ruff>=0.14.0
# Reformat, then apply the fixes that ruff considers safe.
commands =
    ruff format src tests
    ruff check --fix src tests

# Static type checking.
[testenv:type]
# Text shown by `tox list`.
description = type check the package with pyright
# Static type checker; the package itself is installed so that imports resolve.
deps =
    pyright>=1.1.406
# Check the package with the settings from pyproject.toml.
commands =
    pyright src

# Security scans of the code and the locked dependencies.
[testenv:security]
# Text shown by `tox list`.
description = scan the code with bandit and the locked dependencies with pip-audit
# Both tools read files only, so the package is not installed.
skip_install = true
# Static security scanner with TOML support, and the vulnerability auditor.
deps =
    bandit[toml]>=1.8.6
    pip-audit>=2.9.0
# Scan the sources, then audit both lock files without installing them.
commands =
    bandit -c pyproject.toml -r src
    pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
    pip-audit -r requirements-dev.txt --no-deps --disable-pip --progress-spinner off

# Licence compliance.
[testenv:licence]
# Text shown by `tox list`.
description = check REUSE compliance and the MPL-2.0 notices
# The checks read files only, so the package is not installed.
skip_install = true
# REUSE compliance tool.
deps =
    reuse>=6.1.2
# Copy the licence text for REUSE, lint, then check the MPL-2.0 notices.
commands =
    # REUSE expects the licence text in LICENSES/; the repository keeps it
    # only in LICENSE.txt, so a git-ignored copy is made for the check.
    python -c "import os, shutil; os.makedirs('LICENSES', exist_ok=True); shutil.copyfile('LICENSE.txt', 'LICENSES/MPL-2.0.txt')"
    reuse lint
    python .github/scripts/check_license_headers.py

# Repository policy checks.
[testenv:policy]
# Text shown by `tox list`.
description = check the text policy, YAML style and the model zoo
# The checks read files only, so the package is not installed.
skip_install = true
# YAML linter.
deps =
    yamllint>=1.37.1
# Run the repository policy checks in the order of the CI workflow.
commands =
    python .github/scripts/check_text_policy.py
    yamllint --strict --config-file .yamllint.yml .
    python .github/scripts/check_model_zoo.py

# -----------------------------------------------------------------------------
# Packaging
# -----------------------------------------------------------------------------
[testenv:build]
# Text shown by `tox list`.
description = build the sdist and wheel and validate them with twine
# The package is built, not installed.
skip_install = true
# PEP 517 build frontend and the distribution checker.
deps =
    build>=1.3.0
    twine>=6.2.0
# Build into the temporary directory of the environment, then validate.
commands =
    python -m build --outdir {env_tmp_dir}{/}dist
    python -m twine check --strict {env_tmp_dir}{/}dist{/}*

