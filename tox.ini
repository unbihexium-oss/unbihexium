# =============================================================================
# tox configuration for Unbihexium
# =============================================================================
#
# tox runs the test suite and the quality checks in isolated virtual
# environments, one per Python version or task. It complements the Makefile
# and reproduces the CI workflows in .github/workflows/.
#
# Usage
#   tox                      run the default environments listed in env_list
#   tox -e py313             run the tests on Python 3.13 only
#   tox -e lint,type         run selected environments
#   tox -e py314 -- -k zarr  pass extra arguments to pytest after "--"
#   tox -p auto              run environments in parallel
#   tox list                 list every environment with its description
#
# Requirements
#   tox 4.30 or newer and the Python interpreters for the environments you
#   run. Missing interpreters are skipped instead of failing
#   (skip_missing_interpreters).
#
# Pytest, coverage, ruff, pyright and bandit read their settings from
# pyproject.toml; this file only defines the environments.
# =============================================================================

[tox]
requires =
    tox>=4.30.3
env_list =
    py310
    py311
    py312
    py313
    py314
    lint
    type
    licence
skip_missing_interpreters = true
isolated_build = true

# -----------------------------------------------------------------------------
# Test environments (py310 to py314)
# Install the package with the test and optional I/O extras so that the zarr,
# ONNX Runtime and serving code paths are exercised.
# -----------------------------------------------------------------------------
[testenv]
description = run the test suite with coverage on {base_python}
package = wheel
wheel_build_env = .pkg
extras =
    test
    onnx
    serving
    zarr
set_env =
    PYTHONDONTWRITEBYTECODE = 1
    COVERAGE_FILE = {work_dir}{/}.coverage.{env_name}
pass_env =
    CI
    GITHUB_*
    UNBIHEXIUM_*
commands =
    pytest tests {posargs:--cov=src/unbihexium --cov-report=term-missing}

# -----------------------------------------------------------------------------
# Lowest supported dependency versions
# Installs the lower bounds from pyproject.toml with uv to prove that they
# still work. Requires uv on PATH.
# -----------------------------------------------------------------------------
[testenv:lowest]
description = run the tests against the lowest allowed direct dependency versions
base_python = py310
skip_install = true
allowlist_externals = uv
commands_pre =
    uv pip install --python {env_python} --resolution lowest-direct -e ".[test,onnx,serving,zarr]"
commands =
    pytest tests {posargs}

# -----------------------------------------------------------------------------
# Code quality
# -----------------------------------------------------------------------------
[testenv:lint]
description = lint and check formatting with ruff
skip_install = true
deps =
    ruff>=0.14.0
commands =
    ruff check src tests
    ruff format --check src tests

[testenv:format]
description = format the code with ruff and apply safe fixes
skip_install = true
deps =
    ruff>=0.14.0
commands =
    ruff format src tests
    ruff check --fix src tests

[testenv:type]
description = type check the package with pyright
deps =
    pyright>=1.1.406
commands =
    pyright src

[testenv:security]
description = scan the code with bandit and the locked dependencies with pip-audit
skip_install = true
deps =
    bandit[toml]>=1.8.6
    pip-audit>=2.9.0
commands =
    bandit -c pyproject.toml -r src
    pip-audit -r requirements.txt --no-deps --disable-pip --progress-spinner off
    pip-audit -r requirements-dev.txt --no-deps --disable-pip --progress-spinner off

[testenv:licence]
description = check REUSE compliance and the MPL-2.0 notices
skip_install = true
deps =
    reuse>=6.1.2
commands =
    # REUSE expects the licence text in LICENSES/; the repository keeps it
    # only in LICENSE.txt, so a git-ignored copy is made for the check.
    python -c "import os, shutil; os.makedirs('LICENSES', exist_ok=True); shutil.copyfile('LICENSE.txt', 'LICENSES/MPL-2.0.txt')"
    reuse lint
    python .github/scripts/check_license_headers.py

[testenv:policy]
description = check the text policy, YAML style, notebooks and the model zoo
skip_install = true
deps =
    yamllint>=1.37.1
    nbformat>=5.10.4
commands =
    python .github/scripts/check_text_policy.py
    yamllint --strict --config-file .yamllint.yml .
    python .github/scripts/check_notebooks.py examples/notebooks
    python .github/scripts/check_model_zoo.py

# -----------------------------------------------------------------------------
# Packaging
# -----------------------------------------------------------------------------
[testenv:build]
description = build the sdist and wheel and validate them with twine
skip_install = true
deps =
    build>=1.3.0
    twine>=6.2.0
commands =
    python -m build --outdir {env_tmp_dir}{/}dist
    python -m twine check --strict {env_tmp_dir}{/}dist{/}*
