# yamllint configuration used by the Repository Config workflow.
extends: default

ignore: |
  deploy/helm/*/templates/

rules:
  line-length: disable
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  indentation:
    spaces: consistent
    indent-sequences: whatever
