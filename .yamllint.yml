# Abstract
# --------
# Rules for yamllint (https://yamllint.readthedocs.io/en/stable/configuration.html).
# Used by the Repository Config workflow (.github/workflows/repo-config.yml),
# the pre-commit hook and `make yaml-lint`, always in strict mode, so
# warnings fail as well as errors. The configuration starts from the default
# rule set and relaxes only the rules that conflict with GitHub Actions
# syntax, long URLs and the comment style of the repository.
# =============================================================================

extends: default  # Start from the default rule set of yamllint.

# Helm templates contain Go template expressions and are not valid YAML
# before rendering, so they are skipped (gitignore-style patterns).
ignore: |
  deploy/helm/*/templates/

rules:  # Changes to the default rules.
  # Long URLs, descriptions and shell commands in workflows cannot be wrapped
  # without changing their meaning.
  line-length: disable

  # A leading "---" document marker is optional and not used in this
  # repository.
  document-start: disable

  # GitHub Actions uses the key "on", which YAML 1.1 treats as a boolean.
  # Only values are checked.
  truthy:
    check-keys: false  # Do not flag keys such as "on".

  # Allow a single space between code and an inline comment, as written by
  # most editors and by Dependabot.
  comments:
    min-spaces-from-content: 1  # At least one space before the "#".

  # Comments may be indented to explain the following block.
  comments-indentation: disable

  # Sequences may be indented or not, but consistently within a file.
  indentation:
    spaces: consistent  # Same indentation width throughout a file.
    indent-sequences: whatever  # Indented and flush sequences are both accepted.

