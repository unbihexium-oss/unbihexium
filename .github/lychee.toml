# Abstract
# --------
# Read by the lychee link checker in .github/workflows/links.yml, which scans
# the documentation for broken links. The settings keep the run polite to
# remote servers, treat rate limiting and bot protection as reachable, and
# skip local addresses, example domains and the placeholder Zenodo DOI,
# which are not meant to resolve.
# =============================================================================

max_concurrency = 16  # Limit parallel requests to stay under rate limits.
max_retries = 2  # Retry a failed request twice before reporting it.
timeout = 20  # Give up on a request after 20 seconds.
include_mail = false  # Do not check mailto: addresses.

# Rate limiting (429) and bot protection (403) are not broken links.
accept = ["200..=299", "403", "429"]

# Regular expressions for URLs that are never checked.
exclude = [
    "^https?://localhost",  # Local development servers.
    "^https?://127\\.0\\.0\\.1",  # Loopback address.
    "^https?://0\\.0\\.0\\.0",  # Bind-all address in service examples.
    "^https?://example\\.(com|org)",  # Reserved example domains.
    "^https?://(www\\.)?doi\\.org/10\\.5281/zenodo\\.0000000",  # Placeholder DOI until the archive exists.
]

