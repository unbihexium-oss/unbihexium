# Abstract
# --------
# Read by actions/labeler in .github/workflows/labeler.yml, which adds labels
# to a pull request according to the files it changes. Each top-level key is
# a label name; the label is applied when any changed file matches any of
# its globs. Every label used here must exist in .github/labels.yml, since the
# labeler does not create labels. The labels then decide the section of the
# release notes (.github/release.yml) in which the change appears.
# =============================================================================

# Documentation, examples and any Markdown file.
documentation:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "docs/**"  # Documentation tree.
          - "examples/**"  # Example scripts and the example REST service.
          - "**/*.md"  # Markdown anywhere in the repository.

# Model zoo files and the code that loads and registers models.
model-zoo:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "model_zoo/**"  # Weights, manifests, model cards and checksums.
          - "src/unbihexium/zoo/**"  # Model download and verification code.
          - "src/unbihexium/registry/**"  # Capability and model registry.

# Tests and the tox environments that run them.
tests:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "tests/**"  # Test suite.
          - "tox.ini"  # Test environments.

# Continuous integration and repository automation.
ci:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - ".github/workflows/**"  # GitHub Actions workflows.
          - ".github/scripts/**"  # Policy and helper scripts used by the workflows.
          - ".pre-commit-config.yaml"  # Local hooks that mirror the CI checks.

# Packaging, build tooling and dependency pins.
build:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "pyproject.toml"  # Package metadata and build backend.
          - "requirements*.txt"  # Locked dependency lists.
          - "Makefile"  # Developer task shortcuts.
          - "tox.ini"  # Test environments.

# Container image and deployment manifests.
docker:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "Dockerfile"  # Container image definition.
          - "docker-compose.yml"  # Local multi-container setup.
          - ".dockerignore"  # Build context exclusions.
          - "deploy/**"  # Kubernetes and Helm manifests.

# Dependency pin changes, in addition to the Dependabot label.
dependencies:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "requirements*.txt"  # Locked dependency lists.

# Licence, legal, citation and policy documents.
compliance:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "LICENSE.txt"  # Project licence text.
          - "NOTICE"  # Plain-text legal notice.
          - "NOTICE.md"  # Readable legal notice.
          - "THIRD_PARTY_NOTICES.md"  # Third-party licences.
          - "COMPLIANCE.md"  # Compliance statement.
          - "PRIVACY.md"  # Privacy statement.
          - "CITATION.cff"  # Machine-readable citation metadata.
          - "CITATION.md"  # Citation guidance.
          - "codemeta.json"  # CodeMeta software metadata.
          - "REUSE.toml"  # REUSE licensing annotations.
          - "RESPONSIBLE_USE.md"  # Responsible use policy.

# Security policy, scanners and security metadata.
security:
  - changed-files:  # Match against the files changed by the pull request.
      - any-glob-to-any-file:  # Label when any changed file matches any glob.
          - "SECURITY.md"  # Vulnerability reporting policy.
          - ".github/workflows/security.yml"  # Dependency, licence and code scanning.
          - ".github/workflows/secret-scan.yml"  # Secret scanning.
          - ".github/workflows/container-scan.yml"  # Container image scanning.
          - ".github/workflows/scorecard.yml"  # OpenSSF Scorecard.
          - ".github/dependency-review-config.yml"  # Dependency Review policy.
          - "security-insights.yml"  # OpenSSF Security Insights metadata.

