  - type: markdown
    attributes:
      value: |
        ## Regulatory confirmations

        Confirm every statement. Each link opens the exact article or section it refers to.

  - type: checkboxes
    id: confirm-gdpr
    attributes:
      label: "GDPR confirmations (Regulation (EU) 2016/679)"
      description: |
        Applies to any processing of personal data. Full text: [GDPR](https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng).
      options:
        - label: "My processing follows the principles in [Article 5](https://gdpr-info.eu/art-5-gdpr/), including data minimisation and purpose limitation."
          required: true
        - label: "Any processing has a lawful basis under [Article 6](https://gdpr-info.eu/art-6-gdpr/) and, for special categories, a condition under [Article 9](https://gdpr-info.eu/art-9-gdpr/)."
          required: true
        - label: "Data subjects are informed as required by [Articles 13 and 14](https://gdpr-info.eu/art-13-gdpr/) and automated decisions follow [Article 22](https://gdpr-info.eu/art-22-gdpr/)."
          required: true
        - label: "I apply data protection by design and by default under [Article 25](https://gdpr-info.eu/art-25-gdpr/) and security measures under [Article 32](https://gdpr-info.eu/art-32-gdpr/)."
          required: true
        - label: "I carry out a DPIA where required by [Article 35](https://gdpr-info.eu/art-35-gdpr/)."
          required: true
        - label: "International transfers of personal data comply with [Chapter V, Articles 44 to 49](https://gdpr-info.eu/art-44-gdpr/)."
          required: true
        - label: "This bug report contains no personal data of third parties."
          required: true

  - type: checkboxes
    id: confirm-aia
    attributes:
      label: "EU AI Act confirmations (Regulation (EU) 2024/1689)"
      description: |
        Applies to AI systems placed on the market, put into service or used in the EU. Full text: [EU AI Act](https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng).
      options:
        - label: "I do not use Unbihexium for any prohibited practice listed in [Article 5](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5), including untargeted scraping for facial recognition databases and real-time remote biometric identification."
          required: true
        - label: "If my system is high-risk under [Article 6](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6) and [Annex III](https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3), I meet the requirements of [Articles 9 to 15](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-9)."
          required: true
        - label: "As a deployer I follow [Article 26](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-26), including human oversight, and carry out a fundamental rights impact assessment under [Article 27](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-27) where required."
          required: true
        - label: "I meet the transparency obligations of [Article 50](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50) where they apply."
          required: true
        - label: "Staff dealing with the AI system have sufficient AI literacy as required by [Article 4](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4)."
          required: true
        - label: "I understand that the free and open-source exemptions in [Article 2(12)](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-2) and [Article 53(2)](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-53) do not cover high-risk or prohibited uses."
          required: true

  - type: checkboxes
    id: confirm-security
    attributes:
      label: "Cyber security and product liability confirmations"
      description: |
        Covers the [Cyber Resilience Act](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng), the [NIS2 Directive](https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng) and the [Product Liability Directive](https://eur-lex.europa.eu/eli/dir/2024/2853/oj/eng).
      options:
        - label: "I report vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) following [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), consistent with the coordinated vulnerability handling of [CRA Article 13](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_13) and [Article 14](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_14)."
          required: true
        - label: "If I place a product with digital elements that includes Unbihexium on the EU market, I meet the manufacturer obligations of [CRA Article 13](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_13) and the essential requirements of CRA Annex I."
          required: true
        - label: "I understand the role of open-source software stewards under [CRA Article 24](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_24)."
          required: true
        - label: "If my organisation is an essential or important entity, I apply the risk management measures of [NIS2 Article 21](https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng#art_21) and the reporting obligations of [NIS2 Article 23](https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng#art_23)."
          required: true
        - label: "I understand that free and open-source software supplied outside a commercial activity is excluded by [Product Liability Directive Article 2(2)](https://eur-lex.europa.eu/eli/dir/2024/2853/oj/eng#art_2) and that the software is provided without warranty under [MPL-2.0 Sections 6 and 7](https://www.mozilla.org/en-US/MPL/2.0/)."
          required: true

  - type: checkboxes
    id: confirm-export
    attributes:
      label: "Export control and sanctions confirmations"
      description: |
        Geospatial analytics and object detection can be dual-use.
      options:
        - label: "I comply with [Regulation (EU) 2021/821](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng), including authorisation requirements in [Article 3](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng#art_3), end-use controls in [Article 4](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng#art_4) and cyber-surveillance controls in [Article 5](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng#art_5)."
          required: true
        - label: "I comply with EU restrictive measures, including [Regulation (EU) No 833/2014](https://eur-lex.europa.eu/eli/reg/2014/833/oj/eng), [Article 2](https://eur-lex.europa.eu/eli/reg/2014/833/oj/eng#art_2) on dual-use goods and technology."
          required: true
        - label: "I comply with the US Export Administration Regulations, including [15 CFR 734.7](https://www.ecfr.gov/current/title-15/section-734.7) on published information and the end-use and end-user controls in [15 CFR Part 744](https://www.ecfr.gov/current/title-15/subtitle-B/chapter-VII/subchapter-C/part-744)."
          required: true
        - label: "I comply with US sanctions administered under [31 CFR Chapter V](https://www.ecfr.gov/current/title-31/subtitle-B/chapter-V)."
          required: true

  - type: checkboxes
    id: confirm-data
    attributes:
      label: "Geospatial data, open data and copyright confirmations"
      description: |
        Covers the terms under which Earth observation and geospatial data may be used.
      options:
        - label: "I use Copernicus data in line with [Regulation (EU) 2021/696 Article 55](https://eur-lex.europa.eu/eli/reg/2021/696/oj/eng#art_55) and [Delegated Regulation (EU) No 1159/2013](https://eur-lex.europa.eu/eli/reg_del/2013/1159/oj/eng), including attribution."
          required: true
        - label: "I respect access limitations on spatial data sets under [INSPIRE Directive Article 13](https://eur-lex.europa.eu/eli/dir/2007/2/oj/eng#art_13)."
          required: true
        - label: "I respect the conditions for re-use of public sector data under [Open Data Directive Article 14](https://eur-lex.europa.eu/eli/dir/2019/1024/oj/eng#art_14) and [Implementing Regulation (EU) 2023/138](https://eur-lex.europa.eu/eli/reg_impl/2023/138/oj/eng) on high-value datasets."
          required: true
        - label: "Any text and data mining for model training respects [DSM Directive Articles 3 and 4](https://eur-lex.europa.eu/eli/dir/2019/790/oj/eng#art_4), including rights reservations under Article 4(3)."
          required: true

  - type: checkboxes
    id: confirm-privacy-other
    attributes:
      label: "Other privacy law confirmations"
      description: |
        Covers telemetry and privacy regimes outside the GDPR.
      options:
        - label: "Any telemetry or storage of information on user devices complies with [ePrivacy Directive Article 5(3)](https://eur-lex.europa.eu/eli/dir/2002/58/oj/eng#art_5); Unbihexium telemetry is opt-in as described in [PRIVACY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/PRIVACY.md)."
