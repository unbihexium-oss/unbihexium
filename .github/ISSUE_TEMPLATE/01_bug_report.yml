name: "Bug report"
description: "Report a defect in the library, CLI, REST service, models or Docker image."
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## About this bug report

        Use this form to report a reproducible defect. For security vulnerabilities use a private security advisory instead.

        **How to complete this form**

        - Every question is mandatory. Answer each one as precisely as you can; write `N/A` in a text field only when the question genuinely does not apply.
        - Closed questions list every expected answer. If none fits, choose "Other (specify in the next field)" and describe your answer in the field that follows the question.
        - The declarations and regulatory confirmations near the end are required for every submission. Each confirmation links to the exact article or section it refers to.
        - Do not include secrets, access tokens, personal data or confidential data. Report security vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) as described in [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), never in a public issue.
        - By submitting you agree to follow the [Code of Conduct](https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md).

  - type: markdown
    attributes:
      value: |
        ## Bug classification

        Classify the defect so it reaches the right maintainer.

  - type: dropdown
    id: bug-module
    attributes:
      label: "Affected module"
      description: |
        Select every part of Unbihexium in which the defect appears.
      multiple: true
      options:
        - "unbihexium.ai (detection, segmentation, classification)"
        - "unbihexium.analysis (spatial and network analysis)"
        - "unbihexium.cli (command line interface)"
        - "unbihexium.config (configuration handling)"
        - "unbihexium.core (rasters, vectors, pipelines, tiling)"
        - "unbihexium.geostat (kriging, variograms, spatial statistics)"
        - "unbihexium.indices (NDVI, NDWI, EVI, NBR, MSI and others)"
        - "unbihexium.io (raster, vector and STAC input and output)"
        - "unbihexium.metrics (accuracy and quality metrics)"
        - "unbihexium.postprocessing"
        - "unbihexium.preprocessing (radiometric and geometric preparation)"
        - "unbihexium.registry (capability and model registry)"
        - "unbihexium.sar (SAR amplitude, phase and interferometry)"
        - "unbihexium.serving (FastAPI REST service)"
        - "unbihexium.terrain (DEM, DSM, DTM, slope, aspect)"
        - "unbihexium.utils"
        - "unbihexium.visualization"
        - "unbihexium.zoo (model download, verification and loading)"
        - "Model zoo assets (model_zoo/)"
        - "Documentation or example notebooks"
        - "Packaging, Docker image or CI configuration"
        - "Not sure"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-module-other
    attributes:
      label: "Affected module: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Affected module". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-domain
    attributes:
      label: "Affected capability domain"
      description: |
        Select the capability domain from [docs/capabilities](https://github.com/unbihexium-oss/unbihexium/blob/main/docs/capabilities/index.md).
      options:
        - "01 AI products (detection, segmentation, super-resolution)"
        - "02 Tourism and data processing"
        - "03 Indices, flood and water"
        - "04 Environment, forestry and image processing"
        - "05 Asset management and energy"
        - "06 Urban planning and agriculture"
        - "07 Risk and defense (neutral analytics)"
        - "08 Value-added imagery (DEM, orthorectification, mosaicking)"
        - "09 Benefits narrative and reporting"
        - "10 Satellite imagery features"
        - "11 Resolution, metadata and quality assurance"
        - "12 Radar and SAR"
        - "Cross-cutting or not domain specific"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-domain-other
    attributes:
      label: "Affected capability domain: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Affected capability domain". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-interface
    attributes:
      label: "Interface used"
      description: |
        Select the interface through which you triggered the defect.
      multiple: true
      options:
        - "Python API"
        - "Command line interface (unbihexium)"
        - "REST API (unbihexium.serving)"
        - "Official Docker image"
        - "Example notebook"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-interface-other
    attributes:
      label: "Interface used: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Interface used". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-type
    attributes:
      label: "Type of defect"
      description: |
        Select the category that best describes the defect.
      options:
        - "Crash or unhandled exception"
        - "Incorrect numerical or classification result"
        - "Wrong georeferencing (CRS, transform, extent)"
        - "Corrupted or incomplete output files"
        - "Memory leak or excessive memory use"
        - "Hang or deadlock"
        - "Installation or import failure"
        - "Behaviour contradicts the documentation"
        - "Incorrect error message or warning"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-type-other
    attributes:
      label: "Type of defect: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Type of defect". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-severity
    attributes:
      label: "Severity"
      description: |
        Select the severity. Critical means data loss, silent corruption of results or a security impact. Security defects must be reported through a [private advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new).
      options:
        - "Critical"
        - "High"
        - "Medium"
        - "Low"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-severity-other
    attributes:
      label: "Severity: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Severity". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-frequency
    attributes:
      label: "Frequency"
      description: |
        Select how often the defect occurs under the same conditions.
      options:
        - "Always"
        - "Often (more than half of the attempts)"
        - "Sometimes"
        - "Rarely"
        - "Occurred once"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-frequency-other
    attributes:
      label: "Frequency: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Frequency". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-regression
    attributes:
      label: "Regression"
      description: |
        Declare whether this worked in an earlier version.
      options:
        - "Yes, it worked in an earlier version"
        - "No, it never worked"
        - "Unknown"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-regression-other
    attributes:
      label: "Regression: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Regression". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: bug-last-good
    attributes:
      label: "Last working version"
      description: |
        If this is a regression, give the last version or commit in which it worked. Write `N/A` otherwise.
      placeholder: |
        1.0.0
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Description and reproduction

        Describe the defect so that a maintainer can reproduce it from scratch.

  - type: textarea
    id: bug-summary
    attributes:
      label: "Summary of the defect"
      description: |
        Describe the defect in two to five sentences: what you did, what happened and why it is wrong.
    validations:
      required: true

  - type: textarea
    id: bug-steps
    attributes:
      label: "Steps to reproduce"
      description: |
        List numbered steps starting from a clean environment. Include commands, configuration and inputs.
      placeholder: |
        1. pip install unbihexium==1.0.1
        2. unbihexium infer ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: bug-mre
    attributes:
      label: "Minimal reproducible example"
      description: |
        Paste the smallest self-contained code that reproduces the defect. Use synthetic arrays where possible so that no data files are needed.
      render: python
    validations:
      required: true

  - type: textarea
    id: bug-expected
    attributes:
      label: "Expected behaviour"
      description: |
        Describe what you expected, citing the documentation or a reference implementation where possible.
    validations:
      required: true

  - type: textarea
    id: bug-actual
    attributes:
      label: "Actual behaviour"
      description: |
        Describe what actually happened, including wrong values, shapes, CRS or file contents.
    validations:
      required: true

  - type: textarea
    id: bug-traceback
    attributes:
      label: "Full traceback or error output"
      description: |
        Paste the complete traceback or error output without truncation. Write `N/A` if there is none.
      render: shell
    validations:
      required: true

  - type: textarea
    id: bug-logs
    attributes:
      label: "Debug logs"
      description: |
        Paste logs produced with debug logging enabled (for example `--verbose` or `logging.DEBUG`). Write `N/A` if not available.
      render: text
    validations:
      required: true

  - type: dropdown
    id: bug-input-format
    attributes:
      label: "Input data format"
      description: |
        Select every input format involved.
      multiple: true
      options:
        - "GeoTIFF or Cloud Optimized GeoTIFF"
        - "Sentinel SAFE or JPEG2000"
        - "NetCDF"
        - "Zarr"
        - "HDF5"
        - "Shapefile"
        - "GeoPackage"
        - "GeoJSON"
        - "GeoParquet"
        - "STAC item or collection"
        - "NumPy array in memory"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-input-format-other
    attributes:
      label: "Input data format: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Input data format". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: bug-input-properties
    attributes:
      label: "Input data properties"
      description: |
        Give the dimensions, number of bands, data type, nodata value and file size of the input. Write `N/A` if no input data is involved.
      placeholder: |
        10980 x 10980, 4 bands, uint16, nodata 0, 480 MB
    validations:
      required: true

  - type: dropdown
    id: bug-crs
    attributes:
      label: "Coordinate reference system"
      description: |
        Select the coordinate reference system of the input.
      options:
        - "EPSG:4326 (WGS 84 geographic)"
        - "UTM zone (EPSG:326xx or 327xx)"
        - "EPSG:3857 (Web Mercator)"
        - "Other projected CRS"
        - "No CRS or pixel coordinates"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-crs-other
    attributes:
      label: "Coordinate reference system: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Coordinate reference system". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-clean-env
    attributes:
      label: "Reproduction in a clean environment"
      description: |
        Declare whether the defect reproduces in a fresh virtual environment with only Unbihexium installed.
      options:
        - "Reproduces in a clean environment"
        - "Does not reproduce in a clean environment"
        - "Not tried"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-clean-env-other
    attributes:
      label: "Reproduction in a clean environment: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Reproduction in a clean environment". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-docker-repro
    attributes:
      label: "Reproduction in the official Docker image"
      description: |
        Declare whether the defect reproduces in the official Docker image.
      options:
        - "Reproduces in the Docker image"
        - "Does not reproduce in the Docker image"
        - "Not tried"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-docker-repro-other
    attributes:
      label: "Reproduction in the official Docker image: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Reproduction in the official Docker image". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-determinism
    attributes:
      label: "Determinism"
      description: |
        Declare whether repeated runs with identical inputs give identical outputs.
      options:
        - "Deterministic"
        - "Non-deterministic"
        - "Not checked"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-determinism-other
    attributes:
      label: "Determinism: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Determinism". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-silent
    attributes:
      label: "Silent wrong results"
      description: |
        Declare whether the defect produces wrong results without any error or warning. Silent errors are prioritised because they can propagate into decisions.
      options:
        - "Yes, results are silently wrong"
        - "No, an error or warning is raised"
        - "Unknown"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-silent-other
    attributes:
      label: "Silent wrong results: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Silent wrong results". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-workaround
    attributes:
      label: "Workaround"
      description: |
        Declare whether you found a workaround.
      options:
        - "No workaround known"
        - "Workaround found and described below"
        - "Downgrading avoids the defect"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-workaround-other
    attributes:
      label: "Workaround: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Workaround". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: bug-workaround-details
    attributes:
      label: "Workaround details"
      description: |
        Describe the workaround and its drawbacks. Write `N/A` if there is none.
    validations:
      required: true

  - type: textarea
    id: bug-root-cause
    attributes:
      label: "Suspected root cause"
      description: |
        Describe any analysis of the cause, including the file and line you suspect. Write `N/A` if unknown.
    validations:
      required: true

  - type: dropdown
    id: bug-test-data
    attributes:
      label: "Availability of test data"
      description: |
        Declare whether you can share data that reproduces the defect.
      options:
        - "No data needed, the example uses synthetic data"
        - "Public open data, linked below"
        - "Can share privately with maintainers"
        - "Cannot share data"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-test-data-other
    attributes:
      label: "Availability of test data: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Availability of test data". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-affected-scope
    attributes:
      label: "Who is affected"
      description: |
        Select who is affected by the defect.
      options:
        - "Only me"
        - "My team"
        - "My whole organisation"
        - "Downstream users of my product"
        - "Probably every user of the affected feature"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-affected-scope-other
    attributes:
      label: "Who is affected: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Who is affected". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: bug-security-impact
    attributes:
      label: "Security impact"
      description: |
        Declare whether the defect could have a security impact. If yes, stop and use a [private security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) instead.
      options:
        - "No security impact"
        - "Possible security impact, reported privately as well"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: bug-security-impact-other
    attributes:
      label: "Security impact: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Security impact". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Submitter and context

        These questions help maintainers understand who is affected and how to prioritise the bug report. The answers are used for triage only.

  - type: dropdown
    id: role
    attributes:
      label: "Your role"
      description: |
        Select the role that best describes how you interact with Unbihexium in the context of this bug report.
      options:
        - "End user of the library or CLI"
        - "Application developer integrating the library"
        - "Researcher or academic"
        - "Data scientist or machine learning engineer"
        - "GIS or remote sensing analyst"
        - "Maintainer or regular contributor"
        - "Representative of an organisation (company, public body or NGO)"
        - "Student"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: role-other
    attributes:
      label: "Your role: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Your role". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: org-type
    attributes:
      label: "Organisation type"
      description: |
        Select the type of organisation on whose behalf you are submitting. Choose the individual option if you act in a private capacity.
      options:
        - "Individual, no organisation"
        - "Academic or research institution"
        - "Public sector body in the EU or EEA"
        - "Public sector body outside the EU or EEA"
        - "Private company, small or medium-sized enterprise"
        - "Private company, large enterprise"
        - "Non-profit organisation or NGO"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: org-type-other
    attributes:
      label: "Organisation type: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Organisation type". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: jurisdiction
    attributes:
      label: "Primary jurisdiction of use"
      description: |
        Select the jurisdiction in which you mainly use or distribute Unbihexium. This determines which of the regulatory questions below apply to you.
      options:
        - "EU or EEA member state"
        - "United Kingdom"
        - "Switzerland"
        - "United States"
        - "Canada"
        - "Other European country"
        - "Asia-Pacific"
        - "Middle East and North Africa"
        - "Sub-Saharan Africa"
        - "Latin America and the Caribbean"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: jurisdiction-other
    attributes:
      label: "Primary jurisdiction of use: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Primary jurisdiction of use". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: duplicates
    attributes:
      label: "Search for existing reports"
      description: |
        Confirm that you searched open and closed issues, pull requests and the documentation before creating this bug report.
      options:
        - "I searched and found no existing issue or pull request"
        - "I found related issues or pull requests and link them in the next question"
        - "I found a closed issue or pull request, but the subject is still open"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: duplicates-other
    attributes:
      label: "Search for existing reports: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Search for existing reports". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: "Related issues, pull requests and discussions"
      description: |
        List related issues, pull requests, discussions or external tickets as links or `#number` references, separated by commas. Write `N/A` if there are none.
      placeholder: |
        #123, #456, https://example.org/ticket/1
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "Impact on your work"
      description: |
        Select how strongly the subject of this bug report affects your work today.
      options:
        - "Blocking: I cannot continue without a resolution"
        - "Major: significant workaround or delay"
        - "Moderate: inconvenient but manageable"
        - "Minor: small inconvenience"
        - "Cosmetic or informational only"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: impact-other
    attributes:
      label: "Impact on your work: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Impact on your work". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Environment

        Describe the exact environment. Precise versions allow maintainers to reproduce the situation without additional round trips.

  - type: dropdown
    id: ubx-version
    attributes:
      label: "Unbihexium version"
      description: |
        Select the Unbihexium version you are using. Run `python -c "import unbihexium; print(unbihexium.__version__)"` if you are unsure.
      options:
        - "1.0.1 (latest release)"
        - "1.0.0"
        - "main branch (unreleased)"
        - "0.9.x"
        - "0.8.x or earlier"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: ubx-version-other
    attributes:
      label: "Unbihexium version: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Unbihexium version". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: version-string
    attributes:
      label: "Exact version string or commit SHA"
      description: |
        Paste the exact version string, and for source installations also the output of `git rev-parse HEAD`.
      placeholder: |
        1.0.1 / 3430ec9
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: "Installation method"
      description: |
        Select how Unbihexium was installed in the environment described here.
      options:
        - "PyPI with pip"
        - "PyPI with uv, pipx, poetry or pdm"
        - "conda or mamba (conda-forge)"
        - "Source checkout, editable install"
        - "Official Docker image"
        - "Custom container image"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: install-method-other
    attributes:
      label: "Installation method: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Installation method". Describe your answer precisely so maintainers do not need to ask a follow-up question.
