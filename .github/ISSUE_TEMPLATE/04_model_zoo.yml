# Abstract
# --------
# The "Model zoo" form of the issue chooser: report a model defect, integrity
# problem or request a new model.
# The form opens with instructions, asks classified questions (drop-down
# lists with an "Other" choice followed by a free-text field), then the
# technical details, and ends with the provenance declarations and the
# regulatory confirmations that every submission must tick. Markdown
# blocks explain each section; their text is part of the form, not code.
#
# Every question is mandatory unless its validation says otherwise. The
# `id` of an element is the key of the answer in the issue form data;
# keep it stable, because labelling and triage automation may read it.
# =============================================================================

name: "Model zoo"  # Name of the form in the issue chooser.
description: "Report a model defect, integrity problem or request a new model."  # Summary shown under the name in the issue chooser.
title: "[Model]: "  # Prefix of the title of a new issue.
labels: ["model-zoo", "needs-triage"]  # Labels applied to every new issue from this form.
body:  # Elements of the form, in display order.
  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## About this model zoo issue

        Use this form for anything concerning the models in the model zoo: quality, integrity, runtime, model cards and new model requests.

        **How to complete this form**

        - Every question is mandatory. Answer each one as precisely as you can; write `N/A` in a text field only when the question genuinely does not apply.
        - Closed questions list every expected answer. If none fits, choose "Other (specify in the next field)" and describe your answer in the field that follows the question.
        - The declarations and regulatory confirmations near the end are required for every submission. Each confirmation links to the exact article or section it refers to.
        - Do not include secrets, access tokens, personal data or confidential data. Report security vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) as described in [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), never in a public issue.
        - By submitting you agree to follow the [Code of Conduct](https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md).

  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## Model identification

        Identify the model concerned or the model you request.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-kind  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Kind of model issue"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the kind of issue.
      options:  # Answer choices, in display order.
        - "Defect in an existing model"  # Choice 1.
        - "Accuracy or quality problem"  # Choice 2.
        - "Request for a new model"  # Choice 3.
        - "Request for a new variant"  # Choice 4.
        - "Model card correction"  # Choice 5.
        - "Checksum or integrity mismatch"  # Choice 6.
        - "Build or verification problem"  # Choice 7.
        - "ONNX export or runtime problem"  # Choice 8.
        - "Licence or provenance question"  # Choice 9.
        - "Other (specify in the next field)"  # Choice 10.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-kind-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Kind of model issue: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Kind of model issue". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: input  # Single-line free-text answer.
    id: mz-model-id  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Model identifier"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Give the model identifier from the model zoo. Write `N/A` for a new model request.
      placeholder: |  # Example answer shown in the empty field.
        ship_detector_base
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-variant  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Variant concerned"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select every variant concerned.
      multiple: true  # Several choices may be selected.
      options:  # Answer choices, in display order.
        - "tiny"  # Choice 1.
        - "base"  # Choice 2.
        - "large"  # Choice 3.
        - "mega"  # Choice 4.
        - "Not applicable"  # Choice 5.
        - "Other (specify in the next field)"  # Choice 6.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-variant-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Variant concerned: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Variant concerned". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-task  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Model task"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the task of the model.
      options:  # Answer choices, in display order.
        - "Object detection"  # Choice 1.
        - "Semantic segmentation"  # Choice 2.
        - "Instance segmentation"  # Choice 3.
        - "Scene classification"  # Choice 4.
        - "Regression"  # Choice 5.
        - "Change detection"  # Choice 6.
        - "Super-resolution"  # Choice 7.
        - "Anomaly detection"  # Choice 8.
        - "Index or heuristic pack"  # Choice 9.
        - "Other (specify in the next field)"  # Choice 10.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-task-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Model task: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Model task". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-domain  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Model capability domain"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the capability domain of the model.
      options:  # Answer choices, in display order.
        - "01 AI products (detection, segmentation, super-resolution)"  # Choice 1.
        - "02 Tourism and data processing"  # Choice 2.
        - "03 Indices, flood and water"  # Choice 3.
        - "04 Environment, forestry and image processing"  # Choice 4.
        - "05 Asset management and energy"  # Choice 5.
        - "06 Urban planning and agriculture"  # Choice 6.
        - "07 Risk and defense (neutral analytics)"  # Choice 7.
        - "08 Value-added imagery (DEM, orthorectification, mosaicking)"  # Choice 8.
        - "09 Benefits narrative and reporting"  # Choice 9.
        - "10 Satellite imagery features"  # Choice 10.
        - "11 Resolution, metadata and quality assurance"  # Choice 11.
        - "12 Radar and SAR"  # Choice 12.
        - "Cross-cutting or not domain specific"  # Choice 13.
        - "Other (specify in the next field)"  # Choice 14.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-domain-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Model capability domain: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Model capability domain". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-sensor  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Input sensor"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select every sensor type used as model input.
      multiple: true  # Several choices may be selected.
      options:  # Answer choices, in display order.
        - "Optical multispectral (for example Sentinel-2, Landsat)"  # Choice 1.
        - "Very high resolution optical (sub-metre)"  # Choice 2.
        - "Hyperspectral"  # Choice 3.
        - "SAR (for example Sentinel-1)"  # Choice 4.
        - "Thermal infrared"  # Choice 5.
        - "LiDAR or photogrammetric point clouds"  # Choice 6.
        - "Elevation models (DEM, DSM, DTM)"  # Choice 7.
        - "Vector data (points, lines, polygons)"  # Choice 8.
        - "Tabular or time series data"  # Choice 9.
        - "Not applicable"  # Choice 10.
        - "Other (specify in the next field)"  # Choice 11.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-sensor-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Input sensor: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Input sensor". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-gsd  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Ground sampling distance"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the ground sampling distance of the input imagery.
      options:  # Answer choices, in display order.
        - "Below 0.5 m"  # Choice 1.
        - "0.5 m to 2 m"  # Choice 2.
        - "2 m to 10 m"  # Choice 3.
        - "10 m to 30 m"  # Choice 4.
        - "Above 30 m"  # Choice 5.
        - "Not applicable"  # Choice 6.
        - "Other (specify in the next field)"  # Choice 7.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-gsd-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Ground sampling distance: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Ground sampling distance". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-bands  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Input bands"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the band configuration used.
      options:  # Answer choices, in display order.
        - "RGB"  # Choice 1.
        - "RGB and near infrared"  # Choice 2.
        - "All Sentinel-2 bands"  # Choice 3.
        - "SAR VV and VH"  # Choice 4.
        - "Single band"  # Choice 5.
        - "Not applicable"  # Choice 6.
        - "Other (specify in the next field)"  # Choice 7.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-bands-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Input bands: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Input bands". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## Observation

        Describe the model behaviour.

  - type: textarea  # Free-text answer over several lines.
    id: mz-observed  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Observed behaviour"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Describe what the model produced, including example outputs.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: textarea  # Free-text answer over several lines.
    id: mz-expected  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Expected behaviour"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Describe what the model should have produced and on what basis.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: textarea  # Free-text answer over several lines.
    id: mz-metrics  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Measured metrics"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Give the metrics you measured (for example IoU, F1, mAP, RMSE) with the evaluation protocol. Write `N/A` if you did not measure.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-eval-data  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Evaluation data"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the kind of data used for evaluation.
      options:  # Answer choices, in display order.
        - "No evaluation performed"  # Choice 1.
        - "Public benchmark dataset"  # Choice 2.
        - "Own annotated data"  # Choice 3.
        - "Synthetic data"  # Choice 4.
        - "Other (specify in the next field)"  # Choice 5.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-eval-data-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Evaluation data: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Evaluation data". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: input  # Single-line free-text answer.
    id: mz-eval-dataset  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Evaluation dataset name and licence"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Give the dataset name, version and licence. Write `N/A` if no evaluation was performed.
      placeholder: |  # Example answer shown in the empty field.
        SpaceNet 7 (CC BY-SA 4.0)
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: textarea  # Free-text answer over several lines.
    id: mz-inference-code  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Inference code"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Paste the code used to run the model.
      render: python  # Show the answer as a python code block.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## Integrity and runtime

        Declare how the model was obtained and executed.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-checksum  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Checksum status"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Compare the SHA256 of the model file with `model_zoo/checksums.txt`.
      options:  # Answer choices, in display order.
        - "Checksum matches"  # Choice 1.
        - "Checksum does not match"  # Choice 2.
        - "Not checked"  # Choice 3.
        - "Not applicable"  # Choice 4.
        - "Other (specify in the next field)"  # Choice 5.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-checksum-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Checksum status: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Checksum status". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: input  # Single-line free-text answer.
    id: mz-sha256  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Computed SHA256"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Paste the SHA256 you computed. Write `N/A` if not applicable.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-store  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Model store status"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Declare how the model reached the local model store (UNBIHEXIUM_CACHE).
      options:  # Answer choices, in display order.
        - "Built with unbihexium zoo build"  # Choice 1.
        - "Built on first use by the library or the REST service"  # Choice 2.
        - "unbihexium zoo verify reports a mismatch"  # Choice 3.
        - "My own trained checkpoint or ONNX export"  # Choice 4.
        - "Not applicable"  # Choice 5.
        - "Other (specify in the next field)"  # Choice 6.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-store-other  # Stable key of the answer in the issue form data.
