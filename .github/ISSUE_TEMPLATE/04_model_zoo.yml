        Declare whether performance differs systematically across regions, seasons, sensors or land cover.
      multiple: true  # Several choices may be selected.
      options:  # Answer choices, in display order.
        - "No bias observed"  # Choice 1.
        - "Geographic bias"  # Choice 2.
        - "Seasonal bias"  # Choice 3.
        - "Sensor bias"  # Choice 4.
        - "Land cover bias"  # Choice 5.
        - "Not assessed"  # Choice 6.
        - "Other (specify in the next field)"  # Choice 7.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-bias-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Observed bias: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
