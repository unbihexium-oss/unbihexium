        Complete this field only if you selected "Other (specify in the next field)" in "Model store status". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-provider  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "ONNX Runtime execution provider"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the execution provider used.
      options:  # Answer choices, in display order.
        - "CPUExecutionProvider"  # Choice 1.
        - "CUDAExecutionProvider"  # Choice 2.
        - "TensorRTExecutionProvider"  # Choice 3.
        - "CoreMLExecutionProvider"  # Choice 4.
        - "DirectMLExecutionProvider"  # Choice 5.
        - "PyTorch instead of ONNX Runtime"  # Choice 6.
        - "Other (specify in the next field)"  # Choice 7.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: mz-provider-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "ONNX Runtime execution provider: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "ONNX Runtime execution provider". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## Responsible use

        Assess bias, oversight and decision impact.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: mz-bias  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Observed bias"  # Question shown to the reporter.
