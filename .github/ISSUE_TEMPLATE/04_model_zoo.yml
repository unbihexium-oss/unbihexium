name: "Model zoo"
description: "Report a model defect, integrity problem or request a new model."
title: "[Model]: "
labels: ["model-zoo", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## About this model zoo issue

        Use this form for anything concerning the models in the model zoo: quality, integrity, runtime, model cards and new model requests.

        **How to complete this form**

        - Every question is mandatory. Answer each one as precisely as you can; write `N/A` in a text field only when the question genuinely does not apply.
        - Closed questions list every expected answer. If none fits, choose "Other (specify in the next field)" and describe your answer in the field that follows the question.
        - The declarations and regulatory confirmations near the end are required for every submission. Each confirmation links to the exact article or section it refers to.
        - Do not include secrets, access tokens, personal data or confidential data. Report security vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) as described in [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), never in a public issue.
        - By submitting you agree to follow the [Code of Conduct](https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md).

  - type: markdown
    attributes:
      value: |
        ## Model identification

        Identify the model concerned or the model you request.

  - type: dropdown
    id: mz-kind
    attributes:
      label: "Kind of model issue"
      description: |
        Select the kind of issue.
      options:
        - "Defect in an existing model"
        - "Accuracy or quality problem"
        - "Request for a new model"
        - "Request for a new variant"
        - "Model card correction"
        - "Checksum or integrity mismatch"
        - "Download or Git LFS problem"
        - "ONNX export or runtime problem"
        - "Licence or provenance question"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-kind-other
    attributes:
      label: "Kind of model issue: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Kind of model issue". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: mz-model-id
    attributes:
      label: "Model identifier"
      description: |
        Give the model identifier from the model zoo. Write `N/A` for a new model request.
      placeholder: |
        ship_detector_base
    validations:
      required: true

  - type: dropdown
    id: mz-variant
    attributes:
      label: "Variant concerned"
      description: |
        Select every variant concerned.
      multiple: true
      options:
        - "tiny"
        - "base"
        - "large"
        - "mega"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-variant-other
    attributes:
      label: "Variant concerned: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Variant concerned". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-task
    attributes:
      label: "Model task"
      description: |
        Select the task of the model.
      options:
        - "Object detection"
        - "Semantic segmentation"
        - "Instance segmentation"
        - "Scene classification"
        - "Regression"
        - "Change detection"
        - "Super-resolution"
        - "Anomaly detection"
        - "Index or heuristic pack"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-task-other
    attributes:
      label: "Model task: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Model task". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-domain
    attributes:
      label: "Model capability domain"
      description: |
        Select the capability domain of the model.
      options:
        - "01 AI products (detection, segmentation, super-resolution)"
        - "02 Tourism and data processing"
        - "03 Indices, flood and water"
        - "04 Environment, forestry and image processing"
        - "05 Asset management and energy"
        - "06 Urban planning and agriculture"
        - "07 Risk and defense (neutral analytics)"
        - "08 Value-added imagery (DEM, orthorectification, mosaicking)"
        - "09 Benefits narrative and reporting"
        - "10 Satellite imagery features"
        - "11 Resolution, metadata and quality assurance"
        - "12 Radar and SAR"
        - "Cross-cutting or not domain specific"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-domain-other
    attributes:
      label: "Model capability domain: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Model capability domain". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-sensor
    attributes:
      label: "Input sensor"
      description: |
        Select every sensor type used as model input.
      multiple: true
      options:
        - "Optical multispectral (for example Sentinel-2, Landsat)"
        - "Very high resolution optical (sub-metre)"
        - "Hyperspectral"
        - "SAR (for example Sentinel-1)"
        - "Thermal infrared"
        - "LiDAR or photogrammetric point clouds"
        - "Elevation models (DEM, DSM, DTM)"
        - "Vector data (points, lines, polygons)"
        - "Tabular or time series data"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-sensor-other
    attributes:
      label: "Input sensor: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Input sensor". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-gsd
    attributes:
      label: "Ground sampling distance"
      description: |
        Select the ground sampling distance of the input imagery.
      options:
        - "Below 0.5 m"
        - "0.5 m to 2 m"
        - "2 m to 10 m"
        - "10 m to 30 m"
        - "Above 30 m"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-gsd-other
    attributes:
      label: "Ground sampling distance: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Ground sampling distance". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-bands
    attributes:
      label: "Input bands"
      description: |
        Select the band configuration used.
      options:
        - "RGB"
        - "RGB and near infrared"
        - "All Sentinel-2 bands"
        - "SAR VV and VH"
        - "Single band"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-bands-other
    attributes:
      label: "Input bands: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Input bands". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Observation

        Describe the model behaviour.

  - type: textarea
    id: mz-observed
    attributes:
      label: "Observed behaviour"
      description: |
        Describe what the model produced, including example outputs.
    validations:
      required: true

  - type: textarea
    id: mz-expected
    attributes:
      label: "Expected behaviour"
      description: |
        Describe what the model should have produced and on what basis.
    validations:
      required: true

  - type: textarea
    id: mz-metrics
    attributes:
      label: "Measured metrics"
      description: |
        Give the metrics you measured (for example IoU, F1, mAP, RMSE) with the evaluation protocol. Write `N/A` if you did not measure.
    validations:
      required: true

  - type: dropdown
    id: mz-eval-data
    attributes:
      label: "Evaluation data"
      description: |
        Select the kind of data used for evaluation.
      options:
        - "No evaluation performed"
        - "Public benchmark dataset"
        - "Own annotated data"
        - "Synthetic data"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-eval-data-other
    attributes:
      label: "Evaluation data: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Evaluation data". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: mz-eval-dataset
    attributes:
      label: "Evaluation dataset name and licence"
      description: |
        Give the dataset name, version and licence. Write `N/A` if no evaluation was performed.
      placeholder: |
        SpaceNet 7 (CC BY-SA 4.0)
    validations:
      required: true

  - type: textarea
    id: mz-inference-code
    attributes:
      label: "Inference code"
      description: |
        Paste the code used to run the model.
      render: python
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Integrity and runtime

        Declare how the model was obtained and executed.

  - type: dropdown
    id: mz-checksum
    attributes:
      label: "Checksum status"
      description: |
        Compare the SHA256 of the model file with `model_zoo/checksums.txt`.
      options:
        - "Checksum matches"
        - "Checksum does not match"
        - "Not checked"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-checksum-other
    attributes:
      label: "Checksum status: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Checksum status". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: mz-sha256
    attributes:
      label: "Computed SHA256"
      description: |
        Paste the SHA256 you computed. Write `N/A` if not applicable.
    validations:
      required: true

  - type: dropdown
    id: mz-lfs
    attributes:
      label: "Git LFS status"
      description: |
        Declare how the model files were obtained.
      options:
        - "Git LFS installed and files pulled"
        - "Git LFS not installed (pointer files only)"
        - "Downloaded from a release asset"
        - "Downloaded by unbihexium.zoo"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-lfs-other
    attributes:
      label: "Git LFS status: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Git LFS status". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-provider
    attributes:
      label: "ONNX Runtime execution provider"
      description: |
        Select the execution provider used.
      options:
        - "CPUExecutionProvider"
        - "CUDAExecutionProvider"
        - "TensorRTExecutionProvider"
        - "CoreMLExecutionProvider"
        - "DirectMLExecutionProvider"
        - "PyTorch instead of ONNX Runtime"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-provider-other
    attributes:
      label: "ONNX Runtime execution provider: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "ONNX Runtime execution provider". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Responsible use

        Assess bias, oversight and decision impact.

  - type: dropdown
    id: mz-bias
    attributes:
      label: "Observed bias"
      description: |
        Declare whether performance differs systematically across regions, seasons, sensors or land cover.
      multiple: true
      options:
        - "No bias observed"
        - "Geographic bias"
        - "Seasonal bias"
        - "Sensor bias"
        - "Land cover bias"
        - "Not assessed"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-bias-other
    attributes:
      label: "Observed bias: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Observed bias". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: mz-bias-details
    attributes:
      label: "Bias details"
      description: |
        Describe the observed bias with evidence. Write `N/A` if none was observed.
    validations:
      required: true

  - type: dropdown
    id: mz-oversight
    attributes:
      label: "Human oversight"
      description: |
        Describe the human oversight of model outputs in your deployment ([EU AI Act Article 14](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-14)).
      options:
        - "Every output reviewed by a human"
        - "Sampled human review"
        - "Human review of alerts only"
        - "No human review"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-oversight-other
    attributes:
      label: "Human oversight: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Human oversight". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-decisions
    attributes:
      label: "Automated decisions about people"
      description: |
        Declare whether model outputs feed automated decisions with legal or similar effects on people ([GDPR Article 22](https://gdpr-info.eu/art-22-gdpr/)).
      options:
        - "No decisions about people"
        - "Decisions with human involvement"
        - "Solely automated decisions"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-decisions-other
    attributes:
      label: "Automated decisions about people: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Automated decisions about people". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-dual-use
    attributes:
      label: "Dual-use potential of the model"
      description: |
        Assess the dual-use potential of the model or of the requested model.
      options:
        - "Civil use only"
        - "Could support surveillance"
        - "Could support military use"
        - "Not assessed"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-dual-use-other
    attributes:
      label: "Dual-use potential of the model: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Dual-use potential of the model". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## New model requests

        Complete these for new model or variant requests; otherwise write `N/A`.

  - type: textarea
    id: mz-new-spec
    attributes:
      label: "Requested model specification"
      description: |
        Describe the requested task, classes, input bands, resolution and output format. Write `N/A` if this is not a new model request.
    validations:
      required: true

  - type: dropdown
    id: mz-training-data
    attributes:
      label: "Available training data"
      description: |
        Declare the training data available for a new model.
      options:
        - "Not a new model request"
        - "Openly licensed data"
        - "Commercial data with training rights"
        - "No training data available"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-training-data-other
    attributes:
      label: "Available training data: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Available training data". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-labels
    attributes:
      label: "Annotation source"
      description: |
        Declare the source of annotations for a new model.
      options:
        - "Not a new model request"
        - "Expert annotation"
        - "Crowd annotation"
        - "Derived from vector data"
        - "No annotations available"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-labels-other
    attributes:
      label: "Annotation source: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Annotation source". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: mz-size
    attributes:
      label: "Size constraint"
      description: |
        Select the maximum acceptable model size.
      options:
        - "Under 10 MB"
        - "10 MB to 100 MB"
        - "100 MB to 1 GB"
        - "No constraint"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: mz-size-other
    attributes:
      label: "Size constraint: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Size constraint". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: mz-card-correction
    attributes:
      label: "Model card correction"
      description: |
        If a model card is wrong, quote the field and give the corrected value. Write `N/A` otherwise.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Submitter and context

        These questions help maintainers understand who is affected and how to prioritise the model zoo issue. The answers are used for triage only.

  - type: dropdown
    id: role
    attributes:
      label: "Your role"
      description: |
        Select the role that best describes how you interact with Unbihexium in the context of this model zoo issue.
      options:
        - "End user of the library or CLI"
        - "Application developer integrating the library"
        - "Researcher or academic"
        - "Data scientist or machine learning engineer"
        - "GIS or remote sensing analyst"
        - "Maintainer or regular contributor"
        - "Representative of an organisation (company, public body or NGO)"
        - "Student"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: role-other
    attributes:
      label: "Your role: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Your role". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: org-type
    attributes:
      label: "Organisation type"
      description: |
        Select the type of organisation on whose behalf you are submitting. Choose the individual option if you act in a private capacity.
      options:
        - "Individual, no organisation"
        - "Academic or research institution"
        - "Public sector body in the EU or EEA"
        - "Public sector body outside the EU or EEA"
        - "Private company, small or medium-sized enterprise"
        - "Private company, large enterprise"
        - "Non-profit organisation or NGO"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: org-type-other
    attributes:
      label: "Organisation type: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Organisation type". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: jurisdiction
    attributes:
      label: "Primary jurisdiction of use"
      description: |
        Select the jurisdiction in which you mainly use or distribute Unbihexium. This determines which of the regulatory questions below apply to you.
      options:
        - "EU or EEA member state"
        - "United Kingdom"
        - "Switzerland"
        - "United States"
        - "Canada"
        - "Other European country"
        - "Asia-Pacific"
        - "Middle East and North Africa"
        - "Sub-Saharan Africa"
        - "Latin America and the Caribbean"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: jurisdiction-other
    attributes:
      label: "Primary jurisdiction of use: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Primary jurisdiction of use". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: duplicates
    attributes:
      label: "Search for existing reports"
      description: |
        Confirm that you searched open and closed issues, pull requests and the documentation before creating this model zoo issue.
      options:
        - "I searched and found no existing issue or pull request"
        - "I found related issues or pull requests and link them in the next question"
        - "I found a closed issue or pull request, but the subject is still open"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: duplicates-other
    attributes:
      label: "Search for existing reports: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Search for existing reports". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: "Related issues, pull requests and discussions"
      description: |
        List related issues, pull requests, discussions or external tickets as links or `#number` references, separated by commas. Write `N/A` if there are none.
      placeholder: |
        #123, #456, https://example.org/ticket/1
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "Impact on your work"
      description: |
        Select how strongly the subject of this model zoo issue affects your work today.
      options:
        - "Blocking: I cannot continue without a resolution"
        - "Major: significant workaround or delay"
        - "Moderate: inconvenient but manageable"
        - "Minor: small inconvenience"
        - "Cosmetic or informational only"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: impact-other
    attributes:
      label: "Impact on your work: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Impact on your work". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Environment

        Describe the exact environment. Precise versions allow maintainers to reproduce the situation without additional round trips.

  - type: dropdown
    id: ubx-version
    attributes:
      label: "Unbihexium version"
      description: |
        Select the Unbihexium version you are using. Run `python -c "import unbihexium; print(unbihexium.__version__)"` if you are unsure.
      options:
        - "1.0.1 (latest release)"
        - "1.0.0"
        - "main branch (unreleased)"
        - "0.9.x"
        - "0.8.x or earlier"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: ubx-version-other
    attributes:
      label: "Unbihexium version: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Unbihexium version". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: version-string
    attributes:
      label: "Exact version string or commit SHA"
      description: |
        Paste the exact version string, and for source installations also the output of `git rev-parse HEAD`.
      placeholder: |
        1.0.1 / 3430ec9
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: "Installation method"
      description: |
        Select how Unbihexium was installed in the environment described here.
      options:
        - "PyPI with pip"
        - "PyPI with uv, pipx, poetry or pdm"
        - "conda or mamba (conda-forge)"
        - "Source checkout, editable install"
        - "Official Docker image"
        - "Custom container image"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: install-method-other
    attributes:
      label: "Installation method: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Installation method". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: python-version
    attributes:
      label: "Python version"
      description: |
