name: "Compliance, licensing and ethics"
description: "Raise a licensing, privacy, AI regulation, export control or ethics concern."
title: "[Compliance]: "
labels: ["compliance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## About this compliance issue

        Use this form for licensing, privacy, AI regulation, export control and ethics concerns. Do not include confidential or personal data; contact the maintainers privately if needed.

        **How to complete this form**

        - Every question is mandatory. Answer each one as precisely as you can; write `N/A` in a text field only when the question genuinely does not apply.
        - Closed questions list every expected answer. If none fits, choose "Other (specify in the next field)" and describe your answer in the field that follows the question.
        - The declarations and regulatory confirmations near the end are required for every submission. Each confirmation links to the exact article or section it refers to.
        - Do not include secrets, access tokens, personal data or confidential data. Report security vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) as described in [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), never in a public issue.
        - By submitting you agree to follow the [Code of Conduct](https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md).

  - type: markdown
    attributes:
      value: |
        ## Compliance topic

        Identify the compliance, licensing or ethics topic.

  - type: dropdown
    id: cmp-topic
    attributes:
      label: "Topic"
      description: |
        Select the main topic.
      options:
        - "Project licence (MPL-2.0)"
        - "Third-party licence"
        - "Model licence or provenance"
        - "Data licence"
        - "Privacy and data protection"
        - "EU AI Act"
        - "Export control or sanctions"
        - "Cyber security obligations"
        - "Accessibility"
        - "Ethics or misuse"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-topic-other
    attributes:
      label: "Topic: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Topic". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-kind
    attributes:
      label: "Kind of request"
      description: |
        Select the kind of request.
      options:
        - "Question"
        - "Suspected non-compliance"
        - "Documentation gap"
        - "Request for a compliance artefact"
        - "Request for an attribution or notice correction"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-kind-other
    attributes:
      label: "Kind of request: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Kind of request". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-regulations
    attributes:
      label: "Regulations and licences concerned"
      description: |
        Select every regulation or licence concerned.
      multiple: true
      options:
        - "GDPR (Regulation (EU) 2016/679)"
        - "EU AI Act (Regulation (EU) 2024/1689)"
        - "Cyber Resilience Act (Regulation (EU) 2024/2847)"
        - "NIS2 Directive (Directive (EU) 2022/2555)"
        - "Product Liability Directive (Directive (EU) 2024/2853)"
        - "Dual-use Regulation (Regulation (EU) 2021/821)"
        - "EU sanctions (for example Regulation (EU) No 833/2014)"
        - "US Export Administration Regulations"
        - "Copernicus data policy"
        - "INSPIRE Directive"
        - "Open Data Directive"
        - "DSM Copyright Directive"
        - "ePrivacy Directive"
        - "UK GDPR and Data Protection Act 2018"
        - "CCPA and CPRA"
        - "MPL-2.0 licence"
        - "Third-party licences"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-regulations-other
    attributes:
      label: "Regulations and licences concerned: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Regulations and licences concerned". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: cmp-articles
    attributes:
      label: "Specific articles or sections"
      description: |
        List the exact articles or licence sections, for example `GDPR Article 35` or `MPL-2.0 Section 3.3`.
      placeholder: |
        EU AI Act Article 50(2)
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Details

        Describe the concern with evidence.

  - type: textarea
    id: cmp-summary
    attributes:
      label: "Summary"
      description: |
        Describe the concern or question in detail.
    validations:
      required: true

  - type: input
    id: cmp-location
    attributes:
      label: "Affected files or URLs"
      description: |
        List affected files, paths or URLs, separated by commas.
      placeholder: |
        model_zoo/cards/ship_detector_base.md
    validations:
      required: true

  - type: textarea
    id: cmp-evidence
    attributes:
      label: "Evidence"
      description: |
        Provide evidence such as licence texts, notices, excerpts or links.
    validations:
      required: true

  - type: dropdown
    id: cmp-affected
    attributes:
      label: "Affected artefacts"
      description: |
        Select every affected artefact.
      multiple: true
      options:
        - "Source code"
        - "Package metadata"
        - "Documentation"
        - "Model weights"
        - "Model cards"
        - "Datasets"
        - "Container image"
        - "CI configuration"
        - "Release assets"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-affected-other
    attributes:
      label: "Affected artefacts: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Affected artefacts". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-severity
    attributes:
      label: "Assessed severity"
      description: |
        Select the severity of the concern.
      options:
        - "Critical: legal exposure for users today"
        - "High: must be fixed before the next release"
        - "Medium: should be fixed"
        - "Low: improvement"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-severity-other
    attributes:
      label: "Assessed severity: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Assessed severity". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: cmp-remedy
    attributes:
      label: "Proposed remedy"
      description: |
        Describe how the concern should be resolved.
    validations:
      required: true

  - type: dropdown
    id: cmp-deadline
    attributes:
      label: "Legal deadline"
      description: |
        Declare whether a legal or contractual deadline applies.
      options:
        - "No deadline"
        - "Deadline within one month"
        - "Deadline within six months"
        - "Deadline later"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-deadline-other
    attributes:
      label: "Legal deadline: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Legal deadline". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Specific checks

        Answer every check; select the not applicable option where appropriate.

  - type: dropdown
    id: cmp-licence-conflict
    attributes:
      label: "Licence conflict"
      description: |
        Declare the type of licence conflict, if any.
      multiple: true
      options:
        - "No licence conflict"
        - "Incompatible copyleft licence"
        - "Missing licence"
        - "Missing attribution"
        - "Non-commercial or no-derivatives restriction"
        - "Model or data licence conflict"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-licence-conflict-other
    attributes:
      label: "Licence conflict: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Licence conflict". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: cmp-licence-names
    attributes:
      label: "Licences involved"
      description: |
        List the SPDX identifiers of the licences involved. Write `N/A` if none.
      placeholder: |
        MPL-2.0, GPL-3.0-only
    validations:
      required: true

  - type: dropdown
    id: cmp-personal-data-found
    attributes:
      label: "Personal data in the repository"
      description: |
        Declare whether you found personal data in the repository ([GDPR Article 4(1)](https://gdpr-info.eu/art-4-gdpr/)). Do not repeat the data in this issue.
      options:
        - "No personal data found"
        - "Personal data in source code or docs"
        - "Personal data in datasets or imagery"
        - "Personal data in commit history"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-personal-data-found-other
    attributes:
      label: "Personal data in the repository: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Personal data in the repository". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-subject-rights
    attributes:
      label: "Data subject rights"
      description: |
        Declare whether you are exercising data subject rights under [GDPR Articles 15 to 22](https://gdpr-info.eu/art-15-gdpr/).
      options:
        - "Not exercising data subject rights"
        - "Right of access (Article 15)"
        - "Right to rectification (Article 16)"
        - "Right to erasure (Article 17)"
        - "Right to object (Article 21)"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-subject-rights-other
    attributes:
      label: "Data subject rights: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Data subject rights". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-ai-transparency
    attributes:
      label: "AI transparency gap"
      description: |
        Declare whether AI transparency information is missing, with reference to [EU AI Act Article 13](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-13) and [Article 50](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50).
      multiple: true
      options:
        - "No gap"
        - "Missing instructions for use"
        - "Missing limitations"
        - "Missing training data summary"
        - "Missing marking of AI generated content"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-ai-transparency-other
    attributes:
      label: "AI transparency gap: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "AI transparency gap". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-authority
    attributes:
      label: "Authority involvement"
      description: |
        Declare whether an authority has been contacted.
      options:
        - "No authority contacted"
        - "Data protection authority"
        - "Market surveillance authority"
        - "Export control authority"
        - "Other public authority"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-authority-other
    attributes:
      label: "Authority involvement: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Authority involvement". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-legal-advice
    attributes:
      label: "Legal advice"
      description: |
        Declare whether you obtained legal advice. This issue does not constitute legal advice.
      options:
        - "No legal advice obtained"
        - "Internal legal advice"
        - "External legal advice"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-legal-advice-other
    attributes:
      label: "Legal advice: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Legal advice". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-jurisdictions
    attributes:
      label: "Jurisdictions concerned"
      description: |
        Select every jurisdiction concerned.
      multiple: true
      options:
        - "European Union"
        - "United Kingdom"
        - "United States"
        - "Switzerland"
        - "Global"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-jurisdictions-other
    attributes:
      label: "Jurisdictions concerned: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Jurisdictions concerned". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-policy-driver
    attributes:
      label: "Driver of the request"
      description: |
        Select what drives the request.
      options:
        - "Legal requirement"
        - "Internal policy of my organisation"
        - "Customer requirement"
        - "Procurement requirement"
        - "Personal concern"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-policy-driver-other
    attributes:
      label: "Driver of the request: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Driver of the request". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-distribution
    attributes:
      label: "Distribution model"
      description: |
        Select how you distribute Unbihexium or software containing it.
      multiple: true
      options:
        - "Not distributed"
        - "Internal use within my organisation only"
        - "Offered as a hosted service"
        - "Bundled in a product"
        - "Redistributed as source"
        - "Redistributed as binaries or containers"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-distribution-other
    attributes:
      label: "Distribution model: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Distribution model". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-commercial
    attributes:
      label: "Commercial activity"
      description: |
        Declare whether the use is part of a commercial activity. This is relevant for the Cyber Resilience Act and the Product Liability Directive.
      options:
        - "Non-commercial"
        - "Commercial"
        - "Not sure"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-commercial-other
    attributes:
      label: "Commercial activity: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Commercial activity". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-modified-files
    attributes:
      label: "Modified MPL-2.0 files"
      description: |
        Declare whether you modified files covered by the MPL-2.0.
      options:
        - "No modifications"
        - "Modified files, source made available"
        - "Modified files, source not yet made available"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-modified-files-other
    attributes:
      label: "Modified MPL-2.0 files: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Modified MPL-2.0 files". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-source-availability
    attributes:
      label: "Source code availability"
      description: |
        For executable distributions, declare how the source code of Covered Software is made available as required by MPL-2.0 Section 3.2(a).
      options:
        - "No executable distribution"
        - "Source shipped alongside"
        - "Source linked from the distribution"
        - "Source not yet made available"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-source-availability-other
    attributes:
      label: "Source code availability: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Source code availability". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: cmp-notices
    attributes:
      label: "Notices retained"
      description: |
        Declare whether licence and copyright notices are retained in your distribution.
      options:
        - "No distribution"
        - "All notices retained"
        - "Some notices missing"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: cmp-notices-other
    attributes:
      label: "Notices retained: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Notices retained". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: cmp-user-impact
    attributes:
      label: "Impact on users"
      description: |
        Describe how the concern affects users of Unbihexium.
    validations:
      required: true

  - type: textarea
    id: cmp-references
    attributes:
      label: "References"
      description: |
        Link the legal texts, guidance or decisions you rely on.
    validations:
      required: true

  - type: textarea
    id: cmp-acceptance
    attributes:
      label: "Acceptance criteria"
      description: |
        Describe what must change for the concern to be resolved.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Submitter and context

        These questions help maintainers understand who is affected and how to prioritise the compliance issue. The answers are used for triage only.

  - type: dropdown
    id: role
    attributes:
      label: "Your role"
      description: |
        Select the role that best describes how you interact with Unbihexium in the context of this compliance issue.
      options:
        - "End user of the library or CLI"
        - "Application developer integrating the library"
        - "Researcher or academic"
        - "Data scientist or machine learning engineer"
        - "GIS or remote sensing analyst"
        - "Maintainer or regular contributor"
        - "Representative of an organisation (company, public body or NGO)"
        - "Student"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: role-other
    attributes:
      label: "Your role: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Your role". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: org-type
    attributes:
      label: "Organisation type"
      description: |
        Select the type of organisation on whose behalf you are submitting. Choose the individual option if you act in a private capacity.
      options:
        - "Individual, no organisation"
        - "Academic or research institution"
        - "Public sector body in the EU or EEA"
        - "Public sector body outside the EU or EEA"
        - "Private company, small or medium-sized enterprise"
        - "Private company, large enterprise"
        - "Non-profit organisation or NGO"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: org-type-other
    attributes:
      label: "Organisation type: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Organisation type". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: jurisdiction
    attributes:
      label: "Primary jurisdiction of use"
      description: |
        Select the jurisdiction in which you mainly use or distribute Unbihexium. This determines which of the regulatory questions below apply to you.
      options:
        - "EU or EEA member state"
        - "United Kingdom"
        - "Switzerland"
        - "United States"
        - "Canada"
        - "Other European country"
        - "Asia-Pacific"
        - "Middle East and North Africa"
        - "Sub-Saharan Africa"
        - "Latin America and the Caribbean"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: jurisdiction-other
    attributes:
      label: "Primary jurisdiction of use: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Primary jurisdiction of use". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: duplicates
    attributes:
      label: "Search for existing reports"
      description: |
        Confirm that you searched open and closed issues, pull requests and the documentation before creating this compliance issue.
      options:
        - "I searched and found no existing issue or pull request"
        - "I found related issues or pull requests and link them in the next question"
        - "I found a closed issue or pull request, but the subject is still open"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: duplicates-other
    attributes:
      label: "Search for existing reports: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Search for existing reports". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: "Related issues, pull requests and discussions"
      description: |
        List related issues, pull requests, discussions or external tickets as links or `#number` references, separated by commas. Write `N/A` if there are none.
      placeholder: |
        #123, #456, https://example.org/ticket/1
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "Impact on your work"
      description: |
        Select how strongly the subject of this compliance issue affects your work today.
      options:
        - "Blocking: I cannot continue without a resolution"
        - "Major: significant workaround or delay"
        - "Moderate: inconvenient but manageable"
        - "Minor: small inconvenience"
        - "Cosmetic or informational only"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: impact-other
    attributes:
      label: "Impact on your work: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Impact on your work". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Environment

        Describe the exact environment. Precise versions allow maintainers to reproduce the situation without additional round trips.

  - type: dropdown
    id: ubx-version
    attributes:
      label: "Unbihexium version"
      description: |
        Select the Unbihexium version you are using. Run `python -c "import unbihexium; print(unbihexium.__version__)"` if you are unsure.
      options:
        - "1.0.1 (latest release)"
        - "1.0.0"
        - "main branch (unreleased)"
        - "0.9.x"
        - "0.8.x or earlier"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: ubx-version-other
    attributes:
      label: "Unbihexium version: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Unbihexium version". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: version-string
    attributes:
      label: "Exact version string or commit SHA"
      description: |
        Paste the exact version string, and for source installations also the output of `git rev-parse HEAD`.
      placeholder: |
        1.0.1 / 3430ec9
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: "Installation method"
      description: |
        Select how Unbihexium was installed in the environment described here.
      options:
        - "PyPI with pip"
        - "PyPI with uv, pipx, poetry or pdm"
        - "conda or mamba (conda-forge)"
        - "Source checkout, editable install"
        - "Official Docker image"
        - "Custom container image"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: install-method-other
    attributes:
      label: "Installation method: Other, please specify"
      description: |
