        - "Beginner users"  # Choice 1.
        - "Intermediate users"  # Choice 2.
        - "Expert users"  # Choice 3.
        - "Contributors and maintainers"  # Choice 4.
        - "Compliance or legal reviewers"  # Choice 5.
        - "Other (specify in the next field)"  # Choice 6.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: doc-audience-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
