        - "unbihexium.config (configuration handling)"  # Choice 4.
        - "unbihexium.core (rasters, vectors, pipelines, tiling)"  # Choice 5.
        - "unbihexium.geostat (kriging, variograms, spatial statistics)"  # Choice 6.
        - "unbihexium.indices (NDVI, NDWI, EVI, NBR, MSI and others)"  # Choice 7.
        - "unbihexium.io (raster, vector and STAC input and output)"  # Choice 8.
        - "unbihexium.metrics (accuracy and quality metrics)"  # Choice 9.
        - "unbihexium.postprocessing"  # Choice 10.
        - "unbihexium.preprocessing (radiometric and geometric preparation)"  # Choice 11.
        - "unbihexium.registry (capability and model registry)"  # Choice 12.
        - "unbihexium.sar (SAR amplitude, phase and interferometry)"  # Choice 13.
        - "unbihexium.serving (FastAPI REST service)"  # Choice 14.
        - "unbihexium.terrain (DEM, DSM, DTM, slope, aspect)"  # Choice 15.
        - "unbihexium.utils"  # Choice 16.
        - "unbihexium.visualization"  # Choice 17.
        - "unbihexium.zoo (model download, verification and loading)"  # Choice 18.
        - "Model zoo assets (model_zoo/)"  # Choice 19.
        - "Documentation or example notebooks"  # Choice 20.
        - "Packaging, Docker image or CI configuration"  # Choice 21.
        - "Not sure"  # Choice 22.
        - "Other (specify in the next field)"  # Choice 23.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: doc-module-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Related module: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Related module". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## Content

        Describe the problem and the fix.

