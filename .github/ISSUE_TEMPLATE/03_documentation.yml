    id: doc-current  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Current text"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Quote the current text exactly. Write `N/A` for missing documentation.
      render: markdown  # Show the answer as a markdown code block.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: textarea  # Free-text answer over several lines.
    id: doc-problem  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Problem description"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Explain what is wrong, missing or confusing and why it matters to readers.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: textarea  # Free-text answer over several lines.
    id: doc-suggestion  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
