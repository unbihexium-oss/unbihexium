          required: true  # This box must be ticked.
        - label: "Data subjects are informed as required by [Articles 13 and 14](https://gdpr-info.eu/art-13-gdpr/) and automated decisions follow [Article 22](https://gdpr-info.eu/art-22-gdpr/)."  # Confirmation 3.
          required: true  # This box must be ticked.
        - label: "I apply data protection by design and by default under [Article 25](https://gdpr-info.eu/art-25-gdpr/) and security measures under [Article 32](https://gdpr-info.eu/art-32-gdpr/)."  # Confirmation 4.
          required: true  # This box must be ticked.
        - label: "I carry out a DPIA where required by [Article 35](https://gdpr-info.eu/art-35-gdpr/)."  # Confirmation 5.
          required: true  # This box must be ticked.
        - label: "International transfers of personal data comply with [Chapter V, Articles 44 to 49](https://gdpr-info.eu/art-44-gdpr/)."  # Confirmation 6.
          required: true  # This box must be ticked.
        - label: "This documentation issue contains no personal data of third parties."  # Confirmation 7.
          required: true  # This box must be ticked.

  - type: checkboxes  # Confirmation boxes that the reporter ticks.
    id: confirm-aia  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "EU AI Act confirmations (Regulation (EU) 2024/1689)"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Applies to AI systems placed on the market, put into service or used in the EU. Full text: [EU AI Act](https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng).
      options:  # Boxes to tick, in display order.
        - label: "I do not use Unbihexium for any prohibited practice listed in [Article 5](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5), including untargeted scraping for facial recognition databases and real-time remote biometric identification."  # Confirmation 1.
          required: true  # This box must be ticked.
        - label: "If my system is high-risk under [Article 6](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6) and [Annex III](https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3), I meet the requirements of [Articles 9 to 15](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-9)."  # Confirmation 2.
          required: true  # This box must be ticked.
        - label: "As a deployer I follow [Article 26](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-26), including human oversight, and carry out a fundamental rights impact assessment under [Article 27](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-27) where required."  # Confirmation 3.
          required: true  # This box must be ticked.
        - label: "I meet the transparency obligations of [Article 50](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50) where they apply."  # Confirmation 4.
          required: true  # This box must be ticked.
        - label: "Staff dealing with the AI system have sufficient AI literacy as required by [Article 4](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4)."  # Confirmation 5.
          required: true  # This box must be ticked.
        - label: "I understand that the free and open-source exemptions in [Article 2(12)](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-2) and [Article 53(2)](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-53) do not cover high-risk or prohibited uses."  # Confirmation 6.
          required: true  # This box must be ticked.

  - type: checkboxes  # Confirmation boxes that the reporter ticks.
    id: confirm-security  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
