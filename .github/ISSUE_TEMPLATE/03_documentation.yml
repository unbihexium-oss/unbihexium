# Abstract
# --------
# The "Documentation" form of the issue chooser: report missing, incorrect or
# unclear documentation.
# The form opens with instructions, asks classified questions (drop-down
# lists with an "Other" choice followed by a free-text field), then the
# technical details, and ends with the provenance declarations and the
# regulatory confirmations that every submission must tick. Markdown
# blocks explain each section; their text is part of the form, not code.
#
# Every question is mandatory unless its validation says otherwise. The
# `id` of an element is the key of the answer in the issue form data;
# keep it stable, because labelling and triage automation may read it.
# =============================================================================

name: "Documentation"  # Name of the form in the issue chooser.
description: "Report missing, incorrect or unclear documentation."  # Summary shown under the name in the issue chooser.
title: "[Docs]: "  # Prefix of the title of a new issue.
labels: ["documentation", "needs-triage"]  # Labels applied to every new issue from this form.
body:  # Elements of the form, in display order.
  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## About this documentation issue

        Use this form for problems in the documentation under docs/, the README, notebooks, docstrings or model cards.

        **How to complete this form**

        - Every question is mandatory. Answer each one as precisely as you can; write `N/A` in a text field only when the question genuinely does not apply.
        - Closed questions list every expected answer. If none fits, choose "Other (specify in the next field)" and describe your answer in the field that follows the question.
        - The declarations and regulatory confirmations near the end are required for every submission. Each confirmation links to the exact article or section it refers to.
        - Do not include secrets, access tokens, personal data or confidential data. Report security vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) as described in [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), never in a public issue.
        - By submitting you agree to follow the [Code of Conduct](https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md).

  - type: markdown  # Explanatory text block; it is not part of the answers.
    attributes:  # Content and presentation of the element.
      value: |  # Markdown text of the block.
        ## Documentation classification

        Identify the affected documentation.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: doc-type  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Documentation type"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select the type of documentation concerned.
      options:  # Answer choices, in display order.
        - "API reference"  # Choice 1.
        - "Tutorial"  # Choice 2.
        - "How-to guide"  # Choice 3.
        - "Conceptual explanation"  # Choice 4.
        - "Example notebook"  # Choice 5.
        - "README"  # Choice 6.
        - "Model card"  # Choice 7.
        - "FAQ"  # Choice 8.
        - "Docstring"  # Choice 9.
        - "Migration guide"  # Choice 10.
        - "Policy document (licence, privacy, security)"  # Choice 11.
        - "Other (specify in the next field)"  # Choice 12.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: doc-type-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Documentation type: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Documentation type". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: dropdown  # Closed question answered from a drop-down list.
    id: doc-problem-kind  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Kind of problem"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Select every kind of problem.
      multiple: true  # Several choices may be selected.
      options:  # Answer choices, in display order.
        - "Missing documentation"  # Choice 1.
        - "Incorrect content"  # Choice 2.
        - "Outdated content"  # Choice 3.
        - "Unclear explanation"  # Choice 4.
        - "Broken link"  # Choice 5.
        - "Example code does not run"  # Choice 6.
        - "Spelling or grammar"  # Choice 7.
        - "Rendering of maths or diagrams"  # Choice 8.
        - "Accessibility problem"  # Choice 9.
        - "Other (specify in the next field)"  # Choice 10.
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: doc-problem-kind-other  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Kind of problem: Other, please specify"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Complete this field only if you selected "Other (specify in the next field)" in "Kind of problem". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:  # Validation rules of the element.
      required: false  # The answer is optional.

  - type: input  # Single-line free-text answer.
    id: doc-url  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Page URL"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Give the URL of the page. Write `N/A` for missing documentation.
      placeholder: |  # Example answer shown in the empty field.
        https://github.com/unbihexium-oss/unbihexium/blob/main/docs/getting_started/installation.md
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: doc-file  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Source file path"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Give the path of the source file in the repository. Write `N/A` if unknown.
      placeholder: |  # Example answer shown in the empty field.
        docs/getting_started/installation.md
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: input  # Single-line free-text answer.
    id: doc-section  # Stable key of the answer in the issue form data.
    attributes:  # Content and presentation of the element.
      label: "Section heading"  # Question shown to the reporter.
      description: |  # Help text shown under the question.
        Give the heading of the affected section. Write `N/A` for a whole page.
      placeholder: |  # Example answer shown in the empty field.
        System Requirements
    validations:  # Validation rules of the element.
      required: true  # An answer is mandatory.

  - type: dropdown  # Closed question answered from a drop-down list.
