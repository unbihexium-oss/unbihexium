        Applies to any processing of personal data. Full text: [GDPR](https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng).
      options:  # Boxes to tick, in display order.
        - label: "My processing follows the principles in [Article 5](https://gdpr-info.eu/art-5-gdpr/), including data minimisation and purpose limitation."  # Confirmation 1.
          required: true  # This box must be ticked.
