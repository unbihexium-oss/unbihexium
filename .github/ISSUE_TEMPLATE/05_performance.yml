      value: |
        ## Regulatory classification

        Unbihexium is distributed as free and open-source software. Obligations under the regulations below mostly fall on those who deploy it or place products built with it on the market. Answer for your own use. The full texts are the [GDPR](https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng) and the [EU AI Act](https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng); every answer links to the relevant article.

  - type: dropdown
    id: gdpr-role
    attributes:
      label: "Role under the GDPR"
      description: |
        Select your role for any personal data processing involved, as defined in [GDPR Article 4(7) and 4(8)](https://gdpr-info.eu/art-4-gdpr/) and [Article 26](https://gdpr-info.eu/art-26-gdpr/).
      options:
        - "No personal data processed"
        - "Controller"
        - "Processor"
        - "Joint controller"
        - "Data subject"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: gdpr-role-other
    attributes:
      label: "Role under the GDPR: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Role under the GDPR". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: gdpr-basis
    attributes:
      label: "Lawful basis for processing"
      description: |
        Select the lawful basis under [GDPR Article 6(1)](https://gdpr-info.eu/art-6-gdpr/) for any processing of personal data in your use of Unbihexium.
      options:
        - "Not applicable, no personal data processed"
        - "Article 6(1)(a) consent"
        - "Article 6(1)(b) performance of a contract"
        - "Article 6(1)(c) legal obligation"
        - "Article 6(1)(d) vital interests"
        - "Article 6(1)(e) public interest or official authority"
        - "Article 6(1)(f) legitimate interests"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: gdpr-basis-other
    attributes:
      label: "Lawful basis for processing: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Lawful basis for processing". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: gdpr-dpia
    attributes:
      label: "Data protection impact assessment"
      description: |
        Declare the status of a DPIA under [GDPR Article 35](https://gdpr-info.eu/art-35-gdpr/). A DPIA is typically required for systematic monitoring of publicly accessible areas on a large scale.
      options:
        - "Not required, no high-risk processing"
        - "Completed"
        - "Planned"
        - "Not assessed"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: gdpr-dpia-other
    attributes:
      label: "Data protection impact assessment: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Data protection impact assessment". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: aia-role
    attributes:
      label: "Role under the EU AI Act"
      description: |
        Select your role as defined in [EU AI Act Article 3](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-3) and [Article 25](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-25).
      options:
        - "Not placing on the market or putting into service any AI system"
        - "Provider (Article 3(3))"
        - "Deployer (Article 3(4))"
        - "Importer (Article 3(6))"
        - "Distributor (Article 3(7))"
        - "Product manufacturer integrating an AI system (Article 25(3))"
        - "Authorised representative (Article 3(5))"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: aia-role-other
    attributes:
      label: "Role under the EU AI Act: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Role under the EU AI Act". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: aia-risk
    attributes:
      label: "EU AI Act classification of your use"
      description: |
        Classify the AI system in which you use Unbihexium. See [Article 2](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-2) for the exclusions, [Article 5](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5) for prohibited practices, [Article 6](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6) and [Annex III](https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3) for high-risk systems and [Article 50](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50) for transparency obligations.
      options:
        - "No AI system involved"
        - "Excluded: exclusively military, defence or national security (Article 2(3))"
        - "Excluded: scientific research and development only (Article 2(6))"
        - "Excluded: research, testing or development before market placement (Article 2(8))"
        - "Minimal risk"
        - "Transparency obligations apply (Article 50)"
        - "High-risk under Article 6(2) and Annex III"
        - "High-risk under Article 6(1) as a safety component"
        - "Not yet assessed"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: aia-risk-other
    attributes:
      label: "EU AI Act classification of your use: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "EU AI Act classification of your use". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: aia-annex3
    attributes:
      label: "Annex III area"
      description: |
        If your system is high-risk, select the area listed in [Annex III](https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3).
      options:
        - "Not high-risk"
        - "Point 1: biometrics"
        - "Point 2: critical infrastructure"
        - "Point 3: education and vocational training"
        - "Point 4: employment and workers management"
        - "Point 5: access to essential private and public services"
        - "Point 6: law enforcement"
        - "Point 7: migration, asylum and border control management"
        - "Point 8: administration of justice and democratic processes"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: aia-annex3-other
    attributes:
      label: "Annex III area: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Annex III area". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: end-use
    attributes:
      label: "Intended end use"
      description: |
        Select every intended end use of your work with Unbihexium.
      multiple: true
      options:
        - "Civil research"
        - "Commercial civil use"
        - "Public sector civil use"
        - "Environmental monitoring"
        - "Humanitarian or disaster response"
        - "Defence or military"
        - "Law enforcement"
        - "Border surveillance"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: end-use-other
    attributes:
      label: "Intended end use: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Intended end use". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: export-status
    attributes:
      label: "Export control assessment"
      description: |
        Declare the export control status of your use. Most published open-source code is not subject to the EAR under [15 CFR 734.7](https://www.ecfr.gov/current/title-15/section-734.7), but end-use controls in [Regulation (EU) 2021/821 Article 4](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng#art_4) and [EAR Part 744](https://www.ecfr.gov/current/title-15/subtitle-B/chapter-VII/subchapter-C/part-744) still apply.
      options:
        - "No export involved"
        - "Assessed, no licence required"
        - "Assessed, licence obtained"
        - "Not assessed"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: export-status-other
    attributes:
      label: "Export control assessment: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Export control assessment". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: frameworks
    attributes:
      label: "Frameworks and standards applied"
      description: |
        Select every AI governance or security framework applied in your use.
      multiple: true
      options:
        - "No framework applied"
        - "NIST AI Risk Management Framework 1.0"
        - "ISO/IEC 42001 AI management system"
        - "ISO/IEC 23894 AI risk management"
        - "ISO/IEC 27001 information security"
        - "OECD AI Principles"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: frameworks-other
    attributes:
      label: "Frameworks and standards applied: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Frameworks and standards applied". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Regulatory confirmations

        Confirm every statement. Each link opens the exact article or section it refers to.

  - type: checkboxes
    id: confirm-gdpr
    attributes:
      label: "GDPR confirmations (Regulation (EU) 2016/679)"
      description: |
        Applies to any processing of personal data. Full text: [GDPR](https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng).
      options:
        - label: "My processing follows the principles in [Article 5](https://gdpr-info.eu/art-5-gdpr/), including data minimisation and purpose limitation."
          required: true
        - label: "Any processing has a lawful basis under [Article 6](https://gdpr-info.eu/art-6-gdpr/) and, for special categories, a condition under [Article 9](https://gdpr-info.eu/art-9-gdpr/)."
          required: true
        - label: "Data subjects are informed as required by [Articles 13 and 14](https://gdpr-info.eu/art-13-gdpr/) and automated decisions follow [Article 22](https://gdpr-info.eu/art-22-gdpr/)."
          required: true
        - label: "I apply data protection by design and by default under [Article 25](https://gdpr-info.eu/art-25-gdpr/) and security measures under [Article 32](https://gdpr-info.eu/art-32-gdpr/)."
          required: true
        - label: "I carry out a DPIA where required by [Article 35](https://gdpr-info.eu/art-35-gdpr/)."
          required: true
        - label: "International transfers of personal data comply with [Chapter V, Articles 44 to 49](https://gdpr-info.eu/art-44-gdpr/)."
          required: true
        - label: "This performance issue contains no personal data of third parties."
          required: true

  - type: checkboxes
    id: confirm-aia
    attributes:
      label: "EU AI Act confirmations (Regulation (EU) 2024/1689)"
      description: |
        Applies to AI systems placed on the market, put into service or used in the EU. Full text: [EU AI Act](https://eur-lex.europa.eu/eli/reg/2024/1689/oj/eng).
      options:
        - label: "I do not use Unbihexium for any prohibited practice listed in [Article 5](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5), including untargeted scraping for facial recognition databases and real-time remote biometric identification."
          required: true
        - label: "If my system is high-risk under [Article 6](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-6) and [Annex III](https://ai-act-service-desk.ec.europa.eu/en/ai-act/annex-3), I meet the requirements of [Articles 9 to 15](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-9)."
          required: true
        - label: "As a deployer I follow [Article 26](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-26), including human oversight, and carry out a fundamental rights impact assessment under [Article 27](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-27) where required."
          required: true
        - label: "I meet the transparency obligations of [Article 50](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50) where they apply."
          required: true
        - label: "Staff dealing with the AI system have sufficient AI literacy as required by [Article 4](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-4)."
          required: true
        - label: "I understand that the free and open-source exemptions in [Article 2(12)](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-2) and [Article 53(2)](https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-53) do not cover high-risk or prohibited uses."
          required: true

  - type: checkboxes
    id: confirm-security
    attributes:
      label: "Cyber security and product liability confirmations"
      description: |
        Covers the [Cyber Resilience Act](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng), the [NIS2 Directive](https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng) and the [Product Liability Directive](https://eur-lex.europa.eu/eli/dir/2024/2853/oj/eng).
      options:
        - label: "I report vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) following [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), consistent with the coordinated vulnerability handling of [CRA Article 13](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_13) and [Article 14](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_14)."
          required: true
        - label: "If I place a product with digital elements that includes Unbihexium on the EU market, I meet the manufacturer obligations of [CRA Article 13](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_13) and the essential requirements of CRA Annex I."
          required: true
        - label: "I understand the role of open-source software stewards under [CRA Article 24](https://eur-lex.europa.eu/eli/reg/2024/2847/oj/eng#art_24)."
          required: true
        - label: "If my organisation is an essential or important entity, I apply the risk management measures of [NIS2 Article 21](https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng#art_21) and the reporting obligations of [NIS2 Article 23](https://eur-lex.europa.eu/eli/dir/2022/2555/oj/eng#art_23)."
          required: true
        - label: "I understand that free and open-source software supplied outside a commercial activity is excluded by [Product Liability Directive Article 2(2)](https://eur-lex.europa.eu/eli/dir/2024/2853/oj/eng#art_2) and that the software is provided without warranty under [MPL-2.0 Sections 6 and 7](https://www.mozilla.org/en-US/MPL/2.0/)."
          required: true

  - type: checkboxes
    id: confirm-export
    attributes:
      label: "Export control and sanctions confirmations"
      description: |
        Geospatial analytics and object detection can be dual-use.
      options:
        - label: "I comply with [Regulation (EU) 2021/821](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng), including authorisation requirements in [Article 3](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng#art_3), end-use controls in [Article 4](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng#art_4) and cyber-surveillance controls in [Article 5](https://eur-lex.europa.eu/eli/reg/2021/821/oj/eng#art_5)."
          required: true
        - label: "I comply with EU restrictive measures, including [Regulation (EU) No 833/2014](https://eur-lex.europa.eu/eli/reg/2014/833/oj/eng), [Article 2](https://eur-lex.europa.eu/eli/reg/2014/833/oj/eng#art_2) on dual-use goods and technology."
          required: true
        - label: "I comply with the US Export Administration Regulations, including [15 CFR 734.7](https://www.ecfr.gov/current/title-15/section-734.7) on published information and the end-use and end-user controls in [15 CFR Part 744](https://www.ecfr.gov/current/title-15/subtitle-B/chapter-VII/subchapter-C/part-744)."
          required: true
        - label: "I comply with US sanctions administered under [31 CFR Chapter V](https://www.ecfr.gov/current/title-31/subtitle-B/chapter-V)."
          required: true

  - type: checkboxes
    id: confirm-data
    attributes:
      label: "Geospatial data, open data and copyright confirmations"
      description: |
        Covers the terms under which Earth observation and geospatial data may be used.
      options:
        - label: "I use Copernicus data in line with [Regulation (EU) 2021/696 Article 55](https://eur-lex.europa.eu/eli/reg/2021/696/oj/eng#art_55) and [Delegated Regulation (EU) No 1159/2013](https://eur-lex.europa.eu/eli/reg_del/2013/1159/oj/eng), including attribution."
          required: true
        - label: "I respect access limitations on spatial data sets under [INSPIRE Directive Article 13](https://eur-lex.europa.eu/eli/dir/2007/2/oj/eng#art_13)."
          required: true
        - label: "I respect the conditions for re-use of public sector data under [Open Data Directive Article 14](https://eur-lex.europa.eu/eli/dir/2019/1024/oj/eng#art_14) and [Implementing Regulation (EU) 2023/138](https://eur-lex.europa.eu/eli/reg_impl/2023/138/oj/eng) on high-value datasets."
          required: true
        - label: "Any text and data mining for model training respects [DSM Directive Articles 3 and 4](https://eur-lex.europa.eu/eli/dir/2019/790/oj/eng#art_4), including rights reservations under Article 4(3)."
          required: true

  - type: checkboxes
    id: confirm-privacy-other
    attributes:
      label: "Other privacy law confirmations"
      description: |
        Covers telemetry and privacy regimes outside the GDPR.
      options:
        - label: "Any telemetry or storage of information on user devices complies with [ePrivacy Directive Article 5(3)](https://eur-lex.europa.eu/eli/dir/2002/58/oj/eng#art_5); Unbihexium telemetry is opt-in as described in [PRIVACY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/PRIVACY.md)."
          required: true
        - label: "For processing subject to UK law I comply with the [UK GDPR](https://www.legislation.gov.uk/eur/2016/679/article/5) and the [Data Protection Act 2018](https://www.legislation.gov.uk/ukpga/2018/12/contents)."
          required: true
        - label: "For consumers in California I comply with the CCPA as amended by the CPRA, including [Civil Code 1798.100](https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.100), [1798.105](https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.105) and [1798.120](https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.120)."
          required: true

  - type: checkboxes
    id: confirm-licence
    attributes:
      label: "Licence confirmations (MPL-2.0)"
      description: |
        Unbihexium is licensed under the [Mozilla Public License 2.0](https://www.mozilla.org/en-US/MPL/2.0/). The project copy is [LICENSE.txt](https://github.com/unbihexium-oss/unbihexium/blob/main/LICENSE.txt).
      options:
        - label: "I have read the licence grants in [MPL-2.0 Section 2](https://www.mozilla.org/en-US/MPL/2.0/)."
          required: true
        - label: "When I distribute Covered Software in source or executable form I meet [MPL-2.0 Sections 3.1 and 3.2](https://www.mozilla.org/en-US/MPL/2.0/), and for Larger Works [Section 3.3](https://www.mozilla.org/en-US/MPL/2.0/)."
          required: true
        - label: "I keep the licence notices and the third-party notices in [NOTICE](https://github.com/unbihexium-oss/unbihexium/blob/main/NOTICE) and [THIRD_PARTY_NOTICES.md](https://github.com/unbihexium-oss/unbihexium/blob/main/THIRD_PARTY_NOTICES.md)."
          required: true
        - label: "I understand the disclaimer of warranty and limitation of liability in [MPL-2.0 Sections 6 and 7](https://www.mozilla.org/en-US/MPL/2.0/)."
          required: true

  - type: checkboxes
    id: confirm-project
    attributes:
      label: "Project policy confirmations"
      description: |
        Covers the policies of this repository and of GitHub.
      options:
        - label: "I follow the [Code of Conduct](https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md)."
          required: true
        - label: "I have read [CONTRIBUTING.md](https://github.com/unbihexium-oss/unbihexium/blob/main/CONTRIBUTING.md), [COMPLIANCE.md](https://github.com/unbihexium-oss/unbihexium/blob/main/COMPLIANCE.md) and [PRIVACY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/PRIVACY.md)."
          required: true
        - label: "This performance issue complies with the [GitHub Acceptable Use Policies](https://docs.github.com/en/site-policy/acceptable-use-policies/github-acceptable-use-policies)."
          required: true

  - type: textarea
    id: compliance-notes
    attributes:
      label: "Compliance notes"
      description: |
        Add anything relevant to the declarations and confirmations above, for example jurisdiction-specific constraints or pending assessments. Write `N/A` if there is nothing to add.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Closing

        Final details before you submit.

  - type: dropdown
    id: contribute
    attributes:
      label: "Willingness to contribute"
      description: |
        Select how you can help resolve this performance issue.
      options:
        - "I will submit a pull request"
        - "I can submit a pull request with guidance"
        - "I can test a proposed fix or change"
        - "I can provide additional data or information"
        - "I cannot contribute further"
        - "Other (specify in the next field)"
