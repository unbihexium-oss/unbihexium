        Complete this field only if you selected "Other (specify in the next field)" in "Willingness to contribute". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: "Additional context"
      description: |
        Add any other context, screenshots or links that help maintainers handle this performance issue. Write `N/A` if there is nothing to add.
    validations:
      required: true

  - type: checkboxes
    id: final
    attributes:
      label: "Final confirmation"
      description: |
        Confirm each statement before submitting.
      options:
        - label: "The information in this performance issue is accurate and complete to the best of my knowledge."
          required: true
        - label: "I removed secrets, access tokens, credentials and internal host names."
          required: true
        - label: "I removed personal data and confidential information."
          required: true
        - label: "I wrote this submission in English."
          required: true
