name: "Performance"
description: "Report slow execution, high memory use or poor scaling."
title: "[Performance]: "
labels: ["performance", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## About this performance issue

        Use this form for performance problems. Reproducible measurements are required.

        **How to complete this form**

        - Every question is mandatory. Answer each one as precisely as you can; write `N/A` in a text field only when the question genuinely does not apply.
        - Closed questions list every expected answer. If none fits, choose "Other (specify in the next field)" and describe your answer in the field that follows the question.
        - The declarations and regulatory confirmations near the end are required for every submission. Each confirmation links to the exact article or section it refers to.
        - Do not include secrets, access tokens, personal data or confidential data. Report security vulnerabilities privately through a [security advisory](https://github.com/unbihexium-oss/unbihexium/security/advisories/new) as described in [SECURITY.md](https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md), never in a public issue.
        - By submitting you agree to follow the [Code of Conduct](https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md).

  - type: markdown
    attributes:
      value: |
        ## Performance classification

        Classify the performance problem.

  - type: dropdown
    id: perf-kind
    attributes:
      label: "Kind of performance problem"
      description: |
        Select the kind of problem.
      options:
        - "Slow execution"
        - "High memory use"
        - "Low GPU utilisation"
        - "Slow input or output"
        - "Slow model loading"
        - "Poor parallel scaling"
        - "Throughput regression"
        - "Slow import or startup"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-kind-other
    attributes:
      label: "Kind of performance problem: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Kind of performance problem". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-module
    attributes:
      label: "Module concerned"
      description: |
        Select every module involved.
      multiple: true
      options:
        - "unbihexium.ai (detection, segmentation, classification)"
        - "unbihexium.analysis (spatial and network analysis)"
        - "unbihexium.cli (command line interface)"
        - "unbihexium.config (configuration handling)"
        - "unbihexium.core (rasters, vectors, pipelines, tiling)"
        - "unbihexium.geostat (kriging, variograms, spatial statistics)"
        - "unbihexium.indices (NDVI, NDWI, EVI, NBR, MSI and others)"
        - "unbihexium.io (raster, vector and STAC input and output)"
        - "unbihexium.metrics (accuracy and quality metrics)"
        - "unbihexium.postprocessing"
        - "unbihexium.preprocessing (radiometric and geometric preparation)"
        - "unbihexium.registry (capability and model registry)"
        - "unbihexium.sar (SAR amplitude, phase and interferometry)"
        - "unbihexium.serving (FastAPI REST service)"
        - "unbihexium.terrain (DEM, DSM, DTM, slope, aspect)"
        - "unbihexium.utils"
        - "unbihexium.visualization"
        - "unbihexium.zoo (model download, verification and loading)"
        - "Model zoo assets (model_zoo/)"
        - "Documentation or example notebooks"
        - "Packaging, Docker image or CI configuration"
        - "Not sure"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-module-other
    attributes:
      label: "Module concerned: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Module concerned". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-regression
    attributes:
      label: "Performance regression"
      description: |
        Declare whether performance was better in an earlier version.
      options:
        - "Yes, regression"
        - "No, it was always slow"
        - "Unknown"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-regression-other
    attributes:
      label: "Performance regression: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Performance regression". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: perf-last-good
    attributes:
      label: "Last fast version"
      description: |
        Give the last version or commit with acceptable performance. Write `N/A` if not a regression.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Measurement

        Provide reproducible measurements.

  - type: textarea
    id: perf-workload
    attributes:
      label: "Workload description"
      description: |
        Describe the workload: operation, input size, number of files, tile size and batch size.
    validations:
      required: true

  - type: textarea
    id: perf-benchmark
    attributes:
      label: "Benchmark code"
      description: |
        Paste self-contained code that measures the problem.
      render: python
    validations:
      required: true

  - type: input
    id: perf-observed
    attributes:
      label: "Observed performance"
      description: |
        Give the measured time, memory or throughput with units.
      placeholder: |
        42 s per scene, 18 GB peak RSS
    validations:
      required: true

  - type: input
    id: perf-expected
    attributes:
      label: "Expected performance"
      description: |
        Give the expected value and explain where the expectation comes from.
      placeholder: |
        under 10 s per scene, as in docs/benchmarks
    validations:
      required: true

  - type: dropdown
    id: perf-baseline
    attributes:
      label: "Baseline for comparison"
      description: |
        Select what you compared against.
      options:
        - "Earlier Unbihexium version"
        - "Published benchmark in docs/benchmarks"
        - "Other library"
        - "Theoretical estimate"
        - "No baseline"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-baseline-other
    attributes:
      label: "Baseline for comparison: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Baseline for comparison". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: perf-baseline-numbers
    attributes:
      label: "Baseline numbers"
      description: |
        Give the baseline measurements with units. Write `N/A` if there is no baseline.
    validations:
      required: true

  - type: dropdown
    id: perf-tools
    attributes:
      label: "Measurement tools"
      description: |
        Select every tool used to measure.
      multiple: true
      options:
        - "time.perf_counter"
        - "pytest-benchmark"
        - "cProfile"
        - "py-spy"
        - "Scalene"
        - "memray"
        - "nvidia-smi or Nsight"
        - "Operating system monitor"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-tools-other
    attributes:
      label: "Measurement tools: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Measurement tools". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: perf-profile
    attributes:
      label: "Profiler output"
      description: |
        Paste the relevant profiler output. Write `N/A` if not profiled.
      render: text
    validations:
      required: true

  - type: dropdown
    id: perf-runs
    attributes:
      label: "Number of runs"
      description: |
        Select how many repetitions the measurement is based on.
      options:
        - "One run"
        - "Two to four runs"
        - "Five to nineteen runs"
        - "Twenty runs or more"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-runs-other
    attributes:
      label: "Number of runs: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Number of runs". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-warmup
    attributes:
      label: "Warm-up"
      description: |
        Declare whether the measurement includes cold start effects.
      options:
        - "Cold start included"
        - "Warm runs only"
        - "Both measured separately"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-warmup-other
    attributes:
      label: "Warm-up: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Warm-up". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: perf-variance
    attributes:
      label: "Variance"
      description: |
        Give the spread across runs, for example standard deviation or min and max.
    validations:
      required: true

  - type: input
    id: perf-tile-size
    attributes:
      label: "Tile and batch size"
      description: |
        Give the tile size, overlap and batch size used. Write `N/A` if no tiling is involved.
      placeholder: |
        512 x 512, overlap 64, batch 8
    validations:
      required: true

  - type: dropdown
    id: perf-io-format
    attributes:
      label: "Input format for the measurement"
      description: |
        Select every input format used in the measurement.
      multiple: true
      options:
        - "GeoTIFF or Cloud Optimized GeoTIFF"
        - "Sentinel SAFE or JPEG2000"
        - "NetCDF"
        - "Zarr"
        - "HDF5"
        - "Shapefile"
        - "GeoPackage"
        - "GeoJSON"
        - "GeoParquet"
        - "STAC item or collection"
        - "NumPy array in memory"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-io-format-other
    attributes:
      label: "Input format for the measurement: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Input format for the measurement". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-cache
    attributes:
      label: "Caching"
      description: |
        Declare the state of caches during the measurement.
      options:
        - "Caches cleared before each run"
        - "Warm operating system and GDAL caches"
        - "Not controlled"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-cache-other
    attributes:
      label: "Caching: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Caching". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## System

        Describe the system on which you measured.

  - type: input
    id: perf-hardware
    attributes:
      label: "Hardware"
      description: |
        Give the CPU model, number of cores, RAM and, if used, GPU model.
      placeholder: |
        AMD EPYC 7763, 32 cores, 128 GB RAM
    validations:
      required: true

  - type: dropdown
    id: perf-storage
    attributes:
      label: "Storage"
      description: |
        Select where the input data is stored.
      options:
        - "Local SSD"
        - "Local HDD"
        - "Network file system"
        - "Object storage (S3 or compatible)"
        - "Remote HTTP (Cloud Optimized GeoTIFF)"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-storage-other
    attributes:
      label: "Storage: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Storage". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-parallelism
    attributes:
      label: "Parallelism"
      description: |
        Select the parallelism used.
      options:
        - "Single thread"
        - "Multi-threading"
        - "Multiprocessing"
        - "Dask"
        - "Ray"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-parallelism-other
    attributes:
      label: "Parallelism: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Parallelism". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: perf-threads
    attributes:
      label: "Thread settings"
      description: |
        Give relevant settings such as OMP_NUM_THREADS, GDAL_NUM_THREADS and ONNX Runtime intra-op threads. Write `N/A` if defaults were used.
    validations:
      required: true

  - type: dropdown
    id: perf-precision
    attributes:
      label: "Numerical precision"
      description: |
        Select the precision used for inference.
      options:
        - "FP32"
        - "FP16"
        - "BF16"
        - "INT8"
        - "Not applicable"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-precision-other
    attributes:
      label: "Numerical precision: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Numerical precision". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-energy
    attributes:
      label: "Energy measurement"
      description: |
        Declare whether energy use was measured.
      options:
        - "Not measured"
        - "Measured with hardware counters"
        - "Measured with CodeCarbon or similar"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-energy-other
    attributes:
      label: "Energy measurement: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Energy measurement". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-power
    attributes:
      label: "Power and thermal state"
      description: |
        Select the power mode of the machine during measurement.
      options:
        - "Performance mode on mains power"
        - "Balanced or default mode"
        - "Battery or power saving mode"
        - "Thermal throttling observed"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-power-other
    attributes:
      label: "Power and thermal state: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Power and thermal state". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: perf-container-limits
    attributes:
      label: "Container resource limits"
      description: |
        Declare whether CPU or memory limits were applied.
      options:
        - "No limits"
        - "CPU limit applied"
        - "Memory limit applied"
        - "CPU and memory limits applied"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: perf-container-limits-other
    attributes:
      label: "Container resource limits: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Container resource limits". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: textarea
    id: perf-hypothesis
    attributes:
      label: "Suspected cause"
      description: |
        Describe what you think causes the problem. Write `N/A` if unknown.
    validations:
      required: true

  - type: input
    id: perf-target
    attributes:
      label: "Acceptable target"
      description: |
        Give the performance you need for your use case.
      placeholder: |
        under 15 s per scene
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Submitter and context

        These questions help maintainers understand who is affected and how to prioritise the performance issue. The answers are used for triage only.

  - type: dropdown
    id: role
    attributes:
      label: "Your role"
      description: |
        Select the role that best describes how you interact with Unbihexium in the context of this performance issue.
      options:
        - "End user of the library or CLI"
        - "Application developer integrating the library"
        - "Researcher or academic"
        - "Data scientist or machine learning engineer"
        - "GIS or remote sensing analyst"
        - "Maintainer or regular contributor"
        - "Representative of an organisation (company, public body or NGO)"
        - "Student"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: role-other
    attributes:
      label: "Your role: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Your role". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: org-type
    attributes:
      label: "Organisation type"
      description: |
        Select the type of organisation on whose behalf you are submitting. Choose the individual option if you act in a private capacity.
      options:
        - "Individual, no organisation"
        - "Academic or research institution"
        - "Public sector body in the EU or EEA"
        - "Public sector body outside the EU or EEA"
        - "Private company, small or medium-sized enterprise"
        - "Private company, large enterprise"
        - "Non-profit organisation or NGO"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: org-type-other
    attributes:
      label: "Organisation type: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Organisation type". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: jurisdiction
    attributes:
      label: "Primary jurisdiction of use"
      description: |
        Select the jurisdiction in which you mainly use or distribute Unbihexium. This determines which of the regulatory questions below apply to you.
      options:
        - "EU or EEA member state"
        - "United Kingdom"
        - "Switzerland"
        - "United States"
        - "Canada"
        - "Other European country"
        - "Asia-Pacific"
        - "Middle East and North Africa"
        - "Sub-Saharan Africa"
        - "Latin America and the Caribbean"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: jurisdiction-other
    attributes:
      label: "Primary jurisdiction of use: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Primary jurisdiction of use". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: duplicates
    attributes:
      label: "Search for existing reports"
      description: |
        Confirm that you searched open and closed issues, pull requests and the documentation before creating this performance issue.
      options:
        - "I searched and found no existing issue or pull request"
        - "I found related issues or pull requests and link them in the next question"
        - "I found a closed issue or pull request, but the subject is still open"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: duplicates-other
    attributes:
      label: "Search for existing reports: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Search for existing reports". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: related
    attributes:
      label: "Related issues, pull requests and discussions"
      description: |
        List related issues, pull requests, discussions or external tickets as links or `#number` references, separated by commas. Write `N/A` if there are none.
      placeholder: |
        #123, #456, https://example.org/ticket/1
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: "Impact on your work"
      description: |
        Select how strongly the subject of this performance issue affects your work today.
      options:
        - "Blocking: I cannot continue without a resolution"
        - "Major: significant workaround or delay"
        - "Moderate: inconvenient but manageable"
        - "Minor: small inconvenience"
        - "Cosmetic or informational only"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: impact-other
    attributes:
      label: "Impact on your work: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Impact on your work". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ## Environment

        Describe the exact environment. Precise versions allow maintainers to reproduce the situation without additional round trips.

  - type: dropdown
    id: ubx-version
    attributes:
      label: "Unbihexium version"
      description: |
        Select the Unbihexium version you are using. Run `python -c "import unbihexium; print(unbihexium.__version__)"` if you are unsure.
      options:
        - "1.0.1 (latest release)"
        - "1.0.0"
        - "main branch (unreleased)"
        - "0.9.x"
        - "0.8.x or earlier"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: ubx-version-other
    attributes:
      label: "Unbihexium version: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Unbihexium version". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
    id: version-string
    attributes:
      label: "Exact version string or commit SHA"
      description: |
        Paste the exact version string, and for source installations also the output of `git rev-parse HEAD`.
      placeholder: |
        1.0.1 / 3430ec9
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: "Installation method"
      description: |
        Select how Unbihexium was installed in the environment described here.
      options:
        - "PyPI with pip"
        - "PyPI with uv, pipx, poetry or pdm"
        - "conda or mamba (conda-forge)"
        - "Source checkout, editable install"
        - "Official Docker image"
        - "Custom container image"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: install-method-other
    attributes:
      label: "Installation method: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Installation method". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: python-version
    attributes:
      label: "Python version"
      description: |
        Select the Python version. Unbihexium supports CPython 3.10 to 3.14 as documented in [VERSIONING.md](https://github.com/unbihexium-oss/unbihexium/blob/main/VERSIONING.md).
      options:
        - "3.14"
        - "3.13"
        - "3.12"
        - "3.11"
        - "3.10"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: python-version-other
    attributes:
      label: "Python version: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Python version". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: python-impl
    attributes:
      label: "Python implementation"
      description: |
        Select the Python implementation and build.
      options:
        - "CPython, standard build"
        - "CPython, free-threaded build"
        - "PyPy"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: python-impl-other
    attributes:
      label: "Python implementation: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Python implementation". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: "Operating system family"
      description: |
        Select the operating system family on which you observed the behaviour or tested the change.
      options:
        - "Linux"
        - "Windows"
        - "macOS"
        - "Windows Subsystem for Linux (WSL2)"
        - "Other (specify in the next field)"
    validations:
      required: true

  - type: input
    id: os-other
    attributes:
      label: "Operating system family: Other, please specify"
      description: |
        Complete this field only if you selected "Other (specify in the next field)" in "Operating system family". Describe your answer precisely so maintainers do not need to ask a follow-up question.
    validations:
      required: false

  - type: input
