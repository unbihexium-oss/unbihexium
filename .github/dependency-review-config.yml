# Abstract
# --------
# Read by actions/dependency-review-action in .github/workflows/security.yml.
# The Dependency Review check fails on a pull request that adds a dependency
# with a known vulnerability of high or critical severity, or one whose
# licence is incompatible with the project licence policy. The denied
# licences are strong copyleft, source-available and non-commercial licences
# that cannot be combined with an MPL-2.0 library used in closed products.
# security-insights.yml publishes this file as the dependency management
# policy of the project.
# =============================================================================

fail-on-severity: high  # Fail on high and critical vulnerabilities.
fail-on-scopes:  # Dependency scopes that can fail the check.
  - runtime  # Dependencies installed with the package.
  - development  # Test, lint and build tools.

license-check: true  # Compare the licences of new dependencies with the list below.
deny-licenses:  # SPDX identifiers that fail the check.
  - AGPL-1.0-only  # Network copyleft.
  - AGPL-1.0-or-later  # Network copyleft.
  - AGPL-3.0-only  # Network copyleft.
  - AGPL-3.0-or-later  # Network copyleft.
  - GPL-1.0-only  # Strong copyleft.
  - GPL-1.0-or-later  # Strong copyleft.
  - GPL-2.0-only  # Strong copyleft.
  - GPL-2.0-or-later  # Strong copyleft.
  - GPL-3.0-only  # Strong copyleft.
  - GPL-3.0-or-later  # Strong copyleft.
  - SSPL-1.0  # Server Side Public License, not an open source licence.
  - BUSL-1.1  # Business Source License, restricts production use.
  - CC-BY-NC-4.0  # Forbids commercial use.
  - CC-BY-NC-SA-4.0  # Forbids commercial use.
  - CC-BY-NC-ND-4.0  # Forbids commercial use and derivatives.

vulnerability-check: true  # Look up new dependencies in the advisory database.
warn-only: false  # A finding fails the check instead of only warning.

