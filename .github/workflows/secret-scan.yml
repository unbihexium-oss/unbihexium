#
# Abstract
# --------
# Scans the commits of every push to main and every pull request for
# credentials with TruffleHog. Only verified findings (secrets that the
# provider confirms as live) fail the job, which keeps false positives out.
# The full history is fetched so that the action can compare the new commits
# with their base. The action is pinned by commit SHA and the TruffleHog
# binary version is pinned as an input; Dependabot keeps the trailing
# version comment up to date, and the version input must follow it.
# =============================================================================

name: Secret Scan  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege token for every job.
  contents: read  # The job only needs to read the repository.

concurrency:  # One run per workflow and ref at a time.
  group: ${{ github.workflow }}-${{ github.ref }}  # Group by workflow and branch or pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Cancel superseded pull request runs; let main runs finish.

jobs:  # Jobs of the workflow.
  trufflehog:  # Secret scan.
    name: TruffleHog  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 15  # Cancel a hung scan after 15 minutes.
    steps:  # Steps of the scan job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commits to scan.
        with:  # Inputs of the checkout action.
          fetch-depth: 0  # Full history, needed to find the base of the scan range.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Scan new commits for verified secrets  # Run TruffleHog over the new commits.
        uses: trufflesecurity/trufflehog@64d939a56362f519781c53ea09b27f8d1dc0140a  # v3.97.6
        with:  # Inputs of the TruffleHog action.
          version: 3.97.6  # TruffleHog release that the action downloads.
          extra_args: --results=verified  # Report only secrets confirmed as live.

