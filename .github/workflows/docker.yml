# Abstract
# --------
# Builds the image from the repository Dockerfile on every push to main, on
# version tags (v*) and on pull requests. Pull requests only build, to prove
# that the Dockerfile works; pushes and tags also log in to the GitHub
# Container Registry (ghcr.io/<owner>/<repo>), push the image with tags
# derived by docker/metadata-action (branch, pull request, semantic version
# and commit SHA), then secure the pushed digest:
#
#   SBOM         an SPDX SBOM of the image (Syft), kept as a workflow artifact
#   provenance   a SLSA build provenance attestation, stored in the registry
#   attestation  the SBOM as a signed attestation, stored in the registry
#   signature    a keyless cosign signature bound to this workflow
#
# The attestations and the signature use Sigstore with the OIDC identity of
# this workflow; verify them with
#   gh attestation verify oci://ghcr.io/unbihexium-oss/unbihexium:<tag> --repo unbihexium-oss/unbihexium
#   cosign verify ghcr.io/unbihexium-oss/unbihexium:<tag> \
#     --certificate-identity-regexp '^https://github.com/unbihexium-oss/unbihexium/.github/workflows/docker.yml@refs/(heads/main|tags/v.+)$' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
# Vulnerability scanning of the image is done separately in container-scan.yml.
# =============================================================================

name: Docker  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes.
    branches: [main]  # Pushes to the default branch publish the "main" tag.
    tags: ["v*"]  # Version tags publish semantic version tags.
  pull_request:  # Run on pull requests (build only).
    branches: [main]  # Only pull requests that target the default branch.

permissions:  # Least-privilege default token; the job widens only what it needs.
  contents: read  # Read the repository.

env:  # Variables shared by all steps.
  REGISTRY: ghcr.io  # GitHub Container Registry host.
  IMAGE_NAME: ${{ github.repository }}  # Image name equals owner/repository.

jobs:  # Jobs of the workflow.
  build-and-push:  # Build the image and publish it outside pull requests.
    name: Build and Push Docker Image  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner with Docker.
    permissions:  # Token permissions of the build job.
      contents: read  # Read the repository.
      packages: write  # Push the image and its attestations to the GitHub Container Registry.
      id-token: write  # Request the OIDC token for the Sigstore signature and attestations.
      attestations: write  # Store the provenance and SBOM attestations.
    steps:  # Steps of the build job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit to build.

      - name: Set up Docker Buildx  # Enable BuildKit and the GitHub Actions cache backend.
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0; Official Buildx setup action.

      - name: Log in to Container Registry  # Authenticate to GHCR for the push.
        if: github.event_name != 'pull_request'  # Pull requests never push.
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0; Official registry login action.
        with:  # Inputs of the login action.
          registry: ${{ env.REGISTRY }}  # Log in to ghcr.io.
          username: ${{ github.actor }}  # User that triggered the run.
          password: ${{ secrets.GITHUB_TOKEN }}  # Workflow token with packages: write.

      - name: Extract metadata  # Compute image tags and OCI labels.
        id: meta  # Identifier for reading the outputs later.
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0; Official metadata action.
        with:  # Inputs of the metadata action.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}  # Full image reference without tag.
          tags: |  # Tag rules, one per line.
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push  # Build the image and push it outside pull requests.
        id: build  # Identifier for reading the image digest.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2; Official build action.
        with:  # Inputs of the build action.
          context: .  # Build from the repository root.
          push: ${{ github.event_name != 'pull_request' }}  # Push only for pushes and tags.
          tags: ${{ steps.meta.outputs.tags }}  # Tags computed by the metadata step.
          labels: ${{ steps.meta.outputs.labels }}  # OCI labels computed by the metadata step.
          cache-from: type=gha  # Reuse layers from the Actions cache.
          cache-to: type=gha,mode=max  # Store all layers in the Actions cache.

      - name: Generate SBOM  # Produce a software bill of materials for the pushed image.
        if: github.event_name != 'pull_request'  # Only images that were pushed.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2; Syft-based SBOM action.
        with:  # Inputs of the SBOM action.
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}  # The pushed image, by digest.
          artifact-name: sbom-docker.spdx.json  # Name of the uploaded SPDX artifact.
          output-file: sbom-docker.spdx.json  # Also keep the SBOM in the workspace for the attestation.

      - name: Attest the build provenance  # Signed SLSA provenance of the pushed digest.
        if: github.event_name != 'pull_request'  # Only images that were pushed.
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0; Official attestation action.
        with:  # Inputs of the attestation action.
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}  # Image name without tag.
          subject-digest: ${{ steps.build.outputs.digest }}  # Digest of the pushed image.
          push-to-registry: true  # Store the attestation next to the image in GHCR.

      - name: Attest the SBOM  # The SPDX SBOM as a signed attestation of the pushed digest.
        if: github.event_name != 'pull_request'  # Only images that were pushed.
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0; Official SBOM attestation action.
        with:  # Inputs of the attestation action.
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}  # Image name without tag.
          subject-digest: ${{ steps.build.outputs.digest }}  # Digest of the pushed image.
          sbom-path: sbom-docker.spdx.json  # SBOM written by the previous step.
          push-to-registry: true  # Store the attestation next to the image in GHCR.

      - name: Install cosign  # Sigstore signing tool.
        if: github.event_name != 'pull_request'  # Only images that were pushed.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2; Official cosign installer.

      - name: Sign the image  # Keyless signature of the pushed digest, bound to this workflow.
        if: github.event_name != 'pull_request'  # Only images that were pushed.
        env:  # Inputs of the signing step.
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}  # Image by digest, never by tag.
        run: cosign sign --yes "$IMAGE"  # Uses the OIDC token of the job; the signature is stored in GHCR.

