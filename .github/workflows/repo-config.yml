#
# Abstract
# --------
# Validates the configuration files of the repository before GitHub or
# other services read them:
#
#   schemas            check-jsonschema with its built-in schemas for the
#                      issue forms, the issue template chooser, the
#                      workflows, Dependabot, CITATION.cff, Docker Compose
#                      and Codecov; codemeta.json must be valid JSON;
#                      yamllint --strict over all YAML with .yamllint.yml;
#                      the remaining .github YAML files must parse
#   security-insights  security-insights.yml against the OpenSSF Security
#                      Insights schema, using the cue tool
#
# The cue and schema versions are pinned in the job environment. The
# workflow starts when anything under .github/, any YAML file, CITATION.cff
# or codemeta.json changes, or on demand.
# =============================================================================

name: Repository Config  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
    paths:  # Only when a configuration file changes.
      - ".github/**"  # Workflows, templates and GitHub settings.
      - "**/*.yml"  # Any YAML file.
      - "**/*.yaml"  # Any YAML file with the long extension.
      - ".yamllint.yml"  # The yamllint rules.
      - "CITATION.cff"  # Citation metadata.
      - "codemeta.json"  # Software metadata.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.
    paths:  # Same path filter as for pushes.
      - ".github/**"  # Workflows, templates and GitHub settings.
      - "**/*.yml"  # Any YAML file.
      - "**/*.yaml"  # Any YAML file with the long extension.
      - ".yamllint.yml"  # The yamllint rules.
      - "CITATION.cff"  # Citation metadata.
      - "codemeta.json"  # Software metadata.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege token for every job.
  contents: read  # The jobs only need to read the repository.

concurrency:  # One run per workflow and ref at a time.
  group: ${{ github.workflow }}-${{ github.ref }}  # Group by workflow and branch or pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Cancel superseded pull request runs; let main runs finish.

jobs:  # Jobs of the workflow.
  schemas:  # Schema and syntax checks.
    name: Validate configuration schemas  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 10  # Cancel a hung job after ten minutes.
    steps:  # Steps of the schema job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for the validators.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install validators  # Install the schema validator, PyYAML and yamllint.
        run: python -m pip install --require-hashes -r .github/requirements/requirements-ci-tools.txt  # Locked, hashed CI tools: check-jsonschema, PyYAML and yamllint.

      - name: Issue forms  # The numbered issue forms.
        run: check-jsonschema --builtin-schema vendor.github-issue-forms .github/ISSUE_TEMPLATE/[0-9]*.yml  # Validate against the GitHub issue forms schema.

      - name: Issue template chooser  # The issue template configuration.
        run: check-jsonschema --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml  # Validate against the issue config schema.

      - name: Workflows  # The GitHub Actions workflows.
        run: check-jsonschema --builtin-schema vendor.github-workflows .github/workflows/*.yml  # Validate against the workflow schema.

      - name: Dependabot  # The Dependabot configuration.
        run: check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml  # Validate against the Dependabot schema.

      - name: Citation File Format  # The citation metadata.
        run: check-jsonschema --builtin-schema vendor.citation-file-format CITATION.cff  # Validate against the CFF schema.

      - name: Docker Compose  # The Compose file.
        run: check-jsonschema --builtin-schema vendor.compose-spec docker-compose.yml  # Validate against the Compose specification.

      - name: Codecov  # The Codecov configuration.
        run: check-jsonschema --builtin-schema vendor.codecov codecov.yml  # Validate against the Codecov schema.

      - name: CodeMeta is valid JSON  # CodeMeta has no built-in schema; check the syntax.
        run: python -m json.tool codemeta.json > /dev/null  # Fails on invalid JSON; the output is discarded.

      - name: yamllint  # Style and syntax of every YAML file.
        run: yamllint --strict --config-file .yamllint.yml .  # Warnings fail as well as errors.

      - name: Remaining YAML files parse  # GitHub files without a published schema.
        run: |  # Shell script run by bash.
          # Run the following Python program from standard input.
          python - <<'PY'
          # Build the file paths.
          import pathlib
          # Parse YAML.
          import yaml

          # Files in .github/ that are only checked for valid YAML syntax.
          files = ["labels.yml", "labeler.yml", "release.yml", "dependency-review-config.yml", "FUNDING.yml"]
          # Check each file in turn.
          for name in files:
              # Parse the file; a syntax error raises and fails the step.
              yaml.safe_load(pathlib.Path(".github", name).read_text(encoding="utf-8"))
              # Report the file as valid.
              print(f"{name}: ok")
          # End of the Python program.
          PY

  security-insights:  # OpenSSF Security Insights file.
    name: Validate security-insights.yml  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 10  # Cancel a hung job after ten minutes.
    env:  # Pinned tool and schema versions.
      CUE_VERSION: v0.17.1  # Release of the cue tool.
      SPEC_VERSION: v2.2.0  # Release of the Security Insights specification.
    steps:  # Steps of the Security Insights job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Install cue and fetch the Security Insights schema  # Download the pinned tool and schema.
        run: |  # Shell script run by bash.
          # Download the cue release archive and extract only the cue binary into the runner temp directory.
          curl -sSfL "https://github.com/cue-lang/cue/releases/download/${CUE_VERSION}/cue_${CUE_VERSION}_linux_amd64.tar.gz" | tar -xz -C "${RUNNER_TEMP}" cue
          # Shallow clone of the specification at the pinned release.
          git clone --quiet --depth 1 --branch "${SPEC_VERSION}" https://github.com/ossf/security-insights.git "${RUNNER_TEMP}/security-insights"

      # cue resolves the schema package relative to the working directory,
      # so run it from inside the schema checkout.
      - name: Validate against the Security Insights schema
        working-directory: ${{ runner.temp }}/security-insights  # Root of the schema checkout.
        run: |  # Shell script run by bash.
          # Validate the file of the repository against the SecurityInsights definition.
          "${RUNNER_TEMP}/cue" vet -d '#SecurityInsights' ./spec "${GITHUB_WORKSPACE}/security-insights.yml"

