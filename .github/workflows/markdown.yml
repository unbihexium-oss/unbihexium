name: Markdown

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - ".markdownlint.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Lint Markdown files
        run: npx --yes markdownlint-cli@0.45.0 --config .markdownlint.json "**/*.md" --ignore node_modules
