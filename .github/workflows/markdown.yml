# Abstract
# --------
# Two jobs, started when a Markdown file, the rule file or the identifier
# check changes, or on demand:
#
#   markdownlint   markdownlint-cli over every Markdown file with the rules
#                  in .markdownlint.yaml; the version is pinned in the npx
#                  command, keep it in step with the pre-commit hook
#   document-ids   .github/scripts/check_document_ids.py: the numbered
#                  identifiers of the controlled documents against the
#                  register in docs/document_register.md and docs/toc.md
# =============================================================================

name: Markdown  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
    paths:  # Only when documentation or its rules change.
      - "**/*.md"  # Any Markdown file.
      - ".markdownlint.yaml"  # The lint rules.
      - ".github/scripts/check_document_ids.py"  # The identifier check.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.
    paths:  # Same path filter as for pushes.
      - "**/*.md"  # Any Markdown file.
      - ".markdownlint.yaml"  # The lint rules.
      - ".github/scripts/check_document_ids.py"  # The identifier check.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege token for every job.
  contents: read  # The job only needs to read the repository.

concurrency:  # One run per workflow and ref at a time.
  group: ${{ github.workflow }}-${{ github.ref }}  # Group by workflow and branch or pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Cancel superseded pull request runs; let main runs finish.

jobs:  # Jobs of the workflow.
  markdownlint:  # Lint the Markdown files.
    name: markdownlint  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner with Node.js.
    timeout-minutes: 10  # Cancel a hung job after ten minutes.
    steps:  # Steps of the lint job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Lint Markdown files  # Run the pinned markdownlint-cli through npx.
        run: npx --yes markdownlint-cli@0.49.1 --config .markdownlint.yaml "**/*.md" --ignore node_modules  # Check all Markdown files except dependencies.

  document-ids:  # Numbered identifiers of the controlled documents.
    name: Document identifiers  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 5  # The check takes seconds; cancel a hung job early.
    steps:  # Steps of the identifier job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for the check script.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Check the document identifiers  # Compare control tables, register and table of contents.
        run: python .github/scripts/check_document_ids.py  # Standard library only, no installation needed.

