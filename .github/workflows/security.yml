# Abstract
# --------
# Three security jobs, run on pushes to main, on pull requests and weekly on
# Sunday at 00:00 UTC:
#
#   bandit             static analysis of src/ with the Bandit settings in
#                      pyproject.toml; any finding fails the job
#   pip-audit          audits the lock files requirements.txt and
#                      requirements-dev.txt against the PyPI advisory
#                      database; any known vulnerability fails the job
#   dependency-review  pull requests only: blocks new dependencies with
#                      high or critical vulnerabilities or denied licences,
#                      as configured in .github/dependency-review-config.yml
#
# The weekly run catches advisories published after a merge: a red weekly
# run means that a locked version needs an update. The tools come from the
# hashed lock file .github/requirements/requirements-ci-tools.txt.
# =============================================================================

name: Security  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.
  schedule:  # Weekly run to catch newly disclosed vulnerabilities.
    - cron: "0 0 * * 0"  # Every Sunday at 00:00 UTC.

permissions:  # Least-privilege token for every job.
  contents: read  # The jobs only need to read the repository.

jobs:  # Jobs of the workflow.
  bandit:  # Static security analysis of the sources.
    name: Bandit Security Scan  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    steps:  # Steps of the Bandit job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the commit under test.

      - name: Set up Python  # Install the interpreter for Bandit.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install bandit  # Install Bandit with TOML support.
        run: python -m pip install --require-hashes -r .github/requirements/requirements-ci-tools.txt  # Locked, hashed CI tools, including bandit[toml].

      - name: Run bandit  # Scan the package recursively.
        run: bandit -c pyproject.toml -r src/  # Any finding fails the job.

  pip-audit:  # Known vulnerabilities in dependencies.
    name: Dependency Audit  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    steps:  # Steps of the audit job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the commit under test.

      - name: Set up Python  # Install the interpreter for pip-audit.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install dependencies  # Install the auditor and the core dependencies.
        run: |  # Shell script run by bash.
          # Install the locked, hashed CI tools, including the dependency auditor.
          python -m pip install --require-hashes -r .github/requirements/requirements-ci-tools.txt

      - name: Run pip-audit  # Audit the lock files; any known vulnerability fails the job.
        run: |  # Shell script run by bash.
          # Audit the exact versions of the runtime lock file.
          pip-audit --require-hashes --disable-pip --progress-spinner off -r requirements.txt
          # Audit the development lock file, which also covers every extra.
          pip-audit --require-hashes --disable-pip --progress-spinner off -r requirements-dev.txt

  dependency-review:  # Review dependency changes of a pull request.
    name: Dependency Review  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    if: github.event_name == 'pull_request'  # Needs a base and head to compare.
    steps:  # Steps of the review job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the configuration file.

      - name: Dependency Review  # Compare the dependency manifests of base and head.
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48  # v4.9.0; Official dependency review action.
        with:  # Inputs of the review action.
          config-file: ./.github/dependency-review-config.yml  # Severity and licence rules.

