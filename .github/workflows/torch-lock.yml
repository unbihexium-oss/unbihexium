#
# Abstract
# --------
# Compiles .github/requirements/requirements-ci-torch.txt, the hashed lock
# file of the CPU build of PyTorch (without its dependencies, which are locked
# from PyPI in requirements-ci-test.txt), from requirements-ci-torch.in
# against https://download.pytorch.org/whl/cpu. That index is not reachable from
# every environment that runs `make lock`, so the lock is compiled here: the
# job prints the complete file in its log, uploads it as an artifact and
# fails when it differs from the committed file, so that an outdated lock is
# visible. Copy the printed file into the repository to update it.
#
# Runs on demand, weekly on Thursday at 05:00 UTC to report new PyTorch
# releases, and on pushes to any branch that change the input, the lock
# file or this workflow.
# =============================================================================

name: Torch Lock  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to any branch.
    paths:  # Only when the lock, its input or this workflow change.
      - ".github/requirements/requirements-ci-torch.in"  # Input of the lock.
      - ".github/requirements/requirements-ci-torch.txt"  # The lock file.
      - ".github/workflows/torch-lock.yml"  # This workflow.
  schedule:  # Weekly check for new PyTorch releases.
    - cron: "0 5 * * 4"  # Every Thursday at 05:00 UTC.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege token for every job.
  contents: read  # The job only needs to read the repository.

jobs:  # Jobs of the workflow.
  compile:  # Compile, print, upload and compare the lock file.
    name: Compile the PyTorch lock  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 15  # Resolution takes about a minute.
    steps:  # Steps of the lock job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the input and the committed lock.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for uv and the merge script.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install uv  # Hashed CI tools, including uv.
        run: python -m pip install --require-hashes -r .github/requirements/requirements-ci-tools.txt  # Locked, hashed CI tools.

      - name: Compile the lock  # Resolve against the PyTorch CPU index with hashes.
        run: |  # Shell script run by bash.
          # PyTorch alone (its dependencies are locked from PyPI in the test
          # lock), universal for CPython 3.10 and newer with one hash per
          # file; the header of the committed file names the index for pip.
          uv pip compile .github/requirements/requirements-ci-torch.in --universal --python-version 3.10 --no-deps --generate-hashes --index-url https://download.pytorch.org/whl/cpu --custom-compile-command "Torch Lock workflow (.github/workflows/torch-lock.yml)" -o torch-lock.tmp
          # Keep the header and the footer of the committed file.
          python scripts/merge_lock.py .github/requirements/requirements-ci-torch.txt torch-lock.tmp
          # Print the complete lock file for copying.
          cat .github/requirements/requirements-ci-torch.txt

      - name: Upload the lock file  # Keep the compiled file with the run.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1; Official artifact upload action.
        with:  # Inputs of the upload action.
          name: requirements-ci-torch  # Artifact name.
          path: .github/requirements/requirements-ci-torch.txt  # The compiled lock file.
          retention-days: 30  # Keep the file for a month.

      - name: Compare with the committed lock  # Fail when the committed file is outdated.
        run: git diff --exit-code -- .github/requirements/requirements-ci-torch.txt  # Shows the difference in the log.

