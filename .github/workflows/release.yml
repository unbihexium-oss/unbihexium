#
# Abstract
# --------
# Runs when a version tag (v*) is pushed. It builds the sdist and the wheel,
# writes SHA256SUMS.txt, creates GitHub build provenance attestations for the
# distributions, creates the GitHub release with the distributions, the
# checksum file and generated release notes (categories in
# .github/release.yml), and finally uploads the distributions to PyPI with
# the PYPI_API_TOKEN repository secret. The distribution version is the
# static version in pyproject.toml, not the tag, so bump it before tagging;
# the workflow does not compare the two. SLSA provenance for the published
# release is produced separately by slsa.yml.
# =============================================================================

name: Release  # Name shown in the Actions tab.

on:  # Events that start the workflow.
  push:  # Run on pushes.
    tags:  # Only tag pushes, never branch pushes.
      - "v*"  # Version tags such as v1.2.3.

permissions:  # Least-privilege default token; the job widens only what it needs.
  contents: read  # Read the repository.

jobs:  # Jobs of the workflow.
  release:  # Build, attest and publish.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    permissions:  # Token permissions of the release job.
      contents: write  # Create the GitHub release and upload its assets.
      id-token: write  # Request the OIDC token for the attestations and PyPI trusted publishing.
      attestations: write  # Store the build provenance attestations.
    steps:  # Steps of the release job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the tagged commit.

      - name: Set up Python  # Install the interpreter for the build.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install build tools  # Install the PEP 517 frontend.
        run: pip install build  # Latest build release from PyPI.

      - name: Build package  # Create the sdist and the wheel in dist/.
        run: python -m build  # Builds in an isolated environment.

      # Keep SHA256SUMS.txt outside dist/ so that only distributions are uploaded to PyPI.
      - name: Generate checksums
        run: |  # Shell script run by bash.
          # Directory for the checksum file, outside dist/.
          mkdir -p checksums
          # Hash the files by their bare names.
          cd dist
          # Write one SHA-256 line per distribution.
          sha256sum -- * > ../checksums/SHA256SUMS.txt

      - name: Generate attestations  # Sign build provenance for the distributions.
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0; Official attestation action.
        with:  # Inputs of the attestation action.
          subject-path: dist/*  # Attest every distribution file.

      - name: Create GitHub Release  # Publish the release page with its assets.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2; Release creation action.
        with:  # Inputs of the release action.
          files: |  # Assets attached to the release, one pattern per line.
            dist/*
            checksums/SHA256SUMS.txt
          generate_release_notes: true  # Build the notes from merged pull requests.

      - name: Publish to PyPI  # Upload the distributions to PyPI.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2; Official PyPA publish action.
        with:  # Inputs of the publish action.
          password: ${{ secrets.PYPI_API_TOKEN }}  # PyPI API token from the repository secrets.

