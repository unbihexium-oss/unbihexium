#
# Abstract
# --------
# Runs when a version tag (v*) is pushed. It builds the sdist and the wheel,
# writes SHA256SUMS.txt, installs the wheel with the locked runtime
# dependencies into a clean environment and writes its SPDX SBOM
# (unbihexium-<tag>.spdx.json), creates GitHub build provenance and SBOM
# attestations for the distributions, signs them with Sigstore (keyless,
# bound to this workflow through its OIDC identity), creates the GitHub
# release with the distributions, their .sigstore.json signature bundles,
# the signed SLSA provenance as unbihexium-<tag>.intoto.jsonl, the SBOM, the
# checksum file and generated release notes (categories in
# .github/release.yml), and finally uploads the distributions to PyPI with
# trusted publishing: PyPI accepts the OIDC token of this job in the
# environment "pypi", so no upload token is stored in the repository, and
# the publish action adds PEP 740 attestations. The trusted publisher is
# registered on PyPI for this repository, release.yml and the environment
# "pypi" (docs/operations/releasing.md).
#
# The distribution version is the static version in pyproject.toml, not the
# tag, so bump it before tagging: the first step after the checkout runs
# .github/scripts/check_release_version.py and stops
# the release when the tag differs from the version in pyproject.toml,
# _version.py, CITATION.cff or codemeta.json.
#
# Verify a downloaded distribution with
#   python -m sigstore verify github --cert-identity \
#     https://github.com/unbihexium-oss/unbihexium/.github/workflows/release.yml@refs/tags/<tag> \
#     <file>
#
# The provenance comes from the GitHub artifact attestation of this job
# (SLSA provenance v1, signed with Sigstore), so no separate provenance
# workflow is needed; a workflow started by the release event would not run
# anyway, because events caused by the GITHUB_TOKEN do not start other
# workflows. The signature bundles and the provenance are the signed release
# artifacts that OpenSSF Scorecard looks for (Signed-Releases).
# =============================================================================

name: Release  # Name shown in the Actions tab.

on:  # Events that start the workflow.
  push:  # Run on pushes.
    tags:  # Only tag pushes, never branch pushes.
      - "v*"  # Version tags such as v1.2.3.

permissions:  # Least-privilege default token; the job widens only what it needs.
  contents: read  # Read the repository.

jobs:  # Jobs of the workflow.
  release:  # Build, attest and publish.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    environment:  # Deployment environment; the PyPI trusted publisher is bound to it.
      name: pypi  # Environment name registered for the trusted publisher on PyPI.
      url: https://pypi.org/project/unbihexium/  # Project page shown with the deployment.
    permissions:  # Token permissions of the release job.
      contents: write  # Create the GitHub release and upload its assets.
      id-token: write  # OIDC token for trusted publishing, Sigstore signing and the attestations.
      attestations: write  # Store the build provenance and SBOM attestations.
    steps:  # Steps of the release job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the tagged commit.

      - name: Set up Python  # Install the interpreter for the build.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Check the tag against the version  # Stop before the build when the version was not bumped.
        env:  # Values passed to the script.
          TAG: ${{ github.ref_name }}  # Pushed tag, for example v1.2.3.
        run: python .github/scripts/check_release_version.py "$TAG"  # Compare the tag with the metadata files.

      - name: Install build tools  # Install the PEP 517 frontend.
        run: python -m pip install --require-hashes -r .github/requirements/requirements-ci-tools.txt  # Locked, hashed CI tools, including build.

      - name: Build package  # Create the sdist and the wheel in dist/.
        run: python -m build --no-isolation  # Uses the hash-pinned hatchling of the tools lock.

      # Keep SHA256SUMS.txt outside dist/ so that only distributions are uploaded to PyPI.
      - name: Generate checksums
        run: |  # Shell script run by bash.
          # Directory for the checksum file, outside dist/.
          mkdir -p checksums
          # Hash the files by their bare names.
          cd dist
          # Write one SHA-256 line per distribution.
          sha256sum -- * > ../checksums/SHA256SUMS.txt

      - name: Install the release into a clean environment  # The environment that the SBOM describes.
        run: |  # Shell script run by bash.
          # Output directory of the SBOM, outside dist/.
          mkdir -p sbom
          # Environment without pip, so that it holds only the release and its dependencies.
          python -m venv --without-pip sbom-env
          # Locked, hashed runtime dependencies (onnx and serving extras), as users install them.
          python -m pip --python sbom-env/bin/python install --require-hashes -r requirements.txt
          # The built wheel on top, without resolving dependencies again.
          python -m pip --python sbom-env/bin/python install --no-deps dist/*.whl

      - name: Generate the SBOM  # SPDX SBOM of the installed release, written by Syft.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2; Syft-based SBOM action.
        with:  # Inputs of the SBOM action.
          path: sbom-env  # Catalogue the packages installed in the clean environment.
          format: spdx-json  # SPDX 2.3 JSON.
          output-file: sbom/unbihexium-${{ github.ref_name }}.spdx.json  # Release asset name.
          upload-release-assets: false  # The release step below attaches it.

      - name: Attest the SBOM  # The SBOM as a signed attestation of the distributions.
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0; Official SBOM attestation action.
        with:  # Inputs of the attestation action.
          subject-path: dist/*  # Both distributions.
          sbom-path: sbom/unbihexium-${{ github.ref_name }}.spdx.json  # SBOM of the previous step.

      - name: Generate attestations  # Sign build provenance for the distributions.
        id: provenance  # Identifier for reading the bundle path.
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0; Official attestation action.
        with:  # Inputs of the attestation action.
          subject-path: dist/*  # Attest every distribution file.

      - name: Copy the distributions for signing  # Keep the signature bundles out of dist/.
        run: |  # Shell script run by bash.
          # Separate directory, because PyPI accepts only distributions from dist/.
          mkdir -p signed
          # Copy the sdist and the wheel.
          cp dist/* signed/

      - name: Sign the distributions with Sigstore  # Keyless signatures bound to this workflow.
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0; Official Sigstore signing action.
        with:  # Inputs of the signing action.
          inputs: ./signed/*.tar.gz ./signed/*.whl  # Writes <file>.sigstore.json next to each distribution.

      - name: Export the SLSA provenance  # Release asset in the in-toto JSON Lines format.
        env:  # Inputs of the export.
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}  # Sigstore bundle of the attestation.
        run: |  # Shell script run by bash.
          # The DSSE envelope of the bundle holds the signed SLSA provenance
          # statement for every distribution, one envelope per line as in
          # the .intoto.jsonl layout; verify the distributions themselves
          # with gh attestation verify.
          jq -c '.dsseEnvelope' "$BUNDLE" > "signed/unbihexium-${GITHUB_REF_NAME}.intoto.jsonl"

      - name: Create GitHub Release  # Publish the release page with its assets.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2; Release creation action.
        with:  # Inputs of the release action.
          files: |  # Assets attached to the release, one pattern per line.
            dist/*
            signed/*.sigstore.json
            signed/*.intoto.jsonl
            sbom/*.spdx.json
            checksums/SHA256SUMS.txt
          generate_release_notes: true  # Build the notes from merged pull requests.

      # Trusted publishing: the action exchanges the OIDC token of this job for
      # a short-lived PyPI upload token, and uploads PEP 740 attestations.
      - name: Publish to PyPI  # Upload the distributions in dist/ to PyPI.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2; Official PyPA publish action.

