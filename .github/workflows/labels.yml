#
# Abstract
# --------
# Creates and updates the issue and pull request labels of the repository
# so that they match the definitions in .github/labels.yml (names, colours
# and descriptions). Labels that exist on GitHub but not in the file are
# kept. Pull requests that change the label file run in dry-run mode and only
# print the planned changes; the labels are applied after the merge to main
# or on a manual run.
# =============================================================================

name: Labels  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch applies the labels.
    paths:  # Only when the label definitions or this workflow change.
      - ".github/labels.yml"  # Label definitions.
      - ".github/workflows/labels.yml"  # This workflow.
  pull_request:  # Run on pull requests (dry run).
    branches: [main]  # Only pull requests that target the default branch.
    paths:  # Same path filter as for pushes.
      - ".github/labels.yml"  # Label definitions.
      - ".github/workflows/labels.yml"  # This workflow.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege default token for every job.
  contents: read  # Read the repository only.

jobs:  # Jobs of the workflow.
  sync:  # Apply the label definitions.
    name: Sync labels  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    permissions:  # Token permissions of this job.
      contents: read  # Read the label file.
      issues: write  # Create and edit labels.
    steps:  # Steps of the sync job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the label definitions.

      - name: Synchronise labels from .github/labels.yml  # Create and update labels.
        uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d  # v6.0.0; Label synchronisation action.
        with:  # Inputs of the labeler action.
          yaml-file: .github/labels.yml  # Label definitions to apply.
          skip-delete: true  # Keep labels that are not in the file.
          dry-run: ${{ github.event_name == 'pull_request' }}  # Only report changes for pull requests.

