#
# Abstract
# --------
# Enforces the licensing policy of the project with three jobs:
#
#   headers       check_license_headers.py verifies LICENSE.txt and the
#                 MPL-2.0 notice at the top of every source file
#   reuse         reuse lint checks that every file carries copyright and
#                 licence information (REUSE specification)
#   dependencies  installs the package, lists the licences of all installed
#                 distributions with pip-licenses and rejects strong
#                 copyleft and source-available licences with
#                 check_dependency_licenses.py
#
# Runs on pushes to main, on pull requests, weekly on Monday at 04:00 UTC
# (dependencies may change licence between releases) and on demand.
# =============================================================================

name: License Compliance  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.
  schedule:  # Weekly run to catch licence changes in dependencies.
    - cron: "0 4 * * 1"  # Every Monday at 04:00 UTC.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege token for every job.
  contents: read  # The jobs only need to read the repository.

concurrency:  # One run per workflow and ref at a time.
  group: ${{ github.workflow }}-${{ github.ref }}  # Group by workflow and branch or pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Cancel superseded pull request runs; let main runs finish.

jobs:  # Jobs of the workflow.
  headers:  # MPL-2.0 notice in every source file.
    name: MPL-2.0 notices  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 5  # The check takes seconds; cancel a hung job early.
    steps:  # Steps of the headers job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for the check script.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Check licence text and source file notices  # Run the notice check.
        run: python .github/scripts/check_license_headers.py  # Standard library only, no installation needed.

  reuse:  # REUSE specification compliance.
    name: REUSE compliance  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 10  # Cancel a hung job after ten minutes.
    steps:  # Steps of the REUSE job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for the reuse tool.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install reuse  # Install the REUSE command line tool.
        run: python -m pip install reuse  # Latest release from PyPI.

      # The repository keeps a single licence text, LICENSE.txt. REUSE
      # expects it under LICENSES/, so the check works on a copy.
      - name: Provide the licence text where REUSE expects it
        run: |  # Shell script run by bash.
          # Create the directory that REUSE reads licence texts from.
          mkdir -p LICENSES
          # Copy the licence text under its SPDX identifier.
          cp LICENSE.txt LICENSES/MPL-2.0.txt

      - name: Check that every file has copyright and licence information  # Run the REUSE linter.
        run: reuse lint  # Fails when a file lacks copyright or licence data.

  dependencies:  # Licences of the runtime dependencies.
    name: Dependency licences  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 20  # Installing the dependencies takes a few minutes.
    steps:  # Steps of the dependency job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for the package.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install the package and pip-licenses  # Install what is to be audited.
        run: |  # Shell script run by bash.
          # Upgrade pip first so that current wheels are found.
          python -m pip install --upgrade pip
          # Install the package with its runtime dependencies and the licence lister.
          python -m pip install . pip-licenses

      - name: Collect licences of installed dependencies  # Write the licence inventory.
        run: pip-licenses --from=mixed --format=json --with-urls --output-file licenses.json  # Read classifiers and licence metadata, write JSON.

      - name: Check licences against the project policy  # Apply the licence policy of the project.
        run: python .github/scripts/check_dependency_licenses.py licenses.json  # Fails on GPL, AGPL, SSPL or Commons Clause licences.

