name: License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  headers:
    name: MPL-2.0 notices
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Check licence text and source file notices
        run: python .github/scripts/check_license_headers.py

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install reuse
        run: python -m pip install reuse

      # The repository keeps a single licence text, LICENSE.txt. REUSE
      # expects it under LICENSES/, so the check works on a copy.
      - name: Provide the licence text where REUSE expects it
        run: |
          mkdir -p LICENSES
          cp LICENSE.txt LICENSES/MPL-2.0.txt

      - name: Check that every file has copyright and licence information
        run: reuse lint

  dependencies:
    name: Dependency licences
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install the package and pip-licenses
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pip-licenses

      - name: Collect licences of installed dependencies
        run: pip-licenses --from=mixed --format=json --with-urls --output-file licenses.json

      - name: Check licences against the project policy
        run: python .github/scripts/check_dependency_licenses.py licenses.json
