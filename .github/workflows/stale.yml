#
# Abstract
# --------
# Runs daily at 03:30 UTC. Issues without activity for 60 days and pull
# requests without activity for 45 days receive the "stale" label and a
# comment; 14 days later they are closed unless someone responds, which
# removes the label again. Draft pull requests and items with one of the
# exempt labels (security, confirmed, blocked and others listed below) are
# never marked. At most 100 API operations are used per run to stay within
# the rate limit. Keep the day counts in the messages in step with the
# settings.
# =============================================================================

name: Stale  # Name shown in the Actions tab.

on:  # Events that start the workflow.
  schedule:  # Daily housekeeping.
    - cron: "30 3 * * *"  # Every day at 03:30 UTC.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege default token for every job.
  contents: read  # Read the repository only.

concurrency:  # Never run two stale runs at once.
  group: ${{ github.workflow }}  # A single group for the whole workflow.
  cancel-in-progress: false  # Queue a new run instead of cancelling the running one.

jobs:  # Jobs of the workflow.
  stale:  # Label, comment on and close inactive items.
    name: Mark and close stale issues and pull requests  # Name of the job.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 10  # Cancel a hung run after ten minutes.
    permissions:  # Token permissions of this job.
      issues: write  # Label, comment on and close issues.
      pull-requests: write  # Label, comment on and close pull requests.
    steps:  # Steps of the stale job.
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0; Official stale action.
        with:  # Inputs of the stale action.
          days-before-issue-stale: 60  # Days of inactivity before an issue is marked.
          days-before-issue-close: 14  # Days after marking before an issue is closed.
          days-before-pr-stale: 45  # Days of inactivity before a pull request is marked.
          days-before-pr-close: 14  # Days after marking before a pull request is closed.
          stale-issue-label: stale  # Label that marks a stale issue.
          stale-pr-label: stale  # Label that marks a stale pull request.
          exempt-issue-labels: security,confirmed,blocked,help wanted,good first issue,breaking-change,compliance  # Issues with any of these labels are never marked.
          exempt-pr-labels: security,blocked,breaking-change,dependencies  # Pull requests with any of these labels are never marked.
          exempt-draft-pr: true  # Draft pull requests are never marked.
          remove-stale-when-updated: true  # New activity removes the stale label.
          operations-per-run: 100  # Cap on API calls per run, for the rate limit.
          stale-issue-message: >-  # Comment posted when an issue is marked.
            This issue has had no activity for 60 days and is now marked as stale.
            It will be closed in 14 days unless there is new activity. Comment with
            any new information to keep it open.
          close-issue-message: >-  # Comment posted when an issue is closed.
            This issue was closed because it had no activity for 14 days after being
            marked as stale. Reopen it or open a new issue if the problem persists.
          stale-pr-message: >-  # Comment posted when a pull request is marked.
            This pull request has had no activity for 45 days and is now marked as
            stale. It will be closed in 14 days unless there is new activity.
          close-pr-message: >-  # Comment posted when a pull request is closed.
            This pull request was closed because it had no activity for 14 days after
            being marked as stale. Reopen it when you resume work.

