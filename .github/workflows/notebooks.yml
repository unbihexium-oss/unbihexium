#
# Abstract
# --------
# Validates every notebook under examples/notebooks with
# .github/scripts/check_notebooks.py: the file must be a valid nbformat
# document and must be committed without outputs or execution counts, which
# keeps diffs reviewable and the repository small. The notebooks are not
# executed here. The workflow starts only when a notebook or the check
# script changes, or on demand.
# =============================================================================

name: Notebooks  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
    paths:  # Only when a notebook or the check changes.
      - "examples/notebooks/**"  # The example notebooks.
      - ".github/scripts/check_notebooks.py"  # The check script.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.
    paths:  # Same path filter as for pushes.
      - "examples/notebooks/**"  # The example notebooks.
      - ".github/scripts/check_notebooks.py"  # The check script.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege token for every job.
  contents: read  # The job only needs to read the repository.

concurrency:  # One run per workflow and ref at a time.
  group: ${{ github.workflow }}-${{ github.ref }}  # Group by workflow and branch or pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Cancel superseded pull request runs; let main runs finish.

jobs:  # Jobs of the workflow.
  validate:  # Check format and absence of outputs.
    name: Validate notebooks  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 10  # Cancel a hung job after ten minutes.
    steps:  # Steps of the validation job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for the check script.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install nbformat  # Install the notebook format validator.
        run: python -m pip install --require-hashes -r .github/requirements/requirements-ci-tools.txt  # Locked, hashed CI tools, including nbformat.

      - name: Check format and absence of outputs  # Run the notebook check.
        run: python .github/scripts/check_notebooks.py examples/notebooks  # Validate every notebook in the directory.

