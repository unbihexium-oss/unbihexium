# Abstract
# --------
# When a GitHub release is published (or on demand), the build job rebuilds
# the sdist and the wheel, attests them with GitHub build provenance and
# passes their SHA-256 digests, base64 encoded, to the reusable SLSA
# generator workflow. The generator runs in isolation and signs an in-toto
# provenance statement for SLSA Build Level 3. For a release event the
# provenance file is attached to the release as an asset; manual runs only
# keep it as a workflow artifact. Verify a download with slsa-verifier
# against the .intoto.jsonl asset.
# =============================================================================

name: SLSA Provenance  # Name shown in the Actions tab.

on:  # Events that start the workflow.
  release:  # Run on release events.
    types: [published]  # Only when a release is published.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege default token for every job.
  contents: read  # Read the repository only.

jobs:  # Jobs of the workflow.
  build:  # Build the distributions and compute their digests.
    name: Build distributions  # Name of the job.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 15  # Cancel a hung build after 15 minutes.
    permissions:  # Token permissions of this job.
      contents: read  # Read the repository.
      id-token: write  # Request the OIDC token for the attestation.
      attestations: write  # Store the build provenance attestation.
    outputs:  # Values passed to the provenance job.
      hashes: ${{ steps.hash.outputs.hashes }}  # Base64 encoded sha256sum output.
    steps:  # Steps of the build job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the released commit.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Set up Python  # Install the interpreter for the build.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Build package  # Create the sdist and the wheel in dist/.
        run: |  # Shell script run by bash.
          # Install the PEP 517 frontend.
          python -m pip install build
          # Build both distributions in an isolated environment.
          python -m build

      - name: Compute subject hashes  # Digests that the provenance will cover.
        id: hash  # Identifier for reading the output.
        run: |  # Shell script run by bash.
          # Hash the files by their bare names.
          cd dist
          # Store the base64 encoded checksum list as the step output.
          echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub build provenance attestation  # Sign provenance with GitHub attestations.
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f  # v3.2.0; Official attestation action.
        with:  # Inputs of the attestation action.
          subject-path: dist/*  # Attest every distribution file.

      - name: Upload distributions  # Keep the built files with the run.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1; Official artifact upload action.
        with:  # Inputs of the upload action.
          name: dist  # Artifact name.
          path: dist/  # Upload the whole distribution directory.
          retention-days: 7  # Keep the artifact for a week.

  provenance:  # Generate and sign the SLSA provenance.
    name: Generate SLSA Level 3 provenance  # Name of the job.
    needs: build  # Wait for the digests.
    permissions:  # Token permissions required by the generator.
      actions: read  # Read the workflow run to describe the build.
      id-token: write  # Sign the provenance with Sigstore.
      contents: write  # Upload the provenance to the release.
    # The SLSA generator must be referenced by its release tag, not by a commit SHA.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:  # Inputs of the reusable generator workflow.
      base64-subjects: ${{ needs.build.outputs.hashes }}  # Digests computed by the build job.
      upload-assets: ${{ github.event_name == 'release' }}  # Attach the provenance only to real releases.

