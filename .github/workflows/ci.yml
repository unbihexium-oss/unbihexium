#
# Abstract
# --------
# The main quality gate for pushes to and pull requests against main. Three
# independent jobs run in parallel:
#
#   lint       ruff check and ruff format --check over src/, with the rules
#              from pyproject.toml (the pre-commit hooks run the same checks)
#   typecheck  pyright in standard mode (pyproject.toml) on Python 3.13, with
#              the SciPy type stubs; any type error fails the run
#   test       pytest over tests/ on every supported CPython from 3.10 to
#              3.14, with CPU-only PyTorch and the optional backends
#
# Keep the Python versions of the test matrix in step with the classifiers
# and requires-python in pyproject.toml.
# =============================================================================

name: CI  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch; feature branches use pull requests.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.

permissions:  # Least-privilege token for every job.
  contents: read  # The jobs only need to read the repository.

jobs:  # Jobs of the workflow; they run in parallel.
  lint:  # Lint and format check with ruff.
    name: Lint  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    steps:  # Steps of the lint job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.

      - name: Set up Python  # Install the interpreter used by ruff.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.

      - name: Install ruff  # Install the linter and formatter.
        run: python -m pip install --require-hashes -r .github/requirements/requirements-ci-tools.txt  # Locked, hashed CI tools, including ruff.

      - name: Run ruff check  # Lint the package sources.
        run: ruff check src/ --config pyproject.toml  # Use the rule set from pyproject.toml.

      - name: Run ruff format check  # Verify the code formatting.
        run: ruff format --check src/  # Fail when a file would be reformatted.

  typecheck:  # Static type check with pyright.
    name: Type Check  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    steps:  # Steps of the type check job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.

      - name: Set up Python  # Install the interpreter that pyright resolves imports against.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.13"  # scipy-stubs requires Python 3.12 or newer.

      - name: Install dependencies  # Install pyright, the type stubs and the package so imports resolve.
        run: |  # Shell script run by bash.
          # Install the locked, hashed CPU-only PyTorch build from the PyTorch index.
          python -m pip install --require-hashes --no-deps -r .github/requirements/requirements-ci-torch.txt
          # Install the locked, hashed type check environment: the test environment,
          # pyright and the SciPy type stubs.
          python -m pip install --require-hashes -r .github/requirements/requirements-ci-typecheck.txt
          # Install the package itself in editable mode without resolving dependencies again.
          python -m pip install --no-deps -e .

      - name: Run pyright  # Type check src/.
        run: pyright src/  # Settings from pyproject.toml; any type error fails the job.

  test:  # Unit tests on every supported Python version.
    name: Test  # Name of the status check (the matrix adds the version).
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    strategy:  # Matrix over the Python versions.
      fail-fast: false  # Let the other versions finish when one fails.
      matrix:  # Values of the matrix.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]  # All supported CPython releases.

    steps:  # Steps of the test job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.

      - name: Set up Python ${{ matrix.python-version }}  # Install the matrix Python.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: ${{ matrix.python-version }}  # Version from the matrix.

      # CPU wheels of PyTorch keep the download small; the extras cover the
      # optional backends that the tests exercise.
      - name: Install dependencies
        run: |  # Shell script run by bash.
          # Install the locked, hashed CPU-only PyTorch build from the PyTorch index;
          # its dependencies come from the hashed test lock.
          python -m pip install --require-hashes --no-deps -r .github/requirements/requirements-ci-torch.txt
          # Install the locked, hashed test environment (runtime, test and backend extras).
          python -m pip install --require-hashes -r .github/requirements/requirements-ci-test.txt
          # Install the package itself in editable mode without resolving dependencies again.
          python -m pip install --no-deps -e .

      - name: Run tests  # Run the whole test suite.
        run: pytest tests/ --tb=short  # Short tracebacks keep the log readable.

