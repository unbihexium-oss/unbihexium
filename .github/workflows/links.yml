#
# Abstract
# --------
# Checks every link in the Markdown files with lychee, configured by .github/lychee.toml. It runs weekly on Monday at
# 05:00 UTC and on demand, not on pull requests, because external sites fail
# intermittently and must not block merges. Broken links never fail the run;
# instead the report is posted to an open issue titled "Broken links report",
# which is created with the documentation label when none is open. The
# lychee action is pinned by commit SHA; Dependabot keeps the trailing
# version comment up to date.
# =============================================================================

name: Links  # Name shown in the Actions tab.

on:  # Events that start the workflow.
  schedule:  # Periodic check; links rot without code changes.
    - cron: "0 5 * * 1"  # Every Monday at 05:00 UTC.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege default token for every job.
  contents: read  # Read the repository only.

concurrency:  # Never run two link checks at once.
  group: ${{ github.workflow }}  # A single group for the whole workflow.
  cancel-in-progress: false  # Queue a new run instead of cancelling the running one.

jobs:  # Jobs of the workflow.
  lychee:  # Check the links and report the result.
    name: Check links  # Name of the job.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 30  # Cancel a hung check after half an hour.
    permissions:  # Token permissions of this job.
      contents: read  # Read the documentation.
      issues: write  # Create or comment on the report issue.
    steps:  # Steps of the link check job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6.1.0; Check out the documentation.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Check links in Markdown  # Run lychee over the documentation.
        id: lychee  # Identifier for reading the exit code later.
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:  # Inputs of the lychee action.
          args: >-  # lychee options followed by the files to check.
            --config .github/lychee.toml
            './**/*.md'
          output: lychee/report.md  # Markdown report used as the issue body.
          fail: false  # Broken links do not fail the job; the issue reports them.

      - name: Open or update the broken links issue  # Publish the report.
        if: steps.lychee.outputs.exit_code != 0  # Only when lychee found problems.
        env:  # Environment of the reporting step.
          GH_TOKEN: ${{ github.token }}  # Token for the GitHub CLI.
          TITLE: Broken links report  # Title of the report issue.
        run: |  # Shell script run by bash.
          # Look up the number of an open report issue, if there is one.
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number')
          # An open issue exists.
          if [ -n "$number" ]; then
            # Add the new report as a comment.
            gh issue comment "$number" --body-file lychee/report.md
          # No open issue yet.
          else
            # Open a new issue with the report as its body.
            gh issue create --title "$TITLE" --label documentation --body-file lychee/report.md
          # End of the issue selection.
          fi

