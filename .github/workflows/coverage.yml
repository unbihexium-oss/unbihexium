# Abstract
# --------
# Runs the test suite once on the newest supported Python with coverage
# measurement for src/unbihexium and uploads the XML report to Codecov under
# the "unittests" flag. Codecov settings (targets, comments) live in
# codecov.yml. An upload failure does not fail the job, so an outage at
# Codecov never blocks a merge. The upload uses the CODECOV_TOKEN repository
# secret, which is not available to pull requests from forks.
# =============================================================================

name: Coverage  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.

permissions:  # Least-privilege token for every job.
  contents: read  # The job only needs to read the repository.

jobs:  # Jobs of the workflow.
  coverage:  # Measure and upload coverage.
    name: Code Coverage  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    steps:  # Steps of the coverage job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the commit under test.

      - name: Set up Python  # Install the interpreter for the tests.
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0; Official Python setup action.
        with:  # Inputs of the setup action.
          python-version: "3.14"  # Newest supported CPython.
          cache: "pip"  # Cache downloaded wheels between runs.

      - name: Install dependencies  # Install the package with its test extras.
        run: |  # Shell script run by bash.
          # Install the locked, hashed CPU-only PyTorch build from the PyTorch index;
          # its dependencies come from the hashed test lock.
          python -m pip install --require-hashes --no-deps -r .github/requirements/requirements-ci-torch.txt
          # Install the locked, hashed test environment (runtime, test and backend extras).
          python -m pip install --require-hashes -r .github/requirements/requirements-ci-test.txt
          # Install the package itself in editable mode without resolving dependencies again.
          python -m pip install --no-deps -e .

      - name: Run tests with coverage  # Run the suite under pytest-cov.
        run: |  # Shell script run by bash.
          # Measure the package, write coverage.xml for Codecov and print a summary.
          pytest tests/ --cov=src/unbihexium --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov  # Send the report to Codecov.
        if: ${{ !cancelled() }}  # Also after a coverage failure, so that Codecov shows the drop.
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac  # v5.5.5; Official Codecov upload action.
        with:  # Inputs of the upload action.
          files: ./coverage.xml  # Report written by the previous step.
          flags: unittests  # Flag that groups these results in Codecov.
          name: unbihexium-coverage  # Name of the upload in the Codecov UI.
          fail_ci_if_error: false  # An upload failure does not fail the job.
          verbose: true  # Detailed upload log for troubleshooting.
        env:  # Environment of the upload step.
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}  # Upload token from the repository secrets.

