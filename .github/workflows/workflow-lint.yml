#
# Abstract
# --------
# Runs actionlint over every workflow in .github/workflows/ whenever one of
# them changes. actionlint checks the workflow syntax, expressions, job
# dependencies and action inputs, and runs shellcheck over the shell
# scripts of the run steps. The actionlint release archive is pinned by
# version and SHA-256 digest (from the checksums file of the release) in the
# install step; keep the version in step with the actionlint hook in
# .pre-commit-config.yaml and update the digest with it.
# =============================================================================

name: Workflow Lint  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch.
    paths:  # Only when a workflow changes.
      - ".github/workflows/**"  # All workflow files.
  pull_request:  # Run on pull requests.
    branches: [main]  # Only pull requests that target the default branch.
    paths:  # Same path filter as for pushes.
      - ".github/workflows/**"  # All workflow files.
  workflow_dispatch:  # Allow manual runs from the Actions tab.

permissions:  # Least-privilege token for every job.
  contents: read  # The job only needs to read the repository.

concurrency:  # One run per workflow and ref at a time.
  group: ${{ github.workflow }}-${{ github.ref }}  # Group by workflow and branch or pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # Cancel superseded pull request runs; let main runs finish.

jobs:  # Jobs of the workflow.
  actionlint:  # Lint the workflows.
    name: actionlint  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner with shellcheck preinstalled.
    timeout-minutes: 10  # Cancel a hung job after ten minutes.
    steps:  # Steps of the lint job.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Check out the workflows.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Install actionlint  # Download the pinned actionlint release and verify its digest.
        env:  # Version and SHA-256 digest of the linux_amd64 release archive.
          ACTIONLINT_VERSION: "1.7.12"  # Keep in step with the pre-commit hook.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  # From the release checksums file.
        run: |  # Shell script run by bash.
          # Release archive of the pinned version.
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          # Download it from the GitHub release.
          curl -sSfL -o "$archive" "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          # Refuse an archive whose digest differs from the pinned one.
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          # Extract the binary into the workspace.
          tar -xzf "$archive" actionlint

      - name: Lint workflows (actionlint with shellcheck)  # Check every workflow file.
        run: ./actionlint -color  # Coloured output for the log.

