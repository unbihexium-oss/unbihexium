# Abstract
# --------
# Runs the OpenSSF Scorecard checks (branch protection, pinned dependencies,
# token permissions, signed releases and more) on pushes to main, weekly on
# Monday at 06:00 UTC and whenever a branch protection rule changes. The
# results are published to the public Scorecard API, which feeds the badge
# in the README, and uploaded as SARIF to GitHub code scanning. Publishing
# requires the OIDC token and restricts the workflow: it must run on the
# default branch and may only use approved actions.
# =============================================================================

name: OpenSSF Scorecard  # Name shown in the Actions tab.

on:  # Events that start the workflow.
  branch_protection_rule:  # Rescore when the branch protection changes.
  schedule:  # Periodic rescore.
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC.
  push:  # Run on pushes to the listed branches.
    branches: [main]  # Only the default branch; Scorecard publishes for it alone.

permissions: read-all  # Read-only default token; the job widens only what it needs.

jobs:  # Jobs of the workflow.
  analysis:  # Run Scorecard and publish the results.
    name: Scorecard Analysis  # Name of the job.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    permissions:  # Token permissions of this job.
      security-events: write  # Upload the SARIF report to code scanning.
      id-token: write  # OIDC token that authenticates the result publication.
      contents: read  # Read the repository.
      actions: read  # Read the workflow definitions and runs.

    steps:  # Steps of the analysis job.
      - name: Checkout  # Check out the default branch.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0; Official checkout action.
        with:  # Inputs of the checkout action.
          persist-credentials: false  # Do not leave the token in .git/config.

      - name: Run Scorecard  # Evaluate the repository.
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a  # v2.4.3; Official Scorecard action.
        with:  # Inputs of the Scorecard action.
          results_file: results.sarif  # Where the report is written.
          results_format: sarif  # Format understood by code scanning.
          publish_results: true  # Publish to the Scorecard API for the badge.

      - name: Upload SARIF  # Show the findings in the Security tab.
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1; CodeQL SARIF upload action.
        with:  # Inputs of the upload action.
          sarif_file: results.sarif  # Report written by the Scorecard step.

