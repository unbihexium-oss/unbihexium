name: Labeler

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The action reads .github/labeler.yml from the base branch and never
      # checks out or runs code from the pull request.
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
