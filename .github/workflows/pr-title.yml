#
# Abstract
# --------
# Checks that the title of every pull request follows the Conventional
# Commits format "type(scope): description", because the title becomes the
# squash commit message and feeds the release notes. The allowed types are
# listed below; the scope is optional. The workflow uses
# pull_request_target so that it also works for forks; it never checks out
# the pull request and only reads its title. The action is pinned by commit
# SHA; Dependabot keeps the trailing version comment up to date.
# =============================================================================

name: PR Title  # Name shown in the Actions tab and in the status checks.

on:  # Events that start the workflow.
  pull_request_target:  # Runs in the context of the base branch, also for forks.
    types: [opened, edited, reopened, synchronize]  # Recheck when the title is edited.

permissions:  # Least-privilege default token for every job.
  contents: read  # Read the repository only.

concurrency:  # One run per pull request at a time.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}  # Group by pull request number.
  cancel-in-progress: true  # A newer edit supersedes the running check.

jobs:  # Jobs of the workflow.
  conventional-title:  # Validate the title.
    name: Conventional commit title  # Name of the status check.
    runs-on: ubuntu-latest  # GitHub-hosted Linux runner.
    timeout-minutes: 5  # The check takes seconds; cancel a hung job early.
    permissions:  # Token permissions of this job.
      pull-requests: read  # Read the pull request title.
    steps:  # Steps of the title job.
      - name: Validate the pull request title  # Parse the title as a conventional commit header.
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:  # Environment of the check step.
          GITHUB_TOKEN: ${{ github.token }}  # Token used to read the pull request.
        with:  # Inputs of the check action.
          types: |  # Allowed commit types, one per line.
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
            deps
          requireScope: false  # The scope in parentheses is optional.

