name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev gdal-bin || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,onnx,serving,zarr,parquet,stac]"

      - name: Run integration tests
        run: |
          pytest tests/integration/ --tb=short

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[test,onnx,serving,zarr,parquet,stac]"

      - name: Run E2E tests
        run: |
          pytest tests/e2e/ --tb=short

  api-test:
    name: API Integration
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[serving]"

      - name: Start API server
        run: |
          timeout 30 python -c "
          from unbihexium.serving import create_app
          import uvicorn
          app = create_app()
          uvicorn.run(app, host='127.0.0.1', port=8000)
          " &
          sleep 5

      # Wait up to 30 seconds for the server, then require a healthy answer.
      - name: Test API endpoints
        run: |
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:8000/health && exit 0; sleep 1; done
          exit 1
