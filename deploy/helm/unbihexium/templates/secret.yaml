Format      : Kubernetes manifest template (Go text/template), rendered by Helm 3
=============================================================================

Abstract
--------
Holds server.apiKey.value when it is set and no existing Secret is named;
the Deployment passes it to UNBIHEXIUM_SERVING__API_KEY.
=============================================================================
*/ -}}
{{- if and .Values.server.apiKey.value (not .Values.server.apiKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "unbihexium.apiKeySecret" . }}
  labels:
    {{- include "unbihexium.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.server.apiKey.secretKey }}: {{ .Values.server.apiKey.value | b64enc | quote }}
{{- end }}
