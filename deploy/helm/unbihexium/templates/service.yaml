apiVersion: v1
kind: Service
metadata:
  name: {{ include "unbihexium.fullname" . }}
  labels:
    {{- include "unbihexium.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "unbihexium.selectorLabels" . | nindent 4 }}
