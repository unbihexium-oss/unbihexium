Abstract
--------
Routes every path of the host names in ingress.hosts to the Service when
ingress.enabled is true. Rendering fails when the Ingress is enabled
without a host name.
=============================================================================
*/ -}}
{{- if .Values.ingress.enabled }}
{{- if not .Values.ingress.hosts }}
{{- fail "ingress.enabled is true, but ingress.hosts is empty: give at least one host name" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "unbihexium.fullname" . }}
  labels:
    {{- include "unbihexium.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "unbihexium.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
