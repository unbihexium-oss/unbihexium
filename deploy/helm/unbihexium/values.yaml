# Abstract
# --------
# Default configuration of the chart. Every key is read by a template in
# templates/. Override single values with `--set key=value` or a whole file
# with `-f my-values.yaml`. The defaults match the plain manifests in
# deploy/kubernetes/deployment.yaml: two pods of the REST API with a
# hardened security context, an ephemeral model cache, a ClusterIP Service,
# a CPU autoscaler and a disruption budget. The Ingress is off until a host
# name is given, and an API key is required only when one is configured.
# =============================================================================

replicaCount: 2  # Pods when autoscaling is disabled.

image:  # Container image of the REST API.
  repository: ghcr.io/unbihexium-oss/unbihexium  # Image published by .github/workflows/docker.yml.
  tag: main  # Tag of the main branch; use a version tag in production.
  digest: ""  # Optional sha256 digest; when set it pins the image and the tag is ignored.
  pullPolicy: Always  # Fetch updates of a moving tag; use IfNotPresent with a digest.

imagePullSecrets: []  # Secrets for private registries; the public image needs none.
nameOverride: ""  # Replaces the chart name in resource names.
fullnameOverride: ""  # Replaces the full release and chart name in resource names.

serviceAccount:  # Kubernetes service account of the pods.
  create: true  # Create a dedicated service account without API access.
  annotations: {}  # Annotations, for example for cloud IAM roles.
  name: ""  # Name; empty means a name derived from the release.

podAnnotations: {}  # Extra annotations on every pod.
podLabels: {}  # Extra labels on every pod.

podSecurityContext:  # Pod-level security settings.
  runAsNonRoot: true  # Refuse to start as root.
  runAsUser: 1000  # UID of the unbihexium user of the image.
  runAsGroup: 1000  # GID of the unbihexium group of the image.
  fsGroup: 1000  # Group ownership of the mounted volumes.
  seccompProfile:  # System call filter.
    type: RuntimeDefault  # Default profile of the container runtime.

securityContext:  # Container-level security settings.
  allowPrivilegeEscalation: false  # Block setuid binaries.
  readOnlyRootFilesystem: true  # Only the cache and /tmp volumes are writable.
  capabilities:  # Linux capabilities.
    drop:  # Removed capabilities.
      - ALL  # The API needs none.

server:  # Settings of `unbihexium serve`.
  port: 8000  # Container port of the REST API.
  proxyHeaders: true  # Trust X-Forwarded-* headers from the ingress controller.
  logLevel: INFO  # UNBIHEXIUM_LOG_LEVEL: DEBUG, INFO, WARNING, ERROR or CRITICAL.
  apiKey:  # API key required in the X-API-Key header.
    value: ""  # Key stored in a Secret created by the chart; empty disables it.
    existingSecret: ""  # Name of an existing Secret with the key; wins over value.
    secretKey: api-key  # Key of the entry in the Secret.
  rateLimitPerMinute: 0  # Requests per minute and client; 0 disables the limit.
  corsOrigins: []  # Allowed CORS origins; empty keeps the default of every origin.
  maxRequestBytes: 10485760  # Largest accepted request body in bytes.
  modelCacheSize: 4  # Models kept loaded in memory per pod.
  extraEnv: []  # Further environment variables of the container.

cache:  # Local model store (UNBIHEXIUM_CACHE).
  mountPath: /cache  # Mount path in the container.
  sizeLimit: 2Gi  # Size limit of the emptyDir volume.
  persistentVolumeClaim: ""  # Existing ReadWriteMany claim to share the store; empty uses emptyDir.

tmp:  # Writable /tmp for Python, GDAL and PyTorch.
  sizeLimit: 512Mi  # Size limit of the emptyDir volume.

service:  # Service in front of the pods.
  type: ClusterIP  # Reachable inside the cluster.
  port: 80  # Port of the service.

ingress:  # External HTTP access.
  enabled: false  # Create an Ingress; needs at least one host below.
  className: ""  # Ingress class of the controller, for example nginx.
  annotations: {}  # Controller and certificate settings.
  hosts: []  # Host names routed to the API, for example [api.example.org].
  tls: []  # TLS sections: [{secretName: ..., hosts: [...]}].

resources:  # Compute resources per pod.
  requests:  # Resources reserved for scheduling.
    cpu: 500m  # Half a core.
    memory: 1Gi  # PyTorch, ONNX Runtime and one small model.
  limits:  # Upper bounds enforced by the kubelet.
    memory: 3Gi  # Room for several loaded models.

probes:  # Health checks against GET /health.
  startup:  # Allows time for the first import of PyTorch.
    periodSeconds: 5  # Check every five seconds.
    failureThreshold: 24  # Up to two minutes for the start.
  readiness:  # Traffic only to pods that answer.
    periodSeconds: 10  # Check every ten seconds.
  liveness:  # Restart pods that stop answering.
    periodSeconds: 20  # Check every twenty seconds.
    timeoutSeconds: 5  # A slow answer counts as a failure.
    failureThreshold: 3  # Restart after three failures in a row.

autoscaling:  # Horizontal pod autoscaler; needs the Kubernetes metrics server.
  enabled: true  # Scale the number of pods with the CPU load.
  minReplicas: 2  # Keep two pods for availability.
  maxReplicas: 5  # Upper bound of the scaling.
  targetCPUUtilizationPercentage: 70  # Add pods above 70 percent of the CPU request.

podDisruptionBudget:  # Limit on voluntary evictions.
  enabled: true  # Create the budget.
  minAvailable: 1  # Keep at least one pod during drains and upgrades.

nodeSelector: {}  # Node labels that pods require.
tolerations: []  # Taints that pods tolerate.
affinity: {}  # Pod affinity and anti-affinity rules.

