# Abstract
# --------
# Default configuration of the Helm chart described in Chart.yaml. The keys
# follow the layout generated by `helm create`, so that the usual template
# names apply. Override single values with `--set key=value` or a whole file
# with `-f my-values.yaml`. The chart directory contains no templates/
# directory yet, so these values only take effect once templates that read
# them are added; deploy/kubernetes/deployment.yaml holds the equivalent
# plain manifests.
# =============================================================================

replicaCount: 3  # Pods when autoscaling is disabled.

image:  # Container image of the REST API.
  repository: ghcr.io/unbihexium-oss/unbihexium  # Image published by the Docker workflow.
  pullPolicy: IfNotPresent  # Pull only when the tag is not on the node.
  tag: "latest"  # Image tag; pin a release tag in production.

imagePullSecrets: []  # Secrets for private registries; the public image needs none.
nameOverride: ""  # Replaces the chart name in resource names.
fullnameOverride: ""  # Replaces the full release and chart name in resource names.

serviceAccount:  # Kubernetes service account of the pods.
  create: true  # Create a dedicated service account.
  annotations: {}  # Annotations, for example for cloud IAM roles.
  name: ""  # Name; empty means a name derived from the release.

podAnnotations: {}  # Extra annotations on every pod.

podSecurityContext: {}  # Pod-level security settings such as fsGroup.

securityContext: {}  # Container-level security settings such as runAsNonRoot.

service:  # Service in front of the pods.
  type: ClusterIP  # Reachable inside the cluster; the ingress exposes it.
  port: 80  # Port of the service.
  targetPort: 8000  # Port of uvicorn in the container.

ingress:  # External HTTP access.
  enabled: true  # Create an Ingress resource.
  className: nginx  # Ingress controller that handles it.
  annotations:  # Controller and certificate settings.
    cert-manager.io/cluster-issuer: letsencrypt-prod  # Obtain the TLS certificate from Let's Encrypt.
  hosts:  # Host names routed to the service.
    - host: api.unbihexium.org  # Public host name of the API.
      paths:  # URL paths routed to the service.
        - path: /  # Every path.
          pathType: Prefix  # Match the path and everything below it.
  tls:  # TLS termination at the ingress.
    - secretName: unbihexium-tls  # Secret that cert-manager fills with the certificate.
      hosts:  # Host names covered by the certificate.
        - api.unbihexium.org  # Public host name of the API.

resources:  # Compute resources per pod.
  limits:  # Upper bounds enforced by the kubelet.
    cpu: 1000m  # One CPU core.
    memory: 2Gi  # Room for several loaded models.
  requests:  # Resources reserved for scheduling.
    cpu: 250m  # A quarter of a core when idle.
    memory: 512Mi  # Runtime and one small model.

autoscaling:  # Horizontal pod autoscaler.
  enabled: true  # Scale the number of pods with the load.
  minReplicas: 2  # Keep two pods for availability.
  maxReplicas: 10  # Upper bound of the scaling.
  targetCPUUtilizationPercentage: 70  # Add pods above 70 percent CPU use.
  targetMemoryUtilizationPercentage: 80  # Add pods above 80 percent memory use.

nodeSelector: {}  # Node labels that pods require, for example GPU nodes.

tolerations: []  # Taints that pods tolerate.

affinity: {}  # Pod affinity and anti-affinity rules.

persistence:  # Persistent volume for the model cache.
  enabled: true  # Keep downloaded models across pod restarts.
  storageClass: standard  # Storage class of the volume claim.
  accessMode: ReadWriteOnce  # Mounted read-write by one node.
  size: 10Gi  # Capacity for the model cache.

config:  # Application settings passed to the container.
  logLevel: INFO  # Log level of the package.
  cacheDir: /data/cache  # Mount path of the model cache volume.
  workers: 4  # Number of uvicorn worker processes.

