# Abstract
# --------
# This file follows the REUSE specification 3.3
# (https://reuse.software/spec-3.3/) and its REUSE.toml format
# (https://reuse.software/spec-3.3/#reusetoml). It tells humans and tools
# such as `reuse`, ScanCode and SPDX SBOM generators who holds the copyright
# of each file and under which licence it is distributed.
#
# How licensing information is recorded
# -------------------------------------
# 1. Source files (Python, shell) carry the MPL-2.0 Exhibit A notice in a
#    comment header. .github/scripts/check_license_headers.py enforces this
#    in CI (License Compliance workflow) and in pre-commit.
# 2. Every other file, including those that cannot hold a comment (JSON,
#    images, ONNX and PyTorch model weights, lock files),
#    is covered by the annotation below.
# 3. The licence text is kept once, in LICENSE.txt at the repository root.
#    REUSE expects it at LICENSES/MPL-2.0.txt, so `make licence`,
#    `tox -e licence`, the pre-commit hook and the License Compliance
#    workflow copy LICENSE.txt there before they run `reuse lint`. The copy
#    is listed in .gitignore and is never committed.
#
# Checking compliance
# -------------------
#   make licence          # copies the licence text, runs reuse lint and
#                         # the MPL-2.0 header check
#   tox -e licence        # the same in an isolated environment
#   reuse spdx            # prints an SPDX document for the whole repository
#
# Precedence
# ----------
# "aggregate" combines the annotation below with any SPDX tags found in a
# file. Files with their own SPDX-FileCopyrightText or
# SPDX-License-Identifier tags (for example code adapted from a third
# party) therefore keep that information, and the project copyright is
# added to it. A third-party file that must not carry the project copyright
# needs its own [[annotations]] entry with precedence = "override", placed
# after the entry below, and its licence text as LICENSES/<SPDX-ID>.txt.
#
# Adding files
# ------------
# New files written for Unbihexium need no change here. Before adding a
# file that was not written for Unbihexium (vendored code, data, model
# weights or images), record its origin, copyright holder and SPDX licence
# identifier in a new annotation, and make sure the licence is on the allow
# list in .github/dependency-review-config.yml.
# =============================================================================

# Version of the REUSE.toml format.
version = 1

# Package information used in SPDX documents generated by `reuse spdx`.
SPDX-PackageName = "unbihexium"  # Name of the package in the SPDX document.
SPDX-PackageSupplier = "Unbihexium OSS Foundation <yunus.z.imanov@helsinki.fi>"  # Organisation that distributes the package.
SPDX-PackageDownloadLocation = "https://github.com/unbihexium-oss/unbihexium"  # Where the sources can be obtained.
# One-sentence description of the package.
SPDX-PackageComment = "Earth observation, geospatial, remote sensing and SAR library for Python, with a command line interface, a REST service and a model zoo."

# -----------------------------------------------------------------------------
# All files: the library, tests, scripts, documentation, the model
# zoo (untrained starter weights built by the project, configurations,
# manifests and model cards), deployment manifests and repository
# configuration.
# -----------------------------------------------------------------------------
[[annotations]]
path = "**"  # Match every file in the repository.
precedence = "aggregate"  # Combine with SPDX tags found in the file itself.
SPDX-FileCopyrightText = "2025 Unbihexium OSS Foundation and contributors"  # Copyright holder.
SPDX-License-Identifier = "MPL-2.0"  # Licence of every matched file.

