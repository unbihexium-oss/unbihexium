# Abstract
# --------
# Hooks for pre-commit (https://pre-commit.com/). They mirror the checks in
# .github/workflows/, so a commit that passes them locally passes the
# corresponding CI jobs. Hook versions reviewed in September 2026.
#
# Setup (once per clone):
#   python -m pip install pre-commit
#   pre-commit install
#
# The hooks then run on the staged files at every commit. To run them on the
# whole repository, as CI does:
#   pre-commit run --all-files
#
# Update the pinned hook versions:
#   pre-commit autoupdate
# =============================================================================

minimum_pre_commit_version: "4.3.0"  # Oldest pre-commit that understands this file.
default_install_hook_types: [pre-commit]  # `pre-commit install` sets up the commit hook only.
default_stages: [pre-commit]  # Hooks run at commit time unless a hook says otherwise.

# Model zoo files generated by `python -m unbihexium.zoo.sync`, licence texts
# and generated lock files are not modified by any hook. Regenerate them with
# their generators instead. The value is a verbose regular expression.
exclude: |
  (?x)^(
    model_zoo/manifests/.*|
    model_zoo/checksums\.txt|
    src/unbihexium/zoo/digests\.json|
    LICENSE\.txt|
    requirements(-dev)?\.txt
  )$

repos:  # Hook repositories, each pinned to a released version.
  # ---------------------------------------------------------------------------
  # Generic file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # Pinned release of the hook repository.
    hooks:  # Hooks used from this repository.
      - id: trailing-whitespace  # Remove spaces at the end of lines.
        args: [--markdown-linebreak-ext=md]  # Keep two-space hard line breaks in Markdown.
      - id: end-of-file-fixer  # End every file with exactly one newline.
      - id: mixed-line-ending  # Normalise line endings.
        args: [--fix=lf]  # Convert to Unix line endings.
      # Kubernetes manifests hold several documents per file. Helm templates
      # are Go templates, not YAML, until they are rendered.
      - id: check-yaml
        args: [--allow-multiple-documents]  # Accept "---" separated documents.
        exclude: ^deploy/helm/.*/templates/  # Skip unrendered Helm templates.
      - id: check-toml  # Parse every TOML file.
      - id: check-json  # Parse every JSON file.
      - id: check-merge-conflict  # Reject leftover merge conflict markers.
      - id: check-case-conflict  # Reject names that clash on case-insensitive file systems.
      - id: check-symlinks  # Reject symbolic links that point nowhere.
      - id: check-executables-have-shebangs  # Executable files must start with "#!".
      - id: check-added-large-files  # Keep large binaries out of Git.
        args: [--maxkb=500]  # Largest file accepted, in kilobytes.
      - id: detect-private-key  # Reject committed private keys.
      - id: debug-statements  # Reject leftover breakpoint() and pdb imports.

  # ---------------------------------------------------------------------------
  # Python: lint and format with ruff (settings in pyproject.toml)
  # ---------------------------------------------------------------------------
  # Scoped to the package and its tests, as in the CI lint job. Example
  # notebooks and code blocks in Markdown are illustrative and keep their
  # hand-written layout.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8  # Pinned ruff release; keep in step with pyproject.toml.
    hooks:  # Hooks used from this repository.
      - id: ruff-check  # Lint with the rules selected in pyproject.toml.
        args: [--fix]  # Apply safe automatic fixes.
        files: ^(src|tests)/  # Only the package and the tests.
        types_or: [python, pyi]  # Python sources and type stubs.
      - id: ruff-format  # Format the code.
        files: ^(src|tests)/  # Only the package and the tests.
        types_or: [python, pyi]  # Python sources and type stubs.

  # ---------------------------------------------------------------------------
  # Python: security linting with bandit (settings in pyproject.toml)
  # ---------------------------------------------------------------------------
  # The hook blocks on high severity findings. The Security workflow and
  # `make security` report every severity level.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4  # Pinned bandit release.
    hooks:  # Hooks used from this repository.
      - id: bandit  # Static security analysis of the package.
        args: ["-c", "pyproject.toml", "-r", "src/", "--severity-level", "high"]  # Scan src/ and fail on high severity only.
        additional_dependencies: ["bandit[toml]"]  # Needed to read the settings from pyproject.toml.
        pass_filenames: false  # Scan the whole package, not only the staged files.

  # ---------------------------------------------------------------------------
  # YAML, Markdown and GitHub Actions
  # ---------------------------------------------------------------------------
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0  # Pinned yamllint release.
    hooks:  # Hooks used from this repository.
      - id: yamllint  # Lint YAML files.
        args: [--strict, --config-file, .yamllint.yml]  # Warnings fail too; rules from .yamllint.yml.

  # Markdown style.
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1  # Pinned markdownlint-cli release.
    hooks:  # Hooks used from this repository.
      - id: markdownlint  # Lint Markdown files.
        args: [--config, .markdownlint.yaml]  # Rules from .markdownlint.yaml.

  # GitHub Actions workflow syntax and embedded shell.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12  # Pinned actionlint release.
    hooks:  # Hooks used from this repository.
      - id: actionlint  # Lint the workflows in .github/workflows/.

  # JSON Schema validation of well-known configuration files.
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.1  # Pinned check-jsonschema release.
    hooks:  # Hooks used from this repository.
      - id: check-github-workflows  # Workflows against the GitHub Actions schema.
      - id: check-dependabot  # .github/dependabot.yml against its schema.
      - id: check-compose-spec  # docker-compose.yml against the Compose specification.

  # ---------------------------------------------------------------------------
  # Licensing: REUSE compliance (REUSE.toml)
  # ---------------------------------------------------------------------------
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0  # Pinned reuse release.
    hooks:  # Hooks used from this repository.
      # REUSE expects the licence text in LICENSES/; the repository keeps it
      # only in LICENSE.txt, so the hook lints against a git-ignored copy.
      - id: reuse-lint-file
        entry: >-  # Copy the licence into LICENSES/, then run reuse on the staged files.
          sh -c 'mkdir -p LICENSES && cp LICENSE.txt LICENSES/MPL-2.0.txt &&
          reuse "$@"' --

  # ---------------------------------------------------------------------------
  # Repository policies (.github/scripts/)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:  # Hooks defined in this repository.
      - id: text-policy  # English only, no emojis, no em dashes.
        name: text policy (English only, no emojis, no em dashes)  # Name shown in the hook output.
        entry: python .github/scripts/check_text_policy.py  # Command that runs the check.
        language: system  # Use the Python already on the PATH.
        pass_filenames: false  # The script lists the tracked files itself.
        always_run: true  # Run even when no matching file is staged.
      - id: license-headers  # MPL-2.0 notice at the top of source files.
        name: MPL-2.0 notice in source files  # Name shown in the hook output.
        entry: python .github/scripts/check_license_headers.py  # Command that runs the check.
        language: system  # Use the Python already on the PATH.
        pass_filenames: false  # The script lists the tracked files itself.
        types_or: [python, shell]  # Run when a Python or shell file is staged.
      - id: python-style  # Header, footer and comment coverage of Python files.
        name: Python documentation style (header, footer, comments)  # Name shown in the hook output.
        entry: python .github/scripts/check_python_style.py  # Command that runs the check.
        language: system  # Use the Python already on the PATH.
        pass_filenames: false  # The script lists the tracked files itself.
        types: [python]  # Run when a Python file is staged.
      - id: config-style  # Header, footer and comment coverage of the other text files.
        name: Configuration file documentation style (header, footer, comments)  # Name shown in the hook output.
        entry: python .github/scripts/check_config_style.py  # Command that runs the check.
        language: system  # Use the Python already on the PATH.
        pass_filenames: false  # The script lists the tracked files itself.
        exclude_types: [python, markdown, jupyter, json]  # Formats with their own rules or without comments.

# Settings for the pre-commit.ci service, if it is enabled for the repository.
ci:
  autoupdate_schedule: monthly  # Propose hook version updates once a month.
  autoupdate_commit_msg: "chore(pre-commit): update hook versions"  # Conventional Commits message for updates.
  autofix_commit_msg: "style: apply pre-commit fixes"  # Conventional Commits message for fixes.
  skip: [text-policy, license-headers, python-style, config-style, actionlint]  # Left to the GitHub Actions workflows, which run them.

