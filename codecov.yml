#
# Abstract
# --------
# Coverage is measured by pytest-cov in .github/workflows/coverage.yml and
# uploaded to Codecov with the flag `unittests`. Measurement settings
# (source, branch coverage, excluded lines) live in [tool.coverage.*] in
# pyproject.toml; this file controls only how Codecov reports the results.
#
# Reference:  https://docs.codecov.com/docs/codecovyml-reference
# Validation: check-jsonschema --builtin-schema vendor.codecov codecov.yml
#             (run by the Repository Config workflow), or
#             curl --data-binary @codecov.yml https://codecov.io/validate
#
# Policy
# ------
# Coverage statuses are informational: they are shown on every pull request
# but never block a merge. Reviewers use the patch coverage and the
# per-component breakdown to decide whether new code needs more tests.
# The targets below record the direction of travel, not a gate.
# =============================================================================

codecov:  # Behaviour of the Codecov service.
  # Wait for the other CI checks to pass before sending statuses and
  # comments, so that a failed test run does not report partial coverage as
  # the final result.
  require_ci_to_pass: true
  notify:  # When Codecov sends its results.
    # One upload per commit, from the Coverage workflow.
    after_n_builds: 1
    wait_for_ci: true  # Hold notifications until the CI run has finished.

coverage:  # How coverage is shown and judged.
  # Two decimal places, rounded down, so that a report never overstates
  # coverage.
  precision: 2
  round: down  # Round towards lower coverage.
  # Colour scale on the Codecov dashboard: red below 60 %, green above 90 %.
  range: "60...90"

  status:  # Commit statuses posted to GitHub.
    # Coverage of the whole project compared with the base commit.
    project:
      default:  # Single status for the whole project.
        target: auto  # Compare with the coverage of the base commit.
        threshold: 1%  # Allow a drop of up to one percentage point.
        informational: true  # Report only; never fail the status.
        only_pulls: false  # Also report on pushes to branches.
    # Coverage of the lines changed by a pull request.
    patch:
      default:  # Single status for the changed lines.
        target: 80%  # Aim for four in five changed lines covered.
        informational: true  # Report only; never fail the status.
        only_pulls: true  # Patch coverage only makes sense for pull requests.
    # The "changes" status (coverage changes not explained by the diff) is
    # left at its default, disabled.

# -----------------------------------------------------------------------------
# Flags: one per kind of upload
# -----------------------------------------------------------------------------
flags:
  unittests:  # Flag set by the Coverage workflow upload.
    paths:  # Files that this flag covers.
      - src/unbihexium/  # The installed package only.
    # Keep the last known coverage for this flag when a commit has no upload,
    # for example a documentation-only change.
    carryforward: true

# -----------------------------------------------------------------------------
# Components: coverage per subpackage in the pull request comment and on
# the dashboard
# -----------------------------------------------------------------------------
component_management:
  default_rules:  # Settings shared by every component.
    statuses:  # Statuses posted for each component.
      - type: project  # Whole-component coverage against the base commit.
        target: auto  # Compare with the coverage of the base commit.
        informational: true  # Report only; never fail the status.
  individual_components:  # One entry per group of subpackages.
    # Core types, configuration, registry and top-level modules.
    - component_id: core
      name: Core, configuration and registry  # Name shown in reports.
      paths:  # Files in this component.
        - src/unbihexium/core/**  # Core data types.
        - src/unbihexium/config/**  # Configuration handling.
        - src/unbihexium/registry/**  # Capability and model registry.
        - src/unbihexium/utils/**  # Shared helpers.
        - src/unbihexium/*.py  # Top-level package modules.
    # Raster, vector and catalogue readers and writers.
    - component_id: io
      name: Input and output  # Name shown in reports.
      paths:  # Files in this component.
        - src/unbihexium/io/**  # Readers and writers.
    # Image processing before and after the models.
    - component_id: processing
      name: Preprocessing, indices and postprocessing  # Name shown in reports.
      paths:  # Files in this component.
        - src/unbihexium/preprocessing/**  # Input preparation.
        - src/unbihexium/indices/**  # Spectral indices.
        - src/unbihexium/postprocessing/**  # Output cleaning and vectorisation.
    # Analytical methods.
    - component_id: analysis
      name: Analysis, terrain and geostatistics  # Name shown in reports.
      paths:  # Files in this component.
        - src/unbihexium/analysis/**  # General analysis tools.
        - src/unbihexium/terrain/**  # Terrain analysis.
        - src/unbihexium/geostat/**  # Variograms and kriging.
        - src/unbihexium/metrics/**  # Evaluation metrics.
    # Radar processing.
    - component_id: sar
      name: Synthetic aperture radar  # Name shown in reports.
      paths:  # Files in this component.
        - src/unbihexium/sar/**  # SAR calibration, filtering and interferometry.
    # Machine learning models and their distribution.
    - component_id: ai
      name: AI models and model zoo  # Name shown in reports.
      paths:  # Files in this component.
        - src/unbihexium/ai/**  # Model architectures and inference.
        - src/unbihexium/zoo/**  # Model download and verification.
    # User-facing entry points.
    - component_id: interfaces
      name: CLI, REST service and visualisation  # Name shown in reports.
      paths:  # Files in this component.
        - src/unbihexium/cli/**  # Command line interface.
        - src/unbihexium/serving/**  # REST service.
        - src/unbihexium/visualization/**  # Plotting helpers.

# -----------------------------------------------------------------------------
# Pull request comment
# -----------------------------------------------------------------------------
comment:
  layout: "condensed_header, diff, flags, components, condensed_files, condensed_footer"  # Sections of the comment, in order.
  # Update the existing comment instead of posting a new one.
  behavior: default
  # Comment only when coverage changes.
  require_changes: true
  require_base: false  # Comment even when the base commit has no report.
  require_head: true  # Comment only when the pull request head has a report.
  hide_project_coverage: false  # Show project coverage next to patch coverage.

# Line annotations in the "Files changed" tab are disabled: the pull request
# comment and the dashboard already show uncovered lines.
github_checks:
  annotations: false  # No per-line annotations.

# -----------------------------------------------------------------------------
# Paths excluded from coverage reports
# -----------------------------------------------------------------------------
# Only the package under src/ is measured. Tests, examples, scripts,
# deployment files and repository automation are not library code.
ignore:
  - "tests/**"  # Test suite.
  - "examples/**"  # Example scripts.
  - "scripts/**"  # Maintenance scripts.
  - "docs/**"  # Documentation.
  - "deploy/**"  # Deployment manifests.
  - "model_zoo/**"  # Model files and metadata.
  - ".github/**"  # Repository automation.
  - "src/unbihexium/_version.py"  # Version constants only, no logic to test.

