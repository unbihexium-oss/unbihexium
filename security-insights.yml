# Abstract
# --------
# Machine-readable description of the security posture of this repository,
# following the OpenSSF Security Insights specification 2.2.0:
#   https://github.com/ossf/security-insights
#   https://github.com/ossf/security-insights/blob/v2.2.0/spec/schema.md
#
# Consumers such as the OpenSSF Scorecard, LFX Insights, CLOMonitor and
# package registries read this file to find the security contact, the
# vulnerability disclosure policy, the tools that scan the code, and how
# releases are built and attested.
#
# Maintenance
# -----------
# - Update `last-updated` whenever a value below changes, and
#   `last-reviewed` at least every six months even when nothing changes.
# - Add a tool below when a workflow starts running a new scanner, and
#   remove it when the workflow is deleted.
# - The Repository Config workflow validates this file against the CUE
#   schema of the specification:
#     git clone --depth 1 --branch v2.2.0 https://github.com/ossf/security-insights
#     cd security-insights
#     cue vet -c -d '#SecurityInsights' ./spec /path/to/security-insights.yml
# =============================================================================

header:  # Metadata about this file.
  schema-version: 2.2.0  # Version of the Security Insights specification used.
  last-updated: "2026-09-23"  # Date of the last change to any value.
  last-reviewed: "2026-09-23"  # Date of the last full review, at most six months ago.
  url: https://github.com/unbihexium-oss/unbihexium/blob/main/security-insights.yml  # Canonical location of this file.
  comment: |  # Scope of the security description.
    Security posture of the Unbihexium repository: the Python library, the
    command line interface, the REST service, the model zoo and the
    container image built from it.

# -----------------------------------------------------------------------------
# Project: people, documentation and vulnerability reporting
# -----------------------------------------------------------------------------
project:  # The project as a whole.
  name: Unbihexium  # Project name.
  funding: https://github.com/unbihexium-oss/unbihexium/blob/main/.github/FUNDING.yml  # How the project is funded.
  roadmap: https://github.com/unbihexium-oss/unbihexium/blob/main/ROADMAP.md  # Planned work.
  administrators:  # People with administrative rights on the project.
    - name: Olaf Yunus Laitinen Imanov  # Full name.
      affiliation: Unbihexium OSS Foundation  # Organisation the person acts for.
      email: yunus.z.imanov@helsinki.fi  # Contact address.
      social: https://github.com/olaflaitinen  # GitHub profile.
      primary: true  # Main contact for this role.
  documentation:  # Documents for users and contributors.
    quickstart-guide: https://github.com/unbihexium-oss/unbihexium/blob/main/docs/getting_started/quickstart.md  # First steps for new users.
    detailed-guide: https://github.com/unbihexium-oss/unbihexium/blob/main/docs/index.md  # Full documentation index.
    design: https://github.com/unbihexium-oss/unbihexium/blob/main/docs/architecture/overview.md  # Architecture overview.
    code-of-conduct: https://github.com/unbihexium-oss/unbihexium/blob/main/CODE_OF_CONDUCT.md  # Community rules.
    release-process: https://github.com/unbihexium-oss/unbihexium/blob/main/VERSIONING.md  # Versioning and release policy.
    support-policy: https://github.com/unbihexium-oss/unbihexium/blob/main/SUPPORT.md  # Support channels and supported versions.
    signature-verification: https://github.com/unbihexium-oss/unbihexium/blob/main/docs/security/supply_chain_security.md  # How to verify release signatures and provenance.
  repositories:  # Repositories that make up the project.
    - name: unbihexium  # Repository name.
      url: https://github.com/unbihexium-oss/unbihexium  # Repository location.
      comment: |  # What the repository contains.
        Library, command line interface, REST service, model zoo, container
        image definition, deployment manifests and documentation.
  vulnerability-reporting:  # How to report a vulnerability.
    reports-accepted: true  # Vulnerability reports are welcome.
    bug-bounty-available: false  # No paid bug bounty programme.
    contact:  # Person who receives vulnerability reports.
      name: Olaf Yunus Laitinen Imanov  # Full name.
      affiliation: Unbihexium OSS Foundation  # Organisation the person acts for.
      email: yunus.z.imanov@helsinki.fi  # Contact address.
      social: https://github.com/olaflaitinen  # GitHub profile.
      primary: true  # Main contact for this role.
    policy: https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md  # Disclosure policy.
    in-scope:  # Components covered by the policy.
      - Source code of the unbihexium Python package under src/  # Covered by the security policy.
      - Command line interface and REST service (unbihexium.serving)  # Covered by the security policy.
      - Model zoo weights, manifests and checksums under model_zoo/  # Covered by the security policy.
      - Container image built from the Dockerfile  # Covered by the security policy.
      - Deployment manifests under deploy/  # Covered by the security policy.
      - GitHub Actions workflows and release pipeline under .github/  # Covered by the security policy.
    out-of-scope:  # Reports that are not handled as vulnerabilities.
      - Vulnerabilities in third-party dependencies that are already publicly known; report them to the upstream project  # Not handled as a vulnerability.
      - Deployments operated by third parties  # Not handled as a vulnerability.
      - Findings that require an already compromised host or a malicious local administrator  # Not handled as a vulnerability.
      - Denial of service through intentionally oversized inputs without a practical amplification  # Not handled as a vulnerability.
    comment: |  # Reporting channel in words.
      Report vulnerabilities privately through GitHub private vulnerability
      reporting at
      https://github.com/unbihexium-oss/unbihexium/security/advisories/new,
      never in a public issue. Reports are handled under the coordinated
      disclosure process in SECURITY.md.

# -----------------------------------------------------------------------------
# Repository: status, licence, release process and security tooling
# -----------------------------------------------------------------------------
repository:  # This repository.
  url: https://github.com/unbihexium-oss/unbihexium  # Repository location.
  status: active  # Actively developed and maintained.
  bug-fixes-only: false  # New features are still accepted.
  accepts-change-request: true  # Pull requests from contributors are accepted.
  accepts-automated-change-request: true  # Pull requests from Dependabot and other bots are accepted.
  no-third-party-packages: false  # The package depends on third-party packages.
  core-team:  # Maintainers with write access.
    - name: Olaf Yunus Laitinen Imanov  # Full name.
      affiliation: Unbihexium OSS Foundation  # Organisation the person acts for.
      email: yunus.z.imanov@helsinki.fi  # Contact address.
      social: https://github.com/olaflaitinen  # GitHub profile.
      primary: true  # Main contact for this role.
  documentation:  # Policies that apply to this repository.
    contributing-guide: https://github.com/unbihexium-oss/unbihexium/blob/main/CONTRIBUTING.md  # How to contribute.
    review-policy: https://github.com/unbihexium-oss/unbihexium/blob/main/GOVERNANCE.md  # How changes are reviewed.
    security-policy: https://github.com/unbihexium-oss/unbihexium/blob/main/SECURITY.md  # Vulnerability handling.
    governance: https://github.com/unbihexium-oss/unbihexium/blob/main/GOVERNANCE.md  # Decision making and roles.
    dependency-management-policy: https://github.com/unbihexium-oss/unbihexium/blob/main/.github/dependency-review-config.yml  # Rules for new dependencies.
  license:  # Licence of the repository contents.
    url: https://github.com/unbihexium-oss/unbihexium/blob/main/LICENSE.txt  # Licence text.
    expression: MPL-2.0  # SPDX licence expression.

  # Releases are built by the Release workflow when a version tag is pushed,
  # uploaded to PyPI with trusted publishing, signed with Sigstore and
  # attested with GitHub artifact attestations (SLSA provenance and SBOM),
  # whose provenance and SBOM are attached to the release.
  release:  # How releases are produced.
    changelog: https://github.com/unbihexium-oss/unbihexium/blob/main/CHANGELOG.md  # Release history.
    automated-pipeline: true  # Releases are built by a workflow, not by hand.
    attestations:  # Signed statements about release artefacts.
      - name: GitHub build provenance  # Attestation name.
        predicate-uri: https://slsa.dev/provenance/v1  # In-toto predicate type of the attestation.
        location: https://github.com/unbihexium-oss/unbihexium/attestations  # Where the attestations are published.
        comment: |  # How the attestation is made and verified.
          Created by actions/attest-build-provenance in the Release
          workflow for every file in dist/. Verify with
          `gh attestation verify <file> --repo unbihexium-oss/unbihexium`.
      - name: SLSA provenance release asset  # Attestation name.
        predicate-uri: https://slsa.dev/provenance/v1  # In-toto predicate type of the attestation.
        location: https://github.com/unbihexium-oss/unbihexium/releases  # Where the attestations are published.
        comment: |  # How the attestation is made and verified.
          The DSSE envelope of the GitHub build provenance attestation,
          attached to each GitHub release as unbihexium-<tag>.intoto.jsonl
          next to the Sigstore bundles (.sigstore.json) of the
          distributions.
      - name: SBOM of the distributions  # Attestation name.
        predicate-uri: https://spdx.dev/Document/v2.3  # In-toto predicate type of the attestation.
        location: https://github.com/unbihexium-oss/unbihexium/attestations  # Where the attestations are published.
        comment: |  # How the attestation is made and verified.
          SPDX SBOM of the wheel installed with the locked runtime
          dependencies, attested by actions/attest-sbom for every file in
          dist/ and attached to the release as unbihexium-<tag>.spdx.json.
    distribution-points:  # Where released artefacts can be obtained.
      - uri: pkg:pypi/unbihexium  # Package URL or web address.
        comment: Python Package Index, uploaded by the Release workflow with trusted publishing and PEP 740 attestations  # What is published there.
      - uri: https://github.com/unbihexium-oss/unbihexium/releases  # Package URL or web address.
        comment: GitHub releases with SHA256SUMS.txt, Sigstore signatures, SLSA provenance and the SPDX SBOM  # What is published there.
      - uri: pkg:docker/ghcr.io/unbihexium-oss/unbihexium  # Package URL or web address.
        comment: Container image on the GitHub Container Registry, signed with cosign (keyless) and attested with SLSA provenance and an SPDX SBOM  # What is published there.
    license:  # Licence of the released artefacts.
      url: https://github.com/unbihexium-oss/unbihexium/blob/main/LICENSE.txt  # Licence text.
      expression: MPL-2.0  # SPDX licence expression.

  security:  # Security assessments, contacts and tooling.
    assessments:  # Security assessments of the project.
      self:  # Assessment by the maintainers.
        comment: |  # Status of the self-assessment.
          No formal security self-assessment has been published yet. The
          threat model and security controls are described in
          docs/architecture/security_model.md.
    champions:  # People who lead security work.
      - name: Olaf Yunus Laitinen Imanov  # Full name.
        affiliation: Unbihexium OSS Foundation  # Organisation the person acts for.
        email: yunus.z.imanov@helsinki.fi  # Contact address.
        social: https://github.com/olaflaitinen  # GitHub profile.
        primary: true  # Main contact for this role.

    # Every tool below runs in a workflow under .github/workflows/. `adhoc`
    # means the workflow can also be started by hand (workflow_dispatch) or
    # runs on a schedule; `release` means it gates the release pipeline.
    tools:  # Security tools run on this repository.
      - name: Dependabot  # Tool name.
        type: SCA  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Weekly version updates for pip and GitHub Actions, monthly for
          the Docker base image (.github/dependabot.yml), and security
          updates for known vulnerabilities.
        rulesets:  # Rule sets or configuration files used.
          - default  # Default rules of the tool.
        integration:  # When the tool runs.
          adhoc: false  # Not started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results: {}  # No results published.
      - name: Dependency Review  # Tool name.
        type: SCA  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Blocks pull requests that add dependencies with high or critical
          vulnerabilities or with licences denied by the project policy
          (Security workflow).
        rulesets:  # Rule sets or configuration files used.
          - .github/dependency-review-config.yml  # Configuration file of the tool.
        integration:  # When the tool runs.
          adhoc: false  # Not started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results: {}  # No results published.
      - name: pip-audit  # Tool name.
        type: SCA  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Checks the exact versions of requirements.txt and
          requirements-dev.txt against the PyPI advisory database; any known
          vulnerability fails the Security workflow (also `make security`).
        rulesets:  # Rule sets or configuration files used.
          - default  # Default rules of the tool.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results: {}  # No results published.
      - name: Bandit  # Tool name.
        type: SAST  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Static analysis of src/ for common Python security issues; any
          finding fails the Security workflow (also pre-commit and
          `make security`).
        rulesets:  # Rule sets or configuration files used.
          - pyproject.toml  # Configuration file of the tool.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results: {}  # No results published.
      - name: CodeQL  # Tool name.
        type: SAST  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          security-extended queries for Python and GitHub Actions on pull
          requests, pushes to main and weekly (CodeQL workflow); alerts
          appear in GitHub code scanning.
        rulesets:  # Rule sets or configuration files used.
          - security-extended  # CodeQL query suite.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results:  # Published results.
          ci:  # Results of the CI runs.
            name: CodeQL SARIF report  # Name of the result set.
            predicate-uri: https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html  # Format of the results, SARIF 2.1.0.
            location: https://github.com/unbihexium-oss/unbihexium/security/code-scanning  # Where the results can be seen.
            comment: Visible to repository maintainers in GitHub code scanning.  # Who can see the results.
      - name: atheris  # Tool name.
        type: fuzzing  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Coverage-guided fuzzing of the GeoJSON and STAC parsers from the
          seed corpora in fuzz/corpus/ (Fuzz workflow); a crash fails the job
          and its input is kept as a regression test.
        rulesets:  # Rule sets or configuration files used.
          - fuzz/  # Fuzz targets and seed corpora.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results: {}  # No results published.
      - name: TruffleHog  # Tool name.
        type: secret  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Scans pushed commits and pull requests for verified secrets
          (Secret Scan workflow).
        rulesets:  # Rule sets or configuration files used.
          - default  # Default rules of the tool.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results: {}  # No results published.
      - name: Grype  # Tool name.
        type: container  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Scans the container image for vulnerable packages and uploads the
          results to GitHub code scanning (Container Scan workflow).
        rulesets:  # Rule sets or configuration files used.
          - default  # Default rules of the tool.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results:  # Published results.
          ci:  # Results of the CI runs.
            name: Grype SARIF report  # Name of the result set.
            predicate-uri: https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html  # Format of the results, SARIF 2.1.0.
            location: https://github.com/unbihexium-oss/unbihexium/security/code-scanning  # Where the results can be seen.
            comment: Visible to repository maintainers in GitHub code scanning.  # Who can see the results.
      - name: actionlint  # Tool name.
        type: SAST  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Lints GitHub Actions workflows, including shellcheck of run steps
          and detection of untrusted input in scripts (Workflow Lint
          workflow, pre-commit).
        rulesets:  # Rule sets or configuration files used.
          - default  # Default rules of the tool.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results: {}  # No results published.
      - name: OpenSSF Scorecard  # Tool name.
        type: other  # Tool category in the specification.
        comment: |  # What the tool checks and where it runs.
          Weekly assessment of repository security practices (Scorecard
          workflow). Results are published to the OpenSSF Scorecard API and
          uploaded to GitHub code scanning.
        rulesets:  # Rule sets or configuration files used.
          - default  # Default rules of the tool.
        integration:  # When the tool runs.
          adhoc: true  # Also started by hand or on a schedule.
          ci: true  # Runs on pushes or pull requests.
          release: false  # Does not gate the release pipeline.
        results:  # Published results.
          ci:  # Results of the CI runs.
            name: OpenSSF Scorecard results  # Name of the result set.
            predicate-uri: https://docs.oasis-open.org/sarif/sarif/v2.1.0/sarif-v2.1.0.html  # Format of the results, SARIF 2.1.0.
            location: https://scorecard.dev/viewer/?uri=github.com/unbihexium-oss/unbihexium  # Where the results can be seen.
            comment: Public Scorecard report for the default branch.  # Who can see the results.

