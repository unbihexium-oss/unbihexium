# Abstract
# --------
# Single source of truth for the 130 model families of the Unbihexium model
# zoo. Every family is available in four size variants (tiny, base, large and
# mega), which gives 520 models. unbihexium.zoo.catalog loads this file;
# model_zoo/inventory.yaml, the manifests and the model cards are generated
# from it with `python -m unbihexium.zoo.sync`.
#
# The models are starter models ("semi-finished products"): each one has a
# complete, trainable architecture with the input and output layout of its
# task and deterministically initialised weights, but it has NOT been trained
# on Earth observation data. Train or fine-tune a model on labelled data for
# your area and sensor before you use its predictions (see
# docs/model_zoo/training.md and RESPONSIBLE_USE.md). The spectral index
# family is the exception: it computes a published formula and needs no
# training.
#
# Fields
# ------
#   id           model family identifier; variants append _tiny, _base, ...
#   name         human-readable name
#   task         detection | segmentation | change_detection |
#                dense_regression | scene_regression | enhancement |
#                super_resolution | spectral_index
#   domain       capability domain (unbihexium.registry.CapabilityDomain)
#   description  what the model does once it is trained
#   bands        input band set (see band_sets below) or an explicit list
#   dates        number of co-registered acquisitions stacked on the channel
#                axis (2 for change detection and stereo pairs)
#   outputs      class names (detection, segmentation, change detection),
#                target names (regression) or output bands (image to image)
#   units        units of regression targets, one per output
#   range        optional [min, max] of regression targets; [0, 1] targets
#                use a sigmoid output
#   scale        upscaling factor (super_resolution only)
#   formula      index formula identifier (spectral_index only)
#   labels       the reference data needed to train the model
#   sources      suitable input data
# =============================================================================

version: "2.0.0"  # Catalogue version, recorded in manifests and digests.

# Named input band sets. Band names follow the naming of the data provider.
band_sets:  # Named input band sets, referenced by the bands field.
  rgb: [red, green, blue]  # True colour imagery, 3 bands.
  rgbn: [blue, green, red, nir]  # Four-band multispectral imagery with near infrared, 4 bands.
  pan: [pan]  # Single panchromatic band, 1 band.
  pan_pair: [pan_t1, pan_t2]  # Panchromatic stereo pair, 2 bands.
  pan_triplet: [pan_forward, pan_nadir, pan_backward]  # Panchromatic along-track stereo triplet, 3 bands.
  s2_10: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]  # Sentinel-2 bands at 10 m and 20 m, resampled to 10 m, 10 bands.
  s2_13: [B01, B02, B03, B04, B05, B06, B07, B08, B8A, B09, B10, B11, B12]  # All thirteen Sentinel-2 bands, 13 bands.
  s2_swir: [B12, B8A, B04]  # Sentinel-2 false colour composite for burn scars, 3 bands.
  s1: [VV, VH]  # Sentinel-1 dual polarisation backscatter, 2 bands.
  s1_vv: [VV]  # Sentinel-1 VV backscatter, 1 band.
  s2_s1: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12, VV, VH]  # Sentinel-2 bands fused with Sentinel-1 backscatter, 12 bands.
  landsat_st: [SR_B2, SR_B3, SR_B4, SR_B5, SR_B6, SR_B7, ST_B10]  # Landsat 8 and 9 surface reflectance and surface temperature, 7 bands.
  dem: [elevation]  # Digital elevation model, 1 band.
  dsm: [surface_height]  # Digital surface model, 1 band.
  rgb_dsm: [red, green, blue, surface_height]  # True colour imagery with a surface model, 4 bands.
  rgbn_dem: [blue, green, red, nir, elevation]  # Four-band multispectral imagery with elevation, 5 bands.
  s2_dem: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12, elevation, slope]  # Sentinel-2 bands with elevation and slope, 12 bands.
  insar: [cos_phase, sin_phase, coherence]  # Interferometric phase as cosine and sine, and coherence, 3 bands.
  insar_stack: [los_t1, los_t2, los_t3, los_t4, los_t5, los_t6]  # Line-of-sight displacement at six dates, 6 bands.
  ms_pan: [ms_blue, ms_green, ms_red, ms_nir, pan]  # Multispectral bands with the panchromatic band, 5 bands.
  image_dem: [red, green, blue, elevation]  # True colour imagery with elevation, 4 bands.
  ndvi_stats: [ndvi, ndvi_min, ndvi_max]  # NDVI with its multi-year per-pixel minimum and maximum, 3 bands.
  context: [B02, B03, B04, B08, B11, B12, elevation, slope, population, road_distance]  # Sentinel-2 bands with terrain, population and road distance, 10 bands.

models:  # The model families, grouped by task.
  # ---------------------------------------------------------------------------
  # Object detection (19). Anchor-free CenterNet detector: class heatmaps,
  # box sizes and centre offsets at a quarter of the input resolution.
  # Labels: axis-aligned bounding boxes in pixel coordinates.
  # ---------------------------------------------------------------------------
  - id: aircraft_detector  # Models aircraft_detector_tiny, _base, _large and _mega.
    name: Aircraft Detector  # Display name.
    task: detection  # Anchor-free CenterNet detector.
    domain: ai  # Capability domain in the registry.
    description: Detects aircraft on aprons, runways and in flight in very high resolution optical imagery.  # What the model does once trained.
    bands: rgb  # Band set rgb, 3 inputs.
    outputs: [aircraft]  # 1 output channel.
    labels: Bounding boxes of aircraft.  # Reference data needed for training.
    sources: [Very high resolution satellite or aerial RGB imagery, 0.3 to 1 m]  # Suitable input data.

  - id: border_monitor  # Models border_monitor_tiny, _base, _large and _mega.
    name: Border Area Monitor  # Display name.
    task: detection  # Anchor-free CenterNet detector.
    domain: defense  # Capability domain in the registry.
    description: Detects vehicles, vessels and new structures along borders and coastlines for situational awareness.  # What the model does once trained.
    bands: rgb  # Band set rgb, 3 inputs.
    outputs: [vehicle, vessel, structure]  # 3 output channels.
    labels: Bounding boxes of vehicles, vessels and structures.  # Reference data needed for training.
    sources: [Very high resolution satellite or aerial RGB imagery, 0.3 to 1 m]  # Suitable input data.

