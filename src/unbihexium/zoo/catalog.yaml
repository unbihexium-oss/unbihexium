  - id: wildlife_habitat_analyzer
    name: Wildlife Habitat Suitability
    task: dense_regression
    domain: environment
    description: Scores habitat suitability for a target species.
    bands: s2_dem
    outputs: [habitat_suitability]
    units: ["1"]
    range: [0, 1]
    labels: Species occurrence data converted to suitability targets.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: wind_site_selector
    name: Wind Site Selector
    task: dense_regression
    domain: energy
    description: Scores suitability for wind turbines.
    bands: s2_dem
    outputs: [suitability]
    units: ["1"]
    range: [0, 1]
    labels: Suitability scores or existing turbine locations.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: flood_risk_assessor
    name: Flood Depth Estimator
    task: dense_regression
    domain: water
    description: Estimates flood water depth.
    bands: s2_dem
    outputs: [water_depth]
