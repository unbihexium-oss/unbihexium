# =============================================================================
# Unbihexium model zoo catalogue
# =============================================================================
#
# Single source of truth for the 130 model families of the Unbihexium model
# zoo. Every family is available in four size variants (tiny, base, large and
# mega), which gives 520 models. unbihexium.zoo.catalog loads this file;
# model_zoo/inventory.yaml, the manifests and the model cards are generated
# from it with `python -m unbihexium.zoo.sync`.
#
# The models are starter models ("semi-finished products"): each one has a
# complete, trainable architecture with the input and output layout of its
# task and deterministically initialised weights, but it has NOT been trained
# on Earth observation data. Train or fine-tune a model on labelled data for
# your area and sensor before you use its predictions (see
# docs/model_zoo/training.md and RESPONSIBLE_USE.md). The spectral index
# family is the exception: it computes a published formula and needs no
# training.
#
# Fields
# ------
#   id           model family identifier; variants append _tiny, _base, ...
#   name         human-readable name
#   task         detection | segmentation | change_detection |
#                dense_regression | scene_regression | enhancement |
#                super_resolution | spectral_index
#   domain       capability domain (unbihexium.registry.CapabilityDomain)
#   description  what the model does once it is trained
#   bands        input band set (see band_sets below) or an explicit list
#   dates        number of co-registered acquisitions stacked on the channel
#                axis (2 for change detection and stereo pairs)
#   outputs      class names (detection, segmentation, change detection),
#                target names (regression) or output bands (image to image)
#   units        units of regression targets, one per output
#   range        optional [min, max] of regression targets; [0, 1] targets
#                use a sigmoid output
#   scale        upscaling factor (super_resolution only)
#   formula      index formula identifier (spectral_index only)
#   labels       the reference data needed to train the model
#   sources      suitable input data
# =============================================================================

version: "2.0.0"

# Named input band sets. Band names follow the naming of the data provider.
band_sets:
  rgb: [red, green, blue]
  rgbn: [blue, green, red, nir]
  pan: [pan]
  pan_pair: [pan_t1, pan_t2]
  pan_triplet: [pan_forward, pan_nadir, pan_backward]
  s2_10: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
  s2_13: [B01, B02, B03, B04, B05, B06, B07, B08, B8A, B09, B10, B11, B12]
  s2_swir: [B12, B8A, B04]
  s1: [VV, VH]
  s1_vv: [VV]
  s2_s1: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12, VV, VH]
  landsat_st: [SR_B2, SR_B3, SR_B4, SR_B5, SR_B6, SR_B7, ST_B10]
  dem: [elevation]
  dsm: [surface_height]
  rgb_dsm: [red, green, blue, surface_height]
  rgbn_dem: [blue, green, red, nir, elevation]
  s2_dem: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12, elevation, slope]
  insar: [cos_phase, sin_phase, coherence]
  insar_stack: [los_t1, los_t2, los_t3, los_t4, los_t5, los_t6]
  ms_pan: [ms_blue, ms_green, ms_red, ms_nir, pan]
  image_dem: [red, green, blue, elevation]
  ndvi_stats: [ndvi, ndvi_min, ndvi_max]
  context: [B02, B03, B04, B08, B11, B12, elevation, slope, population, road_distance]

models:
  # ---------------------------------------------------------------------------
  # Object detection (19). Anchor-free CenterNet detector: class heatmaps,
  # box sizes and centre offsets at a quarter of the input resolution.
  # Labels: axis-aligned bounding boxes in pixel coordinates.
  # ---------------------------------------------------------------------------
  - id: aircraft_detector
    name: Aircraft Detector
    task: detection
    domain: ai
    description: Detects aircraft on aprons, runways and in flight in very high resolution optical imagery.
    bands: rgb
    outputs: [aircraft]
    labels: Bounding boxes of aircraft.
    sources: [Very high resolution satellite or aerial RGB imagery, 0.3 to 1 m]

  - id: border_monitor
    name: Border Area Monitor
    task: detection
    domain: defense
    description: Detects vehicles, vessels and new structures along borders and coastlines for situational awareness.
    bands: rgb
    outputs: [vehicle, vessel, structure]
    labels: Bounding boxes of vehicles, vessels and structures.
    sources: [Very high resolution satellite or aerial RGB imagery, 0.3 to 1 m]

  - id: building_detector
    name: Building Detector
    task: detection
    domain: urban
    description: Detects individual buildings as bounding boxes.
    bands: rgb
    outputs: [building]
    labels: Bounding boxes of building footprints.
    sources: [Very high resolution satellite or aerial RGB imagery, 0.3 to 1 m]

  - id: builtup_detector
    name: Built-up Area Detector
    task: detection
    domain: urban
    description: Detects compact built-up areas such as settlements and industrial sites in multispectral imagery.
    bands: rgbn
    outputs: [built_up_area]
    labels: Bounding boxes of built-up areas.
    sources: [PlanetScope, SPOT, Sentinel-2 10 m bands]

  - id: crop_detector
    name: Crop Parcel Detector
    task: detection
    domain: agriculture
    description: Detects cultivated parcels and orchards as bounding boxes.
    bands: rgbn
    outputs: [crop_parcel, orchard]
    labels: Bounding boxes of crop parcels and orchards.
    sources: [PlanetScope, SPOT, aerial RGBN imagery]

  - id: damage_assessor
    name: Building Damage Assessor
    task: detection
    domain: risk
    description: Detects damaged and destroyed buildings in post-event imagery for rapid damage assessment.
    bands: rgb
    outputs: [damaged_building, destroyed_building]
    labels: Bounding boxes of buildings graded as damaged or destroyed.
    sources: [Very high resolution post-event satellite or aerial RGB imagery]

  - id: encroachment_detector
    name: Encroachment Detector
    task: detection
    domain: assets
    description: Detects structures and vehicles inside protected corridors such as pipeline and power line rights of way.
    bands: rgb
    outputs: [structure, vehicle, excavation]
    labels: Bounding boxes of structures, vehicles and excavations.
    sources: [Very high resolution satellite or aerial RGB imagery]

  - id: fire_monitor
    name: Active Fire Detector
    task: detection
    domain: environment
    description: Detects active fire fronts and hotspots in short-wave infrared composites.
    bands: s2_swir
    outputs: [active_fire]
    labels: Bounding boxes of active fire areas.
    sources: [Sentinel-2 L1C or L2A, Landsat 8/9]

  - id: greenhouse_detector
    name: Greenhouse Detector
    task: detection
    domain: agriculture
    description: Detects greenhouses and plastic-covered crops.
    bands: rgb
    outputs: [greenhouse]
    labels: Bounding boxes of greenhouses.
    sources: [Very high resolution satellite or aerial RGB imagery]

  - id: leakage_detector
    name: Leakage Detector
    task: detection
    domain: assets
    description: Detects vegetation stress and surface anomalies that indicate pipeline or canal leakage.
    bands: [blue, green, red, nir, swir1]
    outputs: [leak_signature]
    labels: Bounding boxes of confirmed leak locations.
    sources: [Multispectral satellite or aerial imagery with a short-wave infrared band]

  - id: maritime_awareness
    name: Maritime Awareness Detector
    task: detection
    domain: defense
    description: Detects vessels and offshore platforms for maritime domain awareness.
    bands: rgb
    outputs: [vessel, offshore_platform]
    labels: Bounding boxes of vessels and platforms.
    sources: [Very high resolution satellite RGB imagery]

  - id: military_objects_detector
    name: Military Objects Detector
    task: detection
    domain: defense
    description: Detects vehicles, aircraft, vessels and fortified structures for neutral monitoring and verification.
    bands: rgb
    outputs: [vehicle, aircraft, vessel, fortified_structure]
    labels: Bounding boxes of the four object classes.
    sources: [Very high resolution satellite RGB imagery]

  - id: object_detector
    name: Generic Object Detector
    task: detection
    domain: ai
    description: Multi-class detector for common objects in overhead imagery.
    bands: rgb
    outputs: [building, vehicle, ship, aircraft, storage_tank, bridge]
    labels: Bounding boxes of the six object classes.
    sources: [Very high resolution satellite or aerial RGB imagery]

  - id: pivot_inventory
    name: Centre Pivot Inventory
    task: detection
    domain: agriculture
    description: Detects centre pivot irrigation fields for irrigation inventories.
    bands: rgbn
    outputs: [centre_pivot]
    labels: Bounding boxes of centre pivot fields.
    sources: [Sentinel-2 10 m bands, Landsat 8/9, PlanetScope]

  - id: sar_ship_detector
    name: SAR Ship Detector
    task: detection
    domain: sar
    description: Detects ships in synthetic aperture radar backscatter, independent of cloud cover and daylight.
    bands: s1
    outputs: [ship]
    labels: Bounding boxes of ships in SAR images.
    sources: [Sentinel-1 GRD (sigma0 in dB), other C- or X-band SAR]

  - id: security_monitor
    name: Security Monitor
    task: detection
    domain: defense
    description: Detects vehicles, vessels and temporary structures around critical sites.
    bands: rgb
    outputs: [vehicle, vessel, temporary_structure]
    labels: Bounding boxes of the three object classes.
    sources: [Very high resolution satellite or aerial RGB imagery]

  - id: ship_detector
    name: Ship Detector
    task: detection
    domain: ai
    description: Detects ships in optical imagery.
    bands: rgb
    outputs: [ship]
    labels: Bounding boxes of ships.
    sources: [Very high resolution satellite RGB imagery, Sentinel-2 10 m RGB for large vessels]

  - id: target_detector
    name: Target Detector
    task: detection
    domain: defense
    description: Single-class detector for a user-defined object of interest.
    bands: rgb
    outputs: [object_of_interest]
    labels: Bounding boxes of the object of interest.
    sources: [Very high resolution satellite or aerial RGB imagery]

  - id: vehicle_detector
    name: Vehicle Detector
    task: detection
    domain: ai
    description: Detects cars, trucks and buses.
    bands: rgb
    outputs: [car, truck, bus]
    labels: Bounding boxes of vehicles by type.
    sources: [Aerial or satellite RGB imagery, 0.1 to 0.5 m]

  # ---------------------------------------------------------------------------
  # Semantic segmentation (26). U-Net with a per-pixel softmax over classes.
  # Labels: raster masks with one class index per pixel.
  # ---------------------------------------------------------------------------
  - id: cloud_mask
    name: Cloud and Shadow Mask
    task: segmentation
    domain: imaging
    description: Masks clear sky, thick cloud, thin cloud and cloud shadow in Sentinel-2 imagery.
    bands: s2_13
    outputs: [clear, thick_cloud, thin_cloud, cloud_shadow]
    labels: Cloud and shadow masks.
    sources: [Sentinel-2 L1C]

  - id: corridor_monitor
    name: Corridor Monitor
    task: segmentation
    domain: assets
    description: Segments vegetation encroachment and structures in infrastructure corridors.
    bands: rgb
    outputs: [background, vegetation_encroachment, structure]
    labels: Masks of vegetation encroachment and structures.
    sources: [Aerial or satellite RGB imagery, LiDAR-derived orthophotos]

  - id: crop_boundary_delineation
    name: Crop Boundary Delineation
    task: segmentation
    domain: agriculture
    description: Delineates agricultural field boundaries by segmenting field interiors and boundary lines.
    bands: rgbn
    outputs: [background, field_interior, field_boundary]
    labels: Field polygons rasterised into interiors and boundaries.
    sources: [Sentinel-2 10 m bands, PlanetScope]

  - id: crop_classifier
    name: Crop Type Classifier
    task: segmentation
    domain: agriculture
    description: Maps crop types per pixel.
    bands: s2_10
    outputs: [background, wheat, maize, rice, soybean, sunflower, other_crop]
    labels: Crop type masks, for example from farmer declarations.
    sources: [Sentinel-2 L2A]

  - id: desertification_monitor
    name: Desertification Monitor
    task: segmentation
    domain: environment
    description: Classifies land degradation severity in drylands.
    bands: s2_10
    outputs: [not_degraded, low, moderate, severe]
    labels: Degradation severity masks from field surveys.
    sources: [Sentinel-2 L2A, Landsat 8/9]

  - id: digitization_2d
    name: 2D Digitisation
    task: segmentation
    domain: imaging
    description: Segments buildings, roads, water and vegetation for map digitisation.
    bands: rgb
    outputs: [background, building, road, water, vegetation]
    labels: Masks of the four map feature classes.
    sources: [Aerial or satellite RGB imagery]

  - id: erosion_detector
    name: Erosion Detector
    task: segmentation
    domain: environment
    description: Maps eroded soil surfaces and gullies using spectral and terrain inputs.
    bands: rgbn_dem
    outputs: [stable, sheet_erosion, gully]
    labels: Erosion masks.
    sources: [Multispectral imagery with a co-registered DEM]

  - id: forest_monitor
    name: Forest Monitor
    task: segmentation
    domain: forestry
    description: Maps forest cover by forest type.
    bands: s2_10
    outputs: [non_forest, broadleaf, coniferous, mixed]
    labels: Forest type masks.
    sources: [Sentinel-2 L2A]

  - id: infrastructure_monitor
    name: Infrastructure Monitor
    task: segmentation
    domain: assets
    description: Segments roads, railways, buildings and bridges.
    bands: rgb
    outputs: [background, road, railway, building, bridge]
    labels: Infrastructure masks.
    sources: [Aerial or satellite RGB imagery]

  - id: land_degradation_detector
    name: Land Degradation Detector
    task: segmentation
    domain: environment
    description: Separates degraded from non-degraded land.
    bands: s2_10
    outputs: [not_degraded, degraded]
    labels: Degradation masks.
    sources: [Sentinel-2 L2A]

  - id: lulc_classifier
    name: Land Use and Land Cover Classifier
    task: segmentation
    domain: environment
    description: Maps land cover in the eleven classes of ESA WorldCover.
    bands: s2_10
    outputs: [tree_cover, shrubland, grassland, cropland, built_up, bare_sparse, snow_ice, water, herbaceous_wetland, mangroves, moss_lichen]
    labels: Land cover masks, for example ESA WorldCover.
    sources: [Sentinel-2 L2A]

  - id: marine_pollution_detector
    name: Marine Pollution Detector
    task: segmentation
    domain: water
    description: Segments floating debris and surface pollution at sea.
    bands: s2_10
    outputs: [water, floating_debris, oil_sheen]
    labels: Pollution masks.
    sources: [Sentinel-2 L2A]

  - id: multi_solution_segmentation
    name: General Semantic Segmentation
    task: segmentation
    domain: ai
    description: General-purpose semantic segmentation with six common classes.
    bands: rgb
    outputs: [background, building, road, water, vegetation, bare_ground]
    labels: Masks of the six classes.
    sources: [Aerial or satellite RGB imagery]

  - id: plowed_land_detector
    name: Ploughed Land Detector
    task: segmentation
    domain: agriculture
    description: Segments freshly ploughed fields.
    bands: rgbn
    outputs: [background, ploughed]
    labels: Masks of ploughed fields.
    sources: [Sentinel-2 10 m bands, PlanetScope]

  - id: reservoir_monitor
    name: Reservoir Monitor
    task: segmentation
    domain: water
    description: Segments the water surface of reservoirs to track storage.
    bands: rgbn
    outputs: [background, water]
    labels: Water masks.
    sources: [Sentinel-2 10 m bands, Landsat 8/9]

  - id: road_network_analyzer
    name: Road Network Extractor
    task: segmentation
    domain: urban
    description: Extracts road surfaces for road network mapping.
    bands: rgb
    outputs: [background, road]
    labels: Road masks.
    sources: [Aerial or satellite RGB imagery]

  - id: salinity_detector
    name: Soil Salinity Detector
    task: segmentation
    domain: agriculture
    description: Classifies soil salinity levels.
    bands: s2_10
    outputs: [non_saline, slight, moderate, strong]
    labels: Salinity class masks from soil sampling.
    sources: [Sentinel-2 L2A]

  - id: sar_flood_detector
    name: SAR Flood Detector
    task: segmentation
    domain: sar
    description: Maps flooded areas in radar backscatter.
    bands: s1
    outputs: [non_flooded, flooded]
    labels: Flood masks.
    sources: [Sentinel-1 GRD (sigma0 in dB)]

  - id: sar_oil_spill_detector
    name: SAR Oil Spill Detector
    task: segmentation
    domain: sar
    description: Segments oil spills and look-alike dark areas on the sea surface.
    bands: s1_vv
    outputs: [sea, oil_spill, look_alike]
    labels: Oil spill and look-alike masks.
    sources: [Sentinel-1 GRD VV]

  - id: thematic_mapper
    name: Thematic Mapper
    task: segmentation
    domain: imaging
    description: Eight-class thematic mapping for general land cover mapping projects.
    bands: s2_10
    outputs: [artificial, agricultural, forest, grassland, wetland, water, bare, snow_ice]
    labels: Thematic masks.
    sources: [Sentinel-2 L2A]

  - id: topography_mapper
    name: Landform Mapper
    task: segmentation
    domain: imaging
    description: Classifies landforms from a digital elevation model.
    bands: dem
    outputs: [flat, slope, ridge, valley, peak, pit]
    labels: Landform masks, for example geomorphons.
    sources: [Copernicus DEM GLO-30, national DEMs]

  - id: tourist_destination_monitor
    name: Tourist Destination Monitor
    task: segmentation
    domain: tourism
    description: Maps beaches, built-up areas, vegetation and water around tourist destinations.
    bands: rgb
    outputs: [background, beach, built_up, vegetation, water]
    labels: Masks of the land cover classes.
    sources: [Aerial or satellite RGB imagery]

  - id: transportation_mapper
    name: Transportation Mapper
    task: segmentation
    domain: urban
    description: Maps roads, railways, airports and ports.
    bands: rgb
    outputs: [background, road, railway, airport, port]
    labels: Transport infrastructure masks.
    sources: [Aerial or satellite RGB imagery]

  - id: urban_planner
    name: Urban Land Use Mapper
    task: segmentation
    domain: urban
    description: Maps urban land use.
    bands: rgb
    outputs: [background, residential, commercial, industrial, green_space]
    labels: Urban land use masks.
    sources: [Aerial or satellite RGB imagery]

  - id: utility_mapper
    name: Utility Mapper
    task: segmentation
    domain: assets
    description: Segments power lines, pipeline corridors and substations.
    bands: rgb
    outputs: [background, power_line, pipeline_corridor, substation]
    labels: Utility masks.
    sources: [Aerial RGB imagery]

  - id: water_surface_detector
    name: Water Surface Detector
    task: segmentation
    domain: water
    description: Segments open water surfaces.
    bands: rgbn
    outputs: [background, water]
    labels: Water masks.
    sources: [Sentinel-2 10 m bands, Landsat 8/9, PlanetScope]

  # ---------------------------------------------------------------------------
  # Change detection (6). U-Net on two co-registered acquisitions stacked on
  # the channel axis (early fusion). Labels: change masks.
  # ---------------------------------------------------------------------------
  - id: asset_condition_change
    name: Asset Condition Change
    task: change_detection
    domain: assets
    description: Detects changes in the condition of infrastructure assets between two dates.
    bands: rgb
    dates: 2
    outputs: [no_change, deterioration, repair]
    labels: Change masks.
    sources: [Co-registered very high resolution RGB image pairs]

  - id: change_detector
    name: Change Detector
    task: change_detection
    domain: ai
    description: Binary change detection between two dates.
    bands: rgb
    dates: 2
    outputs: [no_change, change]
    labels: Binary change masks.
    sources: [Co-registered RGB image pairs]

  - id: construction_monitor
    name: Construction Monitor
    task: change_detection
    domain: urban
    description: Detects new construction and demolition between two dates.
    bands: rgb
    dates: 2
    outputs: [no_change, new_construction, demolition]
    labels: Construction change masks.
    sources: [Co-registered very high resolution RGB image pairs]

  - id: deforestation_detector
    name: Deforestation Detector
    task: change_detection
    domain: forestry
    description: Detects forest loss between two dates.
    bands: s2_10
    dates: 2
    outputs: [no_change, forest_loss]
    labels: Forest loss masks.
    sources: [Sentinel-2 L2A image pairs]

  - id: protected_area_change_detector
    name: Protected Area Change Detector
    task: change_detection
    domain: environment
    description: Detects land cover change inside protected areas.
    bands: s2_10
    dates: 2
    outputs: [no_change, vegetation_loss, new_structure, other_change]
    labels: Change masks by change type.
    sources: [Sentinel-2 L2A image pairs]

  - id: urban_growth_assessor
    name: Urban Growth Assessor
    task: change_detection
    domain: urban
    description: Detects new built-up area between two dates.
    bands: s2_10
    dates: 2
    outputs: [no_change, urban_expansion]
    labels: Urban expansion masks.
    sources: [Sentinel-2 L2A image pairs, Landsat 8/9 image pairs]

  # ---------------------------------------------------------------------------
  # Dense regression (36). U-Net with a per-pixel regression output.
  # Labels: reference rasters of the target variable.
  # ---------------------------------------------------------------------------
  - id: accessibility_analyzer
    name: Accessibility Analyser
    task: dense_regression
    domain: tourism
    description: Estimates travel time to the nearest service centre per pixel.
    bands: context
    outputs: [travel_time]
    units: [min]
    labels: Travel time rasters from network analysis or surveys.
    sources: [Sentinel-2 L2A, Copernicus DEM, population and road distance rasters]

  - id: beekeeping_suitability
    name: Beekeeping Suitability
    task: dense_regression
    domain: agriculture
    description: Scores the suitability of land for apiaries.
    bands: s2_dem
    outputs: [suitability]
    units: ["1"]
    range: [0, 1]
    labels: Suitability scores from expert assessment or productivity records.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: crop_growth_monitor
    name: Crop Growth Monitor
    task: dense_regression
    domain: agriculture
    description: Estimates leaf area index as a measure of crop growth.
    bands: s2_10
    outputs: [leaf_area_index]
    units: [m2 m-2]
    range: [0, 8]
    labels: Leaf area index measurements or reference products.
    sources: [Sentinel-2 L2A]

  - id: crop_health_assessor
    name: Crop Health Assessor
    task: dense_regression
    domain: agriculture
    description: Scores crop health per pixel.
    bands: s2_10
    outputs: [health_score]
    units: ["1"]
    range: [0, 1]
    labels: Crop health scores from field inspection.
    sources: [Sentinel-2 L2A]

  - id: drought_monitor
    name: Drought Monitor
    task: dense_regression
    domain: environment
    description: Estimates a drought severity index.
    bands: s2_10
    outputs: [drought_severity]
    units: ["1"]
    range: [0, 1]
    labels: Drought index rasters, for example from soil moisture products.
    sources: [Sentinel-2 L2A, Landsat 8/9]

  - id: energy_potential
    name: Energy Potential
    task: dense_regression
    domain: energy
    description: Estimates annual solar energy potential per pixel.
    bands: s2_dem
    outputs: [solar_potential]
    units: [kWh m-2 a-1]
    labels: Solar potential rasters from irradiance models.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: environmental_risk
    name: Environmental Risk
    task: dense_regression
    domain: risk
    description: Scores combined environmental risk.
    bands: context
    outputs: [risk_score]
    units: ["1"]
    range: [0, 1]
    labels: Environmental risk scores.
    sources: [Sentinel-2 L2A, Copernicus DEM, population and road distance rasters]

  - id: flood_risk
    name: Flood Risk
    task: dense_regression
    domain: water
    description: Estimates flood susceptibility per pixel.
    bands: s2_dem
    outputs: [flood_susceptibility]
    units: ["1"]
    range: [0, 1]
    labels: Flood susceptibility from historical flood extents or hydraulic models.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: forest_density_estimator
    name: Forest Density Estimator
    task: dense_regression
    domain: forestry
    description: Estimates tree canopy cover.
    bands: s2_10
    outputs: [canopy_cover]
    units: ["1"]
    range: [0, 1]
    labels: Canopy cover fraction from LiDAR or high resolution imagery.
    sources: [Sentinel-2 L2A]

  - id: grazing_potential
    name: Grazing Potential
    task: dense_regression
    domain: agriculture
    description: Estimates forage biomass available for grazing.
    bands: s2_10
    outputs: [forage_biomass]
    units: [kg ha-1]
    labels: Biomass samples from rangeland surveys.
    sources: [Sentinel-2 L2A]

  - id: hazard_vulnerability
    name: Hazard Vulnerability
    task: dense_regression
    domain: risk
    description: Scores vulnerability of the built environment to natural hazards.
    bands: context
    outputs: [vulnerability]
    units: ["1"]
    range: [0, 1]
    labels: Vulnerability scores from exposure models or loss data.
    sources: [Sentinel-2 L2A, Copernicus DEM, population and road distance rasters]

  - id: landslide_risk
    name: Landslide Susceptibility
    task: dense_regression
    domain: risk
    description: Estimates landslide susceptibility.
    bands: s2_dem
    outputs: [susceptibility]
    units: ["1"]
    range: [0, 1]
    labels: Landslide inventories converted to susceptibility targets.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: mobility_analyzer
    name: Mobility Analyser
    task: dense_regression
    domain: urban
    description: Estimates traffic intensity per pixel on the road network.
    bands: context
    outputs: [traffic_intensity]
    units: [vehicles h-1]
    labels: Traffic counts interpolated along roads.
    sources: [Sentinel-2 L2A, road distance and population rasters]

  - id: perennial_garden_suitability
