    description: Detects individual buildings as bounding boxes.  # What the model does once trained.
    bands: rgb  # Band set rgb, 3 inputs.
    outputs: [building]  # 1 output channel.
    labels: Bounding boxes of building footprints.  # Reference data needed for training.
    sources: [Very high resolution satellite or aerial RGB imagery, 0.3 to 1 m]  # Suitable input data.

