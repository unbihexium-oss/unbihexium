    bands: s2_dem
    outputs: [value]
    units: [user defined]
    labels: Point samples rasterised as sparse targets.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: spatial_relationship
    name: Proximity Estimator
    task: dense_regression
    domain: analysis
    description: Estimates the distance to the nearest mapped feature of interest.
    bands: rgbn
    outputs: [distance]
    units: [m]
    labels: Distance rasters derived from reference vector data.
    sources: [Sentinel-2 10 m bands, PlanetScope]

  - id: natural_resources_monitor
    name: Natural Resources Monitor
    task: dense_regression
    domain: environment
    description: Estimates above-ground biomass.
    bands: s2_s1
    outputs: [above_ground_biomass]
    units: [Mg ha-1]
    labels: Biomass plots or LiDAR-derived biomass rasters.
