  - id: environmental_monitor
    name: Environmental Condition Monitor
    task: dense_regression
    domain: environment
    description: Scores the ecological condition of land.
    bands: s2_10
    outputs: [condition]
    units: ["1"]
    range: [0, 1]
    labels: Ecological condition scores from field assessment.
    sources: [Sentinel-2 L2A]

  - id: network_analyzer
    name: Road Network Density Estimator
    task: dense_regression
    domain: urban
    description: Estimates road network density as road length per square kilometre.
    bands: rgbn
    outputs: [road_density]
    units: [km km-2]
    labels: Road density rasters derived from road vector data.
    sources: [Sentinel-2 10 m bands, PlanetScope]

  - id: watershed_manager
    name: Runoff Estimator
    task: dense_regression
    domain: water
    description: Estimates a runoff coefficient per pixel for watershed management.
    bands: s2_dem
    outputs: [runoff_coefficient]
    units: ["1"]
    range: [0, 1]
    labels: Runoff coefficients from hydrological models.
    sources: [Sentinel-2 L2A, Copernicus DEM]

  - id: hydroelectric_monitor
    name: Hydroelectric Reservoir Level Estimator
    task: dense_regression
    domain: energy
    description: Estimates water surface elevation of reservoirs.
    bands: rgbn_dem
    outputs: [water_surface_elevation]
    units: [m]
    labels: Reservoir level records.
    sources: [Sentinel-2 10 m bands, Copernicus DEM]

  - id: offshore_survey
    name: Bathymetry Estimator
    task: dense_regression
    domain: water
    description: Estimates shallow water depth (satellite-derived bathymetry).
    bands: s2_10
    outputs: [depth]
    units: [m]
    range: [0, 30]
    labels: Echo sounding or LiDAR bathymetry.
    sources: [Sentinel-2 L2A]

  - id: onshore_monitor
    name: Surface Temperature Anomaly
    task: dense_regression
    domain: energy
    description: Estimates land surface temperature anomalies around onshore industrial facilities.
    bands: landsat_st
    outputs: [temperature_anomaly]
    units: [K]
    labels: Surface temperature anomaly rasters.
    sources: [Landsat 8/9 Collection 2 Level 2]

  - id: field_surveyor
    name: Field Productivity Estimator
    task: dense_regression
    domain: agriculture
    description: Estimates within-field productivity zones as relative yield.
    bands: s2_10
    outputs: [relative_yield]
    units: ["1"]
    range: [0, 2]
    labels: Yield monitor data normalised by the field mean.
    sources: [Sentinel-2 L2A]

  # ---------------------------------------------------------------------------
  # Scene regression (11). Encoder with global pooling and a regression head:
  # one value per target for a whole image chip.
  # Labels: one target vector per chip.
  # ---------------------------------------------------------------------------
  - id: yield_predictor
    name: Yield Predictor
    task: scene_regression
    domain: agriculture
    description: Predicts crop yield of a field chip.
    bands: s2_10
    outputs: [yield]
    units: [t ha-1]
    labels: Field-level yield records.
    sources: [Sentinel-2 L2A]

  - id: business_valuation
    name: Economic Activity Estimator
    task: scene_regression
    domain: analysis
    description: Estimates an economic activity index of an area from imagery.
    bands: rgbn
    outputs: [activity_index]
    units: ["1"]
    labels: Economic indicators aggregated to chips.
    sources: [Sentinel-2 10 m bands, night lights composites]

  - id: economic_spatial_assessor
    name: Property Value Estimator
    task: scene_regression
    domain: analysis
    description: Estimates median property value of an area.
    bands: rgb
    outputs: [median_value]
    units: [currency m-2]
    labels: Property transaction statistics aggregated to chips.
    sources: [Aerial or satellite RGB imagery]

  - id: insurance_underwriting
    name: Insurance Risk Scorer
    task: scene_regression
    domain: risk
    description: Scores the natural hazard risk of an insured site.
    bands: context
    outputs: [hazard_score, exposure_score]
    units: ["1", "1"]
    range: [0, 1]
    labels: Claims history or risk model scores per site.
    sources: [Sentinel-2 L2A, Copernicus DEM, population and road distance rasters]

  - id: livestock_estimator
    name: Livestock Estimator
    task: scene_regression
    domain: agriculture
    description: Estimates the number of livestock in a chip.
    bands: rgb
    outputs: [head_count]
    units: [animals]
    labels: Livestock counts per chip.
    sources: [Very high resolution RGB imagery]

  - id: resource_allocation
    name: Service Demand Estimator
    task: scene_regression
    domain: analysis
    description: Estimates population and service demand of an area for resource allocation.
    bands: rgbn
    outputs: [population, service_demand]
    units: [persons, "1"]
    labels: Census population and service statistics per chip.
    sources: [Sentinel-2 10 m bands, PlanetScope]

  - id: disaster_management
    name: Disaster Impact Estimator
    task: scene_regression
    domain: risk
    description: Estimates the fraction of an area affected by a disaster.
    bands: s2_10
    outputs: [affected_fraction]
    units: ["1"]
    range: [0, 1]
    labels: Affected area fractions from damage assessments.
    sources: [Sentinel-2 L2A]

  - id: emergency_disaster_manager
    name: Emergency Needs Estimator
    task: scene_regression
    domain: risk
    description: Estimates affected population and shelter needs after a disaster.
    bands: rgbn
    outputs: [affected_population, shelter_need]
    units: [persons, persons]
    labels: Affected population and shelter statistics per chip.
    sources: [Sentinel-2 10 m bands, very high resolution imagery]

  - id: preparedness_manager
    name: Preparedness Scorer
    task: scene_regression
    domain: risk
    description: Scores the disaster preparedness of a community area.
    bands: context
    outputs: [preparedness]
    units: ["1"]
    range: [0, 1]
    labels: Preparedness scores from surveys.
    sources: [Sentinel-2 L2A, Copernicus DEM, population and road distance rasters]

  - id: timeseries_analyzer
    name: Phenology Estimator
    task: scene_regression
    domain: agriculture
    description: Estimates start, peak and end of season from a stack of six NDVI observations.
    bands: [ndvi_t1, ndvi_t2, ndvi_t3, ndvi_t4, ndvi_t5, ndvi_t6]
    outputs: [start_of_season, peak_of_season, end_of_season]
    units: [day of year, day of year, day of year]
    labels: Phenology dates from field observation or reference products.
    sources: [Sentinel-2 L2A time series, Landsat 8/9 time series]

  - id: zonal_statistics
    name: Zonal Cover Estimator
    task: scene_regression
    domain: analysis
    description: Estimates the fractional cover of vegetation, water and built-up area in a chip.
    bands: s2_10
    outputs: [vegetation_fraction, water_fraction, built_up_fraction]
    units: ["1", "1", "1"]
    range: [0, 1]
    labels: Cover fractions per chip from reference land cover maps.
    sources: [Sentinel-2 L2A]

  # ---------------------------------------------------------------------------
  # Terrain and geophysical regression (13). U-Net regression of heights,
  # displacements and physical quantities. Labels: reference rasters.
  # ---------------------------------------------------------------------------
  - id: dem_generator
    name: DEM from Stereo
    task: dense_regression
    domain: imaging
    description: Estimates terrain elevation from a panchromatic stereo pair.
    bands: pan_pair
    outputs: [elevation]
    units: [m]
    labels: Reference DEMs, for example LiDAR.
    sources: [Epipolar-rectified panchromatic stereo pairs]

  - id: digitization_3d
    name: Building Height Estimator
    task: dense_regression
    domain: urban
    description: Estimates building heights from imagery and a surface model.
    bands: rgb_dsm
    outputs: [building_height]
    units: [m]
    labels: Building heights from LiDAR or cadastral 3D models.
    sources: [RGB orthophotos with a DSM]

  - id: dsm_generator
    name: DSM from Stereo
    task: dense_regression
    domain: imaging
    description: Estimates surface elevation including buildings and trees from a stereo pair.
    bands: pan_pair
    outputs: [surface_elevation]
    units: [m]
    labels: Reference DSMs, for example LiDAR.
    sources: [Epipolar-rectified panchromatic stereo pairs]

  - id: dtm_generator
    name: DTM from DSM
    task: dense_regression
    domain: imaging
    description: Removes buildings and vegetation from a surface model to estimate bare ground elevation.
    bands: dsm
    outputs: [ground_elevation]
    units: [m]
    labels: Reference DTMs, for example LiDAR ground returns.
    sources: [Photogrammetric or radar DSMs]

  - id: ground_displacement
    name: Ground Displacement Estimator
    task: dense_regression
    domain: sar
    description: Estimates line-of-sight ground displacement from a wrapped interferogram.
    bands: insar
    outputs: [los_displacement]
    units: [mm]
    labels: Unwrapped displacement from InSAR processing or GNSS.
    sources: [Sentinel-1 SLC interferograms]

  - id: land_surface_temperature
    name: Land Surface Temperature
    task: dense_regression
    domain: environment
    description: Estimates land surface temperature from reflective and thermal bands.
    bands: landsat_st
    outputs: [surface_temperature]
    units: [K]
    labels: Land surface temperature products or in situ radiometry.
    sources: [Landsat 8/9 Collection 2 Level 2]

  - id: model_3d
    name: Normalised Surface Model
    task: dense_regression
    domain: imaging
    description: Estimates the height of objects above ground (nDSM) from imagery and a surface model.
    bands: rgb_dsm
    outputs: [object_height]
    units: [m]
    labels: nDSM from LiDAR.
    sources: [RGB orthophotos with a DSM]

  - id: sar_amplitude
    name: SAR Backscatter Normaliser
    task: dense_regression
    domain: sar
    description: Estimates terrain-flattened gamma0 backscatter from sigma0 and elevation.
    bands: [VV, VH, elevation]
    outputs: [gamma0_vv, gamma0_vh]
    units: [dB, dB]
    labels: Terrain-flattened gamma0 from radiometric terrain correction.
    sources: [Sentinel-1 GRD, Copernicus DEM]

  - id: sar_phase_displacement
    name: InSAR Phase Unwrapper
    task: dense_regression
    domain: sar
    description: Estimates unwrapped phase from a wrapped interferogram.
    bands: insar
    outputs: [unwrapped_phase]
    units: [rad]
    labels: Unwrapped phase from SNAPHU or similar processing.
    sources: [Sentinel-1 SLC interferograms]

  - id: sar_subsidence_monitor
    name: Subsidence Velocity Estimator
    task: dense_regression
    domain: sar
    description: Estimates mean subsidence velocity from a stack of six displacement maps.
    bands: insar_stack
    outputs: [velocity]
    units: [mm a-1]
    labels: Velocity from persistent scatterer or SBAS processing.
    sources: [Sentinel-1 InSAR time series]

  - id: stereo_processor
    name: Stereo Disparity Estimator
    task: dense_regression
    domain: imaging
    description: Estimates disparity between the two images of an epipolar stereo pair.
    bands: pan_pair
    outputs: [disparity]
    units: [px]
    labels: Reference disparity maps.
    sources: [Epipolar-rectified stereo pairs]

  - id: tree_height_estimator
    name: Canopy Height Estimator
    task: dense_regression
    domain: forestry
    description: Estimates canopy height from optical and radar data.
    bands: s2_s1
    outputs: [canopy_height]
    units: [m]
    range: [0, 60]
    labels: Canopy height from airborne or spaceborne LiDAR.
    sources: [Sentinel-2 L2A, Sentinel-1 GRD]

  - id: tri_stereo_processor
    name: DSM from Tri-Stereo
    task: dense_regression
    domain: imaging
    description: Estimates surface elevation from a tri-stereo acquisition.
    bands: pan_triplet
    outputs: [surface_elevation]
    units: [m]
    labels: Reference DSMs.
    sources: [Epipolar-rectified tri-stereo panchromatic imagery]

  # ---------------------------------------------------------------------------
  # Enhancement (11). Residual U-Net image-to-image networks.
  # Labels: target images, displacement fields or clean references.
  # ---------------------------------------------------------------------------
  - id: coregistration
    name: Co-registration Flow Estimator
    task: enhancement
    domain: imaging
    description: Estimates the pixel displacement field that aligns a moving image to a reference image.
    bands: rgb
    dates: 2
    outputs: [dx, dy]
    units: [px, px]
    labels: Displacement fields, for example from synthetic warps of a reference image.
    sources: [RGB image pairs of the same area]

  - id: mosaic_processor
    name: Mosaic Colour Harmoniser
    task: enhancement
    domain: imaging
    description: Harmonises the radiometry of a scene to a reference for seamless mosaics.
    bands: rgb
    outputs: [red, green, blue]
    labels: Radiometrically harmonised reference scenes.
    sources: [RGB scenes of overlapping areas]

  - id: mosaicking
    name: Seamline Blender
    task: enhancement
    domain: imaging
    description: Blends two overlapping scenes into one seamless image.
    bands: rgb
    dates: 2
    outputs: [red, green, blue]
    labels: Seamlessly blended reference mosaics.
    sources: [Overlapping RGB scenes]

  - id: multispectral_processor
    name: Multispectral Denoiser
    task: enhancement
    domain: imaging
    description: Reduces noise and striping in multispectral imagery.
    bands: s2_10
    outputs: [B02, B03, B04, B05, B06, B07, B08, B8A, B11, B12]
    labels: Clean reference images, for example temporal composites.
    sources: [Sentinel-2 L2A]

  - id: ortho_processor
    name: Orthorectification Flow Estimator
    task: enhancement
    domain: imaging
    description: Estimates the displacement field that removes relief displacement using a DEM.
    bands: image_dem
    outputs: [dx, dy]
    units: [px, px]
    labels: Displacement fields from rigorous orthorectification.
    sources: [Raw imagery with a co-registered DEM]

  - id: orthorectification
    name: Learned Orthorectification
    task: enhancement
    domain: imaging
    description: Produces an orthorectified image from a raw image and a DEM.
    bands: image_dem
    outputs: [red, green, blue]
    labels: Orthorectified reference images.
    sources: [Raw imagery with a co-registered DEM]

  - id: panchromatic_processor
    name: Panchromatic Denoiser
    task: enhancement
    domain: imaging
    description: Reduces noise in panchromatic imagery.
    bands: pan
    outputs: [pan]
    labels: Clean panchromatic references.
    sources: [Panchromatic satellite imagery]

  - id: pansharpening
    name: Pansharpening
    task: enhancement
    domain: imaging
    description: Fuses upsampled multispectral bands with the panchromatic band into a sharpened multispectral image.
    bands: ms_pan
    outputs: [blue, green, red, nir]
    labels: Sharpened references, for example by Wald's protocol.
    sources: [Multispectral and panchromatic bands of the same sensor]

  - id: raster_tiler
    name: Tile Radiometric Normaliser
    task: enhancement
    domain: imaging
    description: Normalises the radiometry of individual tiles before tiling into a web map.
    bands: rgb
    outputs: [red, green, blue]
    labels: Radiometrically normalised reference tiles.
    sources: [RGB tiles]

  - id: sar_mapping_workflow
    name: SAR Despeckler
    task: enhancement
    domain: sar
    description: Removes speckle from dual-polarisation SAR backscatter.
    bands: s1
    outputs: [VV, VH]
    labels: Multi-temporal averages as speckle-free references.
    sources: [Sentinel-1 GRD]

  - id: synthetic_imagery
    name: SAR to Optical Translator
    task: enhancement
    domain: ai
    description: Synthesises an optical RGB image from SAR backscatter, for example to fill cloud gaps.
    bands: s1
    outputs: [red, green, blue]
    labels: Co-located cloud-free optical images.
    sources: [Sentinel-1 GRD with co-located Sentinel-2 L2A]

  # ---------------------------------------------------------------------------
  # Super-resolution (1). Residual network with sub-pixel convolution.
  # Labels: high resolution images; inputs are downsampled copies.
  # ---------------------------------------------------------------------------
  - id: super_resolution
    name: Super-Resolution
    task: super_resolution
    domain: imaging
    description: Increases the spatial resolution of RGB imagery by a factor of four.
    bands: rgb
    outputs: [red, green, blue]
    scale: 4
    labels: High resolution reference images.
    sources: [Pairs of low and high resolution RGB imagery]

  # ---------------------------------------------------------------------------
  # Spectral indices (7). Exact implementations of published formulas as
  # network modules, so that they run in the same pipelines and export to
  # ONNX. They need no training.
  # ---------------------------------------------------------------------------
  - id: evi_calculator
    name: EVI Calculator
    task: spectral_index
    domain: indices
    description: Enhanced Vegetation Index, 2.5 (NIR - RED) / (NIR + 6 RED - 7.5 BLUE + 1) (Huete et al., 2002).
    bands: [blue, red, nir]
    outputs: [evi]
    formula: evi
    labels: None, the formula needs no training.
    sources: [Surface reflectance from Sentinel-2, Landsat or similar sensors]

  - id: msi_calculator
    name: MSI Calculator
    task: spectral_index
    domain: indices
    description: Moisture Stress Index, SWIR1 / NIR (Rock et al., 1986).
    bands: [nir, swir1]
    outputs: [msi]
    formula: msi
    labels: None, the formula needs no training.
    sources: [Surface reflectance from Sentinel-2, Landsat or similar sensors]

  - id: nbr_calculator
    name: NBR Calculator
    task: spectral_index
    domain: indices
    description: Normalized Burn Ratio, (NIR - SWIR2) / (NIR + SWIR2) (Key and Benson, 2006).
    bands: [nir, swir2]
    outputs: [nbr]
    formula: nbr
    labels: None, the formula needs no training.
    sources: [Surface reflectance from Sentinel-2, Landsat or similar sensors]

  - id: ndvi_calculator
    name: NDVI Calculator
    task: spectral_index
    domain: indices
    description: Normalized Difference Vegetation Index, (NIR - RED) / (NIR + RED) (Rouse et al., 1974).
    bands: [red, nir]
    outputs: [ndvi]
    formula: ndvi
    labels: None, the formula needs no training.
    sources: [Surface reflectance from Sentinel-2, Landsat or similar sensors]

  - id: ndwi_calculator
    name: NDWI Calculator
    task: spectral_index
    domain: indices
    description: Normalized Difference Water Index, (GREEN - NIR) / (GREEN + NIR) (McFeeters, 1996).
    bands: [green, nir]
    outputs: [ndwi]
    formula: ndwi
    labels: None, the formula needs no training.
    sources: [Surface reflectance from Sentinel-2, Landsat or similar sensors]

  - id: savi_calculator
    name: SAVI Calculator
    task: spectral_index
    domain: indices
    description: Soil Adjusted Vegetation Index, 1.5 (NIR - RED) / (NIR + RED + 0.5) (Huete, 1988).
    bands: [red, nir]
    outputs: [savi]
    formula: savi
    labels: None, the formula needs no training.
    sources: [Surface reflectance from Sentinel-2, Landsat or similar sensors]

  - id: vegetation_condition
    name: Vegetation Condition Index
    task: spectral_index
    domain: indices
    description: Vegetation Condition Index, (NDVI - NDVImin) / (NDVImax - NDVImin) (Kogan, 1995).
    bands: ndvi_stats
    outputs: [vci]
    formula: vci
    labels: None, the formula needs no training.
    sources: [NDVI with its multi-year per-pixel minimum and maximum]
